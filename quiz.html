<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>허제니 퀴즈 아레나 | 멍청이 챔피언스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #050711;
  --panel-bg: rgba(11, 17, 32, 0.88);
  --panel-border: rgba(0, 230, 255, 0.22);
  --p1-cyan: #00f0ff;
  --p1-glow: rgba(0, 240, 255, 0.4);
  --p1-dark: rgba(0, 240, 255, 0.12);
  --p2-pink: #ff0055;
  --p2-glow: rgba(255, 0, 85, 0.4);
  --p2-dark: rgba(255, 0, 85, 0.12);
  --gold: #ffb703;
  --gold-glow: rgba(255, 183, 3, 0.5);
  --success: #00ff88;
  --danger: #ff2a4b;
  --text-main: #f0f6ff;
  --text-muted: #8899b8;
  --font-num: 'Orbitron', -apple-system, sans-serif;
  --font-kr: 'Noto Sans KR', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background-color: var(--bg-dark);
  color: var(--text-main);
  font-family: var(--font-kr);
}

#bg-canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

.ambient-scanline {
  position: fixed;
  inset: 0;
  background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
  background-size: 100% 3px, 6px 100%;
  pointer-events: none;
  z-index: 999;
  opacity: 0.55;
}

.app {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  padding: 1.2vh 1.4vw;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 18px;
  height: 52px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 4px;
  backdrop-filter: blur(14px);
  margin-bottom: 1vh;
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, var(--gold), #ff4d00);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  display: grid; place-items: center; font-size: 17px;
  box-shadow: 0 0 15px var(--gold-glow);
}
.brand-title { display: flex; align-items: center; gap: 8px; }
.brand-title h1 {
  font-size: 16px; font-weight: 900;
  background: linear-gradient(90deg, #fff, var(--p1-cyan));
  -webkit-background-clip: text; color: transparent;
}
.brand-badge {
  font-size: 10px; color: var(--gold);
  font-weight: 800; background: rgba(255,183,3,0.15);
  border: 1px solid rgba(255,183,3,0.3); padding: 2px 7px; border-radius: 2px;
}
.top-actions { display: flex; gap: 8px; }
.btn {
  font-family: var(--font-kr);
  font-size: 13px; font-weight: 800;
  padding: 6px 14px; border-radius: 3px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main); cursor: pointer;
  transition: all 0.16s ease;
}
.btn:hover:not(:disabled) {
  border-color: var(--p1-cyan); background: rgba(0, 240, 255, 0.15);
  box-shadow: 0 0 12px var(--p1-glow);
}
.btn.primary {
  background: linear-gradient(135deg, #0084ff, #00f0ff);
  border: none; color: #020914; font-weight: 900;
  box-shadow: 0 0 18px var(--p1-glow);
}
.btn.danger {
  border-color: var(--danger); color: var(--danger);
  background: rgba(255, 42, 75, 0.1);
}

.stage {
  flex: 1;
  position: relative;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  backdrop-filter: blur(20px);
  overflow: hidden;
  display: flex;
}
.screen {
  width: 100%;
  height: 100%;
  display: none;
}
.screen.active {
  display: flex;
  flex-direction: column;
}

.setup-container {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 2vh 2vw;
  text-align: center;
}
.hero-title {
  font-size: clamp(28px, 3.8vw, 48px);
  font-weight: 900; margin: 10px 0;
}
.hero-title span {
  background: linear-gradient(90deg, var(--gold), #ff4800);
  -webkit-background-clip: text; color: transparent;
}
.setup-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 12px; margin: 18px 0; text-align: left;
}
.field {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 12px; border-radius: 4px;
}
.field label {
  display: block; font-size: 12px; font-weight: 800;
  color: var(--p1-cyan); margin-bottom: 6px;
}
.field input, .field select {
  width: 100%; background: #070d1e; color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 9px 12px; font-size: 14px; outline: none; border-radius: 3px;
}

.arena-grid {
  display: grid;
  grid-template-columns: 330px 1fr 330px;
  width: 100%;
  height: 100%;
  gap: 14px;
  padding: 14px;
}

.player-station {
  display: flex;
  flex-direction: column;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 4px;
  padding: 14px;
  position: relative;
  overflow: hidden;
}
.player-station.blue { border-top: 4px solid var(--p1-cyan); }
.player-station.pink { border-top: 4px solid var(--p2-pink); }
.player-station.blue.selected { border-color: var(--p1-cyan); box-shadow: 0 0 25px var(--p1-dark); }
.player-station.pink.selected { border-color: var(--p2-pink); box-shadow: 0 0 25px var(--p2-dark); }

.station-head {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding-bottom: 8px; margin-bottom: 10px;
}
.player-name { font-size: 18px; font-weight: 900; }
.blue .player-name { color: var(--p1-cyan); }
.pink .player-name { color: var(--p2-pink); }
.score { font-family: var(--font-num); font-size: 24px; font-weight: 900; }
.blue .score { color: var(--p1-cyan); }
.pink .score { color: var(--p2-pink); }

.player-meta {
  display: flex; justify-content: space-between;
  font-size: 12px; color: var(--text-muted); font-weight: 700;
  margin-bottom: 10px;
}

.answer-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  flex: 1;
}
.answer {
  flex: 1;
  min-height: 52px;
  background: rgba(7, 12, 24, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #dbe4f3;
  padding: 8px 12px;
  border-radius: 3px;
  font-size: 14px;
  font-weight: 800;
  text-align: left;
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: all 0.15s ease;
}
.answer:hover:not(:disabled) { transform: translateX(2px); }
.blue .answer:hover:not(:disabled) { border-color: var(--p1-cyan); box-shadow: 0 0 12px var(--p1-glow); }
.pink .answer:hover:not(:disabled) { border-color: var(--p2-pink); box-shadow: 0 0 12px var(--p2-glow); }

.answer .letter {
  width: 24px; height: 24px;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 2px;
  display: grid; place-items: center;
  font-family: var(--font-num); font-size: 12px;
  margin-right: 8px; flex-shrink: 0;
}
.blue .answer.chosen { background: var(--p1-dark); border-color: var(--p1-cyan); color: #fff; box-shadow: 0 0 15px var(--p1-glow); }
.pink .answer.chosen { background: var(--p2-dark); border-color: var(--p2-pink); color: #fff; box-shadow: 0 0 15px var(--p2-glow); }
.answer.is-correct { background: rgba(0, 255, 136, 0.25) !important; border-color: var(--success) !important; color: #a8ffd7 !important; }
.answer.is-wrong { background: rgba(255, 42, 75, 0.25) !important; border-color: var(--danger) !important; color: #ffb8c3 !important; }

.station-footer {
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.confidence-head {
  display: flex; justify-content: space-between;
  font-size: 11px; font-weight: 800; color: var(--text-muted);
  margin-bottom: 6px;
}
.confidence-value { font-family: var(--font-num); color: var(--gold); }
.confidence-options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.conf-btn {
  font-size: 11px; font-weight: 800; padding: 6px 0;
  background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.12);
  color: var(--text-muted); cursor: pointer; border-radius: 2px;
}
.conf-btn.active { border-color: var(--gold); background: rgba(255, 183, 3, 0.15); color: #fff; }
.player-status { font-size: 11px; color: var(--text-muted); margin-top: 6px; min-height: 16px; font-weight: 700; text-align: center; }

.center-station {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 10px 14px;
}
.center-hud-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.round-badge {
  background: rgba(255, 183, 3, 0.12); border: 1px solid var(--gold);
  color: var(--gold); padding: 4px 12px; font-size: 13px;
  font-weight: 900; font-family: var(--font-num);
}
.progress-wrap { flex: 1; height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 99px; overflow: hidden; }
.progress { height: 100%; width: 0%; background: linear-gradient(90deg, var(--p1-cyan), var(--p2-pink)); transition: width 0.3s ease; }
.timer {
  font-family: var(--font-num); font-size: 26px; font-weight: 900;
  min-width: 65px; text-align: right; color: var(--p1-cyan);
}
.timer.urgent { color: var(--danger); animation: timerBlink 0.5s infinite alternate; }
@keyframes timerBlink { to { transform: scale(1.1); } }

.question-box {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 10px 20px;
}
.category {
  font-size: 12px; font-weight: 800; color: var(--gold);
  background: rgba(255, 183, 3, 0.1); border: 1px solid rgba(255, 183, 3, 0.3);
  padding: 4px 14px; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%);
  margin-bottom: 10px;
}
.question {
  font-size: clamp(19px, 2.1vw, 30px);
  font-weight: 900; line-height: 1.35;
  text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
  margin-bottom: 10px; max-width: 900px;
}
.question-sub { font-size: 13px; color: var(--text-muted); }

.reveal-banner {
  display: none;
  width: 100%; max-width: 820px;
  margin: 10px auto 0; padding: 10px 18px;
  background: rgba(0, 255, 136, 0.08); border: 1px solid var(--success);
  border-radius: 4px; text-align: center;
}
.reveal-banner.show { display: block; animation: bannerPop 0.25s ease; }
@keyframes bannerPop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
.reveal-banner strong { color: var(--success); font-size: 16px; font-weight: 900; }
.reveal-banner p { margin-top: 4px; font-size: 13px; color: #d8fced; line-height: 1.45; }

.controls-bar {
  display: flex; justify-content: center; gap: 10px;
  padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.controls-bar .btn { padding: 9px 18px; font-size: 14px; }

.result-container {
  width: 100%; max-width: 950px;
  margin: auto; padding: 2vh 2vw; text-align: center;
}
.result-title { font-size: clamp(26px, 3.5vw, 42px); font-weight: 900; }
.winner-card {
  margin: 16px auto; padding: 20px;
  background: radial-gradient(circle at 50% 0%, rgba(255,183,3,0.18), transparent 70%), var(--panel-bg);
  border: 1px solid var(--gold); border-radius: 6px;
}
.crown { font-size: 46px; }
.winner-name { font-size: 32px; font-weight: 900; color: var(--gold); margin: 6px 0; }
.result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; text-align: left; margin: 16px 0; }
.result-player { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); padding: 14px; border-radius: 4px; }
.stat-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.06); }
.stat-row b { color: #fff; }

.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px);
  background: #fff; color: #050811; font-weight: 900; font-size: 14px;
  padding: 9px 20px; border-radius: 4px; opacity: 0; pointer-events: none;
  transition: all 0.22s ease; z-index: 9999;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div class="ambient-scanline"></div>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">⚡</div>
      <div class="brand-title">
        <span class="brand-badge">허제니 아레나</span>
        <h1>멍청이 챔피언스</h1>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn" id="soundBtn">🔊 효과음 켜짐</button>
      <button class="btn" id="fullBtn">⛶ 전체 화면</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <!-- 설정 화면 -->
    <section class="screen active" id="setupScreen">
      <div class="setup-container">
        <div style="color:var(--gold); font-size: 12px; font-weight: 900; letter-spacing: 2px;">허제니의 두뇌 배틀 공식 토너먼트</div>
        <h2 class="hero-title">누가 더 <span>똥멍청이</span>인가?</h2>
        <div class="setup-grid">
          <div class="field">
            <label for="name1">도전자 1 (블루)</label>
            <input id="name1" maxlength="16" value="플레이어 A" autocomplete="off">
          </div>
          <div class="field">
            <label for="name2">도전자 2 (핑크)</label>
            <input id="name2" maxlength="16" value="플레이어 B" autocomplete="off">
          </div>
          <div class="field">
            <label for="roundCount">대결 라운드 수</label>
            <select id="roundCount">
              <option value="10">10문제 · 스피드전</option>
              <option value="15" selected>15문제 · 스탠다드</option>
              <option value="20">20문제 · 토너먼트</option>
              <option value="40">40문제 · 전 문항 완주</option>
            </select>
          </div>
          <div class="field">
            <label for="timeLimit">문제 제한 시간</label>
            <select id="timeLimit">
              <option value="10">10초 · 번개전</option>
              <option value="15" selected>15초 · 표준</option>
              <option value="20">20초 · 여유</option>
              <option value="0">무제한</option>
            </select>
          </div>
        </div>
        <button class="btn primary" id="startBtn" style="font-size: 16px; padding: 12px 32px;">대결 시작하기 ➔</button>
      </div>
    </section>

    <!-- 배틀 아레나 화면 -->
    <section class="screen" id="gameScreen">
      <div class="arena-grid">
        <!-- 1열: 도전자 1 -->
        <article class="player-station blue" id="card0">
          <div class="station-head">
            <div class="player-name" id="playerName0">플레이어 A</div>
            <div class="score"><span id="score0">0</span> <small style="font-size:12px;">점</small></div>
          </div>
          <div class="player-meta">
            <span id="meta0">정답 0 · 오답 0</span>
            <span id="rank0">새싹 멍청이</span>
          </div>
          <div class="answer-grid" id="answers0"></div>
          <div class="station-footer">
            <div class="confidence-head">
              <span>🎯 정답 자신감</span>
              <span class="confidence-value" id="confVal0">70%</span>
            </div>
            <div class="confidence-options" id="confOptions0">
              <button class="conf-btn" data-conf="30">30%</button>
              <button class="conf-btn active" data-conf="70">70%</button>
              <button class="conf-btn" data-conf="100">100%</button>
            </div>
            <div class="player-status" id="status0">답변 대기 중...</div>
          </div>
        </article>

        <!-- 2열: 중앙 문제 및 판독 컨트롤 -->
        <div class="center-station">
          <div class="center-hud-bar">
            <span class="round-badge" id="roundLabel">ROUND 01</span>
            <div class="progress-wrap"><div class="progress" id="progress"></div></div>
            <div class="timer" id="timer">15</div>
          </div>

          <div class="question-box">
            <div class="category" id="category">분야 로딩 중</div>
            <h2 class="question" id="question">문제를 불러오는 중...</h2>
            <div class="question-sub" id="questionSub">두 플레이어가 정답을 선택하고 있습니다.</div>
            <div class="reveal-banner" id="revealBanner">
              <strong id="revealTitle">정답 공개!</strong>
              <p id="revealText"></p>
            </div>
          </div>

          <div class="controls-bar">
            <button class="btn" id="skipBtn">건너뛰기</button>
            <button class="btn primary" id="lockBtn">답변 확정 및 결과 공개</button>
            <button class="btn primary" id="nextBtn" hidden>다음 문제 ➔</button>
            <button class="btn danger" id="endBtn">포기</button>
          </div>
        </div>

        <!-- 3열: 도전자 2 -->
        <article class="player-station pink" id="card1">
          <div class="station-head">
            <div class="player-name" id="playerName1">플레이어 B</div>
            <div class="score"><span id="score1">0</span> <small style="font-size:12px;">점</small></div>
          </div>
          <div class="player-meta">
            <span id="meta1">정답 0 · 오답 0</span>
            <span id="rank1">새싹 멍청이</span>
          </div>
          <div class="answer-grid" id="answers1"></div>
          <div class="station-footer">
            <div class="confidence-head">
              <span>🎯 정답 자신감</span>
              <span class="confidence-value" id="confVal1">70%</span>
            </div>
            <div class="confidence-options" id="confOptions1">
              <button class="conf-btn" data-conf="30">30%</button>
              <button class="conf-btn active" data-conf="70">70%</button>
              <button class="conf-btn" data-conf="100">100%</button>
            </div>
            <div class="player-status" id="status1">답변 대기 중...</div>
          </div>
        </article>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section class="screen" id="resultScreen">
      <div class="result-container">
        <div style="color:var(--gold); font-size: 12px; font-weight: 800;">허제니 퀴즈 아레나 경기 결과</div>
        <h2 class="result-title">오늘의 <span>멍청이 챔피언</span></h2>
        <div class="winner-card">
          <div class="crown" id="winnerIcon">👑</div>
          <div class="winner-name" id="winnerName">전설의 멍청이</div>
          <div style="font-size: 14px; color: #dce6fb;" id="winnerSub">허제니 명예의 전당 입성</div>
        </div>
        <div class="result-grid" id="resultGrid"></div>
        <div style="display:flex; justify-content:center; gap:10px;">
          <button class="btn primary" id="rematchBtn">↻ 재경기</button>
          <button class="btn" id="homeBtn">처음 화면</button>
          <button class="btn" id="copyBtn">결과 복사</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ==========================================================================
   검증 완료된 정예 상식 데이터베이스 (40문항)
   분야: 국어, 생활법률, 경제, 정치/헌법, 인간관계/심리, 국내/글로벌
   ========================================================================== */

  // [국어 상식]

  {c:'글로벌 상식', q:'세계 최대의 검색 엔진이자 안드로이드 OS를 개발한 글로벌 빅테크 기업은?', a:['구글','애플','마이크로소프트','아마존'], k:0, e:'안드로이드 플랫폼과 글로벌 최대 검색 서비스를 보유한 기업은 구글(Alphabet)입니다.'},
  {c:'글로벌 상식', q:'지구상에서 가장 많은 비와 산소를 생산하여 "지구의 허파"로 불리는 남아메리카의 열대우림은?', a:['사하라','아마존','콩고 분지','블랙 포레스트'], k:1, e:'남아메리카 대륙에 위치한 세계 최대의 열대우림은 아마존(Amazon) 분지입니다.'}
];

const QUESTION_BANK = QUESTIONS.slice();
const $ = id => document.getElementById(id);
const state = {
  players: [], deck: [], round: 0, total: 15, timeLimit: 15,
  timeLeft: 15, timerId: null, phase: 'setup', sound: true, audio: null,
  previousSetup: null, question: null
};

function escapeHTML(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(arr){ for(let i=arr.length-1; i>0; i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._id); toast._id = setTimeout(() => t.classList.remove('show'), 2000); }

function tone(freq=440, duration=0.1, type='sine', gain=0.04){
  if(!state.sound) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    if(!state.audio) state.audio = new C();
    if(state.audio.state === 'suspended') state.audio.resume();
    const osc = state.audio.createOscillator(), g = state.audio.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, state.audio.currentTime);
    g.gain.setValueAtTime(gain, state.audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, state.audio.currentTime + duration);
    osc.connect(g); g.connect(state.audio.destination);
    osc.start(); osc.stop(state.audio.currentTime + duration);
  } catch(e){}
}

function fanfare(){ tone(523,0.12,'triangle'); setTimeout(()=>tone(659,0.12,'triangle'),90); setTimeout(()=>tone(1046,0.25,'triangle'),180); }

function getRank(p){
  if(p.wrong===0 && p.correct>=3) return '허제니 공인 석학';
  if(p.confidentWrong>=4) return '근자감 대마왕';
  if(p.wrong>=p.correct+3) return '전설의 멍청이';
  if(p.correct>=p.wrong+3) return '교양 탑재 상식인';
  return '뇌세포 로딩 중';
}

function startGame(){
  const n1 = $('name1').value.trim() || '도전자 A';
  const n2 = $('name2').value.trim() || '도전자 B';
  state.previousSetup = { n1, n2, total: Number($('roundCount').value), time: Number($('timeLimit').value) };
  state.total = state.previousSetup.total;
  state.timeLimit = state.previousSetup.time;
  state.deck = shuffle(QUESTION_BANK.map((q,i) => ({...q, id:i}))).slice(0, state.total);
  state.round = 0;
  state.players = [makePlayer(n1), makePlayer(n2)];
  state.phase = 'playing';
  showScreen('gameScreen');
  nextQuestion(true);
  fanfare();
}

function makePlayer(name){
  return { name, score: 0, correct: 0, wrong: 0, confidentWrong: 0, confidence: 70, answer: null, locked: false, history: [] };
}

function stopTimer(){ if(state.timerId){ clearInterval(state.timerId); state.timerId = null; } }

function nextQuestion(first=false){
  stopTimer();
  if(state.round >= state.total){ finishGame(); return; }
  state.phase = 'playing';
  state.question = state.deck[state.round];
  state.players.forEach(p => { p.answer = null; p.locked = false; p.confidence = 70; });

  $('roundLabel').textContent = `ROUND ${String(state.round+1).padStart(2,'0')}`;
  $('category').textContent = `[${state.question.c}]`;
  $('question').textContent = state.question.q;
  $('questionSub').textContent = '두 플레이어의 선택을 대기하고 있습니다.';
  $('progress').style.width = (state.round / state.total * 100) + '%';
  $('revealBanner').classList.remove('show');$('lockBtn').hidden = false;
  $('nextBtn').hidden = true;
  $('skipBtn').disabled = false;

  renderPlayers();

  if(state.timeLimit > 0){
    state.timeLeft = state.timeLimit;
    updateTimer();
    state.timerId = setInterval(() => {
      if(state.phase !== 'playing') return;
      state.timeLeft--;
      updateTimer();
      if(state.timeLeft <= 0){
        stopTimer();
        tone(140, 0.4, 'sawtooth', 0.08);
        lockAnswers(true);
      }
    }, 1000);
  } else {
    $('timer').textContent = '∞';$('timer').classList.remove('urgent');
  }
  if(!first) tone(600, 0.08);
}

function updateTimer(){
  $('timer').textContent = state.timeLeft + '초';
  $('timer').classList.toggle('urgent', state.timeLeft <= 5);
  if(state.timeLeft <= 5 && state.timeLeft > 0) tone(880, 0.05, 'square', 0.02);
}

function renderPlayers(){
  state.players.forEach((p, i) => {
    $('playerName' + i).textContent = p.name;
    $('score' + i).textContent = p.score;
    $('meta' + i).textContent = `정답 ${p.correct} · 오답 ${p.wrong}`;
    $('rank' + i).textContent = getRank(p);
    $('confVal' + i).textContent = p.confidence + '\%';$('status' + i).textContent = p.locked ? '답변 잠김' : p.answer === null ? '선택 대기 중...' : '선택 완료!';
    $('card' + i).classList.remove('selected');

    $('confOptions' + i).querySelectorAll('.conf-btn').forEach(b => {
      b.classList.toggle('active', Number(b.dataset.conf) === p.confidence);
      b.disabled = p.locked;
    });

    const container = $('answers' + i);
    container.innerHTML = state.question.a.map((a, j) => `
      <button class="answer ${p.answer === j ? 'chosen' : ''}" data-player="${i}" data-answer="${j}" ${p.locked ? 'disabled' : ''}>
        <span class="letter">${'ABCD'[j]}</span>
        <span>${escapeHTML(a)}</span>
      </button>
    `).join('');

    container.querySelectorAll('.answer').forEach(btn => {
      btn.addEventListener('click', () => chooseAnswer(Number(btn.dataset.player), Number(btn.dataset.answer)));
    });
  });
}

function chooseAnswer(pIdx, ansIdx){
  if(state.phase !== 'playing') return;
  const p = state.players[pIdx];
  if(p.locked) return;
  p.answer = ansIdx;

  $('answers' + pIdx).querySelectorAll('.answer').forEach(b => {
    b.classList.toggle('chosen', Number(b.dataset.answer) === ansIdx);
  });
  $('card' + pIdx).classList.add('selected');$('status' + pIdx).textContent = '선택 완료!';
  tone(450 + ansIdx * 90, 0.06);

  if(state.players.every(x => x.answer !== null)){
    toast('양측 모두 선택 완료! 결과를 공개하세요.');
  }
}

function switchConf(pIdx, val){
  const p = state.players[pIdx];
  if(!p || p.locked || state.phase !== 'playing') return;
  p.confidence = val;
  $('confVal' + pIdx).textContent = val + '\%';$('confOptions' + pIdx).querySelectorAll('.conf-btn').forEach(b => {
    b.classList.toggle('active', Number(b.dataset.conf) === val);
  });
  tone(400 + val * 2, 0.05);
}

function lockAnswers(timeout=false){
  if(state.phase !== 'playing') return;
  stopTimer();
  state.phase = 'reveal';

  state.players.forEach((p, i) => {
    if(p.answer === null){
      p.locked = true; p.wrong++;
      p.history.push({ correct: false, confidence: p.confidence, missed: true });
      $('status' + i).textContent = timeout ? '시간 초과 오답' : '미응답 오답';
      return;
    }

    p.locked = true;
    const correct = p.answer === state.question.k;
    if(correct){
      p.correct++;
      const base = 100, bonus = Math.round(p.confidence * 0.5);
      p.score += base + bonus;
      $('status' + i).textContent = `정답! +${base + bonus}점`;
    } else {
      p.wrong++;
      if(p.confidence === 100) p.confidentWrong++;
      const penalty = p.confidence === 100 ? 25 : p.confidence === 70 ? 10 : 0;
      p.score = Math.max(0, p.score - penalty);
      $('status' + i).textContent = `오답 (감점 -${penalty}점)`;
    }
  });

  for(let i=0; i<2; i++){
    $('answers' + i).querySelectorAll('.answer').forEach((b, j) => { b.disabled = true; if(j === state.question.k) b.classList.add('is-correct'); else if(j === state.players[i].answer) b.classList.add('is-wrong'); });$('confOptions' + i).querySelectorAll('button').forEach(b => b.disabled = true);
  }

  $('questionSub').textContent = '정답 및 해설이 공개되었습니다!';
  $('revealTitle').textContent = `정답: ${'ABCD'[state.question.k]}번 (${state.question.a[state.question.k]})`;
  $('revealText').textContent = state.question.e || '';
  $('revealBanner').classList.add('show');$('lockBtn').hidden = true;
  $('nextBtn').hidden = false;
  $('skipBtn').disabled = true;

  renderScoresOnly();
  if(state.players.some(p => p.answer === state.question.k)) fanfare();
  else tone(130, 0.35, 'sawtooth', 0.08);
}

function renderScoresOnly(){
  state.players.forEach((p, i) => {
    $('score' + i).textContent = p.score;
    $('meta' + i).textContent = `정답 ${p.correct} · 오답 ${p.wrong}`;
    $('rank' + i).textContent = getRank(p);
  });
  $('progress').style.width = ((state.round + 1) / state.total * 100) + '%';
}

function finishGame(){
  stopTimer();
  state.phase = 'result';
  showScreen('resultScreen');

  const [a, b] = state.players;
  const dumbScore = p => p.wrong * 100 + p.confidentWrong * 45 - p.correct * 12;
  const dumbWinner = dumbScore(a) === dumbScore(b) ? null : (dumbScore(a) > dumbScore(b) ? a : b);
  const winner = dumbWinner || (a.score >= b.score ? a : b);

  $('winnerIcon').textContent = dumbWinner ? '👑' : '🤝';
  $('winnerName').textContent = winner ? winner.name : '공동 챔피언';
  $('winnerSub').textContent = dumbWinner ? `허제니 공인 멍청이 챔피언 등극 (멍청 지수: ${dumbScore(winner)}점)` : '동등한 두뇌 용량 판정';

  if(dumbWinner) fanfare();

  $('resultGrid').innerHTML = state.players.map((p, i) => {
    const total = p.correct + p.wrong;
    const acc = total ? Math.round(p.correct / total * 100) : 0;
    return `
      <article class="result-player">
        <h3 style="color:${i===0?'var(--p1-cyan)':'var(--p2-pink)'}">${i===0?'🔵 블루':'🩷 핑크'} : ${escapeHTML(p.name)}</h3>
        <div style="font-size: 26px; font-weight: 900; color: var(--gold); margin: 6px 0;">${p.score.toLocaleString()} 점</div>
        <div class="stat-row"><span>적중률</span><b>${acc}% (${p.correct}/${total})</b></div>
        <div class="stat-row"><span>오답 수</span><b>${p.wrong} 회</b></div>
        <div class="stat-row"><span>확신형 근자감 오답</span><b>${p.confidentWrong} 회</b></div>
        <div class="stat-row"><span>멍청이 지수</span><b style="color:var(--gold)">${dumbScore(p)} 점</b></div>
      </article>
    `;
  }).join('');
}

(function initCanvasFX(){
  const canvas = $('bg-canvas');
  const ctx = canvas.getContext('2d');
  let w, h, particles = [];

  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();

  for(let i=0; i<35; i++){
    particles.push({
      x: Math.random() * w, y: Math.random() * h,
      size: Math.random() * 2 + 1,
      speedY: -(Math.random() * 0.35 + 0.1), speedX: (Math.random() - 0.5) * 0.25,
      color: Math.random() > 0.5 ? '#00f0ff' : '#ff0055', alpha: Math.random() * 0.4 + 0.1
    });
  }

  function loop(){
    ctx.clearRect(0, 0, w, h);
    for(let p of particles){
      p.y += p.speedY; p.x += p.speedX;
      if(p.y < 0) { p.y = h; p.x = Math.random() * w; }
      ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(loop);
  }
  loop();
})();

$('startBtn').addEventListener('click', startGame);$('lockBtn').addEventListener('click', () => lockAnswers(false));
$('nextBtn').addEventListener('click', () => { state.round++; nextQuestion(); });$('skipBtn').addEventListener('click', () => {
  if(state.phase !== 'playing') return;
  state.phase = 'reveal'; stopTimer();
  $('revealTitle').textContent = '문제 패스';
  $('revealText').textContent = '점수 변동 없이 넘어갑니다.';
  $('revealBanner').classList.add('show');$('lockBtn').hidden = true; $('nextBtn').hidden = false; $('skipBtn').disabled = true;
});
$('endBtn').addEventListener('click', () => { if(confirm('대결을 종료할까요?')) finishGame(); });
$('rematchBtn').addEventListener('click', () => {
  if(!state.previousSetup) return;
  $('name1').value = state.previousSetup.n1; $('name2').value = state.previousSetup.n2;
  $('roundCount').value = String(state.previousSetup.total);$('timeLimit').value = String(state.previousSetup.time);
  startGame();
});
$('homeBtn').addEventListener('click', () => { stopTimer(); state.phase='setup'; showScreen('setupScreen'); });$('copyBtn').addEventListener('click', () => {
  const text = state.players.map(p => `${p.name}: ${p.score}점 (정답 ${p.correct} / 오답 ${p.wrong})`).join('\n') + '\n#허제니 퀴즈 아레나';
  navigator.clipboard.writeText(text).then(() => toast('결과가 복사되었습니다.'));
});
$('soundBtn').addEventListener('click', () => {
  state.sound = !state.sound;
  $('soundBtn').textContent = state.sound ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
  if(state.sound) tone(660, 0.1);
});
$('fullBtn').addEventListener('click', () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

document.querySelectorAll('.confidence-options').forEach((el, i) => {
  el.querySelectorAll('.conf-btn').forEach(btn => {
    btn.addEventListener('click', () => switchConf(i, Number(btn.dataset.conf)));
  });
});
</script>
</body>
