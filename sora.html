<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 소라고동 (Gemini Free Ver)</title>
    <style>
        body { background: #1a2a6c; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .chat-container { width: 450px; background: rgba(0,0,0,0.65); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .chat-box { height: 320px; overflow-y: auto; border: 1px solid #444; padding: 10px; margin-bottom: 15px; border-radius: 5px; background: rgba(0,0,0,0.3); }
        .message { margin-bottom: 12px; line-height: 1.4; word-break: keep-all; }
        .user { color: #ffd700; text-align: right; }
        .conch { color: #00ffff; }
        .input-group { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; outline: none; }
        button { padding: 12px 20px; background: #ffd700; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: #333; }
        button:hover { background: #ffc107; }
    </style>
</head>
<body>

    <div class="chat-container">
        <h2>🐚 Gemini 마법의 소라고동</h2>
        <div id="chatBox" class="chat-box">
            <div class="message conch">소라고동: 무엇이든 물어봐라. 대답해 줄 테니.</div>
        </div>
        <div class="input-group">
            <input type="text" id="userInput" placeholder="소라고동에게 말을 걸어보세요..." onkeypress="if(event.key=='Enter') sendMessage()">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        // 🔑 발급받은 API 키
        const API_KEY = "AQ.Ab8RN6IZcIrA6TXrciimFB1KwVqtMx5EDYIZVj993gHnkoK5jw";

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const chatBox = document.getElementById('chatBox');
            const text = input.value.trim();

            if (!text) return;

            // 유저 메시지 화면에 추가
            chatBox.innerHTML += `<div class="message user">나: ${text}</div>`;
            input.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // 로딩 메시지 추가
            const loadingId = "loading_" + Date.now();
            chatBox.innerHTML += `<div class="message conch" id="${loadingId}">소라고동이 깊은 바다에서 생각 중...</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // 수정 포인트: URL에서 ?key= 파라미터를 빼고, headers에 x-goog-api-key 추가
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "x-goog-api-key": API_KEY
                    },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    { text: "시스템 설정: 너는 스폰지밥에 나오는 '마법의 소라고동'이야. 답변은 항상 툭툭 내뱉는 단호한 어조이거나, SOOP 방송인과 시청자의 고민을 약 올리듯 킹받게 상담해 주는 컨셉으로 대화해 줘. 너무 길지 않게 핵심만 한국어로 말해.\n\n사용자 질문: " + text }
                                ]
                            }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const reply = data.candidates[0].content.parts[0].text;
                    
                    // 로딩창을 실제 답변으로 교체
                    document.getElementById(loadingId).remove();
                    chatBox.innerHTML += `<div class="message conch">소라고동: ${reply}</div>`;
                    
                    // 음성(TTS)으로 읽어주기
                    speakText(reply);
                } else {
                    console.error(data);
                    document.getElementById(loadingId).innerText = "소라고동: 응답을 받아오지 못했다.";
                }

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).innerText = "소라고동: 바닷속 통신 장애가 발생했다.";
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.pitch = 0.6; // 묵직한 소라고동 저음
            utterance.rate = 0.95; 
            window.speechSynthesis.speak(utterance);
        }
    </script>
</body>
</html>
