<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>가을 랜덤 제니 뽑기</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Jua', 'Noto Sans KR', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      background: radial-gradient(circle at 50% 20%, #FFF8EE 0%, #F5E5D0 45%, #E6CEB3 100%);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Claymorphism Cards */
    .clay-card {
      background: #FFFDF9;
      border-radius: 32px;
      box-shadow: 
        12px 18px 36px rgba(175, 130, 95, 0.28),
        -8px -8px 24px rgba(255, 255, 255, 0.95),
        inset 4px 4px 8px rgba(255, 255, 255, 0.8),
        inset -4px -6px 12px rgba(190, 145, 105, 0.18);
    }

    .clay-plate {
      background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, #FBF6EF 65%, #E6D7C3 100%);
      border-radius: 50%;
      box-shadow: 
        18px 26px 48px rgba(150, 110, 80, 0.35),
        -12px -12px 30px rgba(255, 255, 255, 0.95),
        inset 6px 8px 16px rgba(255, 255, 255, 0.95),
        inset -12px -14px 24px rgba(170, 130, 95, 0.25);
    }

    /* Clay Buttons */
    .clay-btn {
      transition: all 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }
    .clay-btn:active {
      transform: scale(0.92) translateY(3px);
    }

    .clay-btn-orange {
      background: linear-gradient(135deg, #FF9E67, #E85D34);
      box-shadow: 
        5px 8px 16px rgba(232, 93, 52, 0.35),
        -2px -2px 8px rgba(255, 210, 190, 0.8),
        inset 3px 3px 6px rgba(255, 255, 255, 0.6),
        inset -3px -5px 10px rgba(150, 40, 15, 0.35);
      color: white;
    }

    .clay-btn-green {
      background: linear-gradient(135deg, #8FC472, #558E38);
      box-shadow: 
        5px 8px 16px rgba(85, 142, 56, 0.35),
        -2px -2px 8px rgba(215, 245, 200, 0.8),
        inset 3px 3px 6px rgba(255, 255, 255, 0.6),
        inset -3px -5px 10px rgba(45, 80, 20, 0.35);
      color: white;
    }

    .clay-btn-reset {
      background: linear-gradient(135deg, #9FA8DA, #5C6BC0);
      box-shadow: 
        5px 8px 16px rgba(92, 107, 192, 0.35),
        -2px -2px 8px rgba(230, 235, 255, 0.8),
        inset 3px 3px 6px rgba(255, 255, 255, 0.6),
        inset -3px -5px 10px rgba(40, 50, 120, 0.35);
      color: white;
    }

    .clay-badge {
      background: #FFF7EC;
      border-radius: 20px;
      box-shadow: 
        4px 6px 14px rgba(180, 135, 95, 0.2),
        -3px -3px 8px rgba(255, 255, 255, 0.95),
        inset 2px 2px 4px rgba(255, 255, 255, 0.9),
        inset -2px -2px 6px rgba(190, 145, 105, 0.15);
    }

    /* Clay Moon */
    .clay-moon {
      background: radial-gradient(circle at 35% 35%, #FFFCE6 0%, #FEE88C 60%, #E8BE3B 100%);
      box-shadow: 
        0 0 50px rgba(255, 225, 110, 0.5),
        inset 8px 8px 20px rgba(255, 255, 255, 0.9),
        inset -10px -10px 24px rgba(190, 145, 25, 0.4);
      border-radius: 50%;
    }

    /* Clay Doll Base Styles & Center Anchor Bug Fix */
    .doll-clay {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      cursor: pointer;
    }
    .doll-clay:hover:not(.opened) {
      transform: translateY(-8px) scale(1.08);
    }
    .doll-clay:active:not(.opened) {
      transform: scale(0.92);
    }
    .doll-clay.opened {
      cursor: default;
      filter: grayscale(0.35) saturate(0.7);
      transform: scale(0.95);
    }

    /* Specifically fix center item hover position anchor */
    #sp-3 {
      transform: translate(-50%, -50%);
    }
    #sp-3:hover:not(.opened) {
      transform: translate(-50%, calc(-50% - 8px)) scale(1.08) !important;
    }
    #sp-3:active:not(.opened) {
      transform: translate(-50%, -50%) scale(0.92) !important;
    }
    #sp-3.opened {
      transform: translate(-50%, -50%) scale(0.95) !important;
    }

    /* Squish & Pop Animation */
    @keyframes dollPop {
      0% { transform: scale(1); }
      35% { transform: scale(1.25, 0.75) translateY(8px); }
      65% { transform: scale(0.85, 1.2) translateY(-12px) rotate(-5deg); }
      100% { transform: scale(0.95) translateY(0); }
    }
    @keyframes centerDollPop {
      0% { transform: translate(-50%, -50%) scale(1); }
      35% { transform: translate(-50%, -50%) scale(1.25, 0.75) translateY(8px); }
      65% { transform: translate(-50%, -50%) scale(0.85, 1.2) translateY(-12px) rotate(-5deg); }
      100% { transform: translate(-50%, -50%) scale(0.95); }
    }
    .anim-pop {
      animation: dollPop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    #sp-3.anim-pop {
      animation: centerDollPop 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Falling Leaves */
    @keyframes leafDrift {
      0% { transform: translateY(-30px) rotate(0deg) translateX(0); opacity: 0; }
      15% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(360deg) translateX(80px); opacity: 0; }
    }
    .floating-leaf {
      position: fixed;
      pointer-events: none;
      z-index: 1;
      animation: leafDrift linear infinite;
    }

    .clay-modal-bg {
      background: rgba(70, 45, 25, 0.42);
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body class="relative flex flex-col items-center justify-between p-3 sm:p-6 min-h-screen text-stone-800">

  <!-- Background Clay Moon & Fall Leaves -->
  <div class="fixed -top-12 -right-12 w-48 h-48 sm:w-64 sm:h-64 clay-moon pointer-events-none opacity-85 z-0"></div>
  <div id="leaves-container" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

  <!-- Header Section -->
  <div class="relative z-10 w-full max-w-xl flex flex-col items-center">
    <div class="text-center mt-2 mb-3">
      <div class="inline-flex items-center gap-1.5 px-4 py-1 clay-badge mb-1.5">
        <span class="text-lg">🍂</span>
        <span class="text-xs sm:text-sm font-bold text-amber-900 tracking-wider">가을 EVENT 귀여운 제니 뽑기</span>
        <span class="text-lg">🌾</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold text-amber-950 tracking-tight drop-shadow-sm flex items-center justify-center gap-2">
        철지난 랜덤 송편 뽑기
      </h1>
      <p class="text-stone-600 text-xs sm:text-sm mt-1">
        제니 인형을 콕 찔러 골라보세요! (기본 기회: 3회)
      </p>
    </div>

    <!-- Top Status Bar & Controls -->
    <div class="w-full flex items-center justify-between px-4 py-3 clay-card mb-4 gap-2">
      <!-- Lucky Pouch Coin Indicator (3 Coins) -->
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1.5 bg-amber-100/70 px-3 py-1.5 rounded-2xl border border-amber-200/80 shadow-inner">
          <div id="coin-pouches" class="flex gap-1"></div>
          <div class="text-base sm:text-lg font-black text-amber-950 ml-1">
            <span id="coin-count">3</span> / 3
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-1.5 sm:gap-2">
        <button id="btn-reset" class="clay-btn px-3 py-2 rounded-2xl clay-btn-reset font-bold text-xs sm:text-sm flex items-center gap-1 shadow-md">
          🔄 <span>새로하기</span>
        </button>
        <button id="btn-history" class="clay-btn px-3 py-2 rounded-2xl clay-badge text-stone-700 font-bold text-xs sm:text-sm flex items-center gap-1 hover:bg-amber-100">
          📜 <span>내역</span>
        </button>
        <button id="btn-settings" class="clay-btn px-2.5 py-2 rounded-2xl clay-badge text-stone-700 font-bold text-xs sm:text-sm flex items-center gap-1 hover:bg-amber-100">
          ⚙️
        </button>
      </div>
    </div>
  </div>

  <main class="relative z-10 w-full max-w-xl flex flex-col items-center justify-center my-auto">
    <!-- Dish Plate Container -->
    <div class="relative w-80 h-80 sm:w-[420px] sm:h-[420px] clay-plate flex items-center justify-center p-6">
      
      <!-- Clay Decorative Leaves on Plate -->
      <div class="absolute w-20 h-2 top-14 left-20 bg-emerald-600/60 rounded-full rotate-45 shadow-sm"></div>
      <div class="absolute w-24 h-2 bottom-16 right-20 bg-amber-700/50 rounded-full -rotate-30 shadow-sm"></div>
      <div class="absolute w-28 h-28 rounded-full bg-amber-900/10 pointer-events-none blur-md"></div>

      <!-- Clay Doll 1: Top-Left (쑥제니) -->
      <div id="sp-1" class="absolute top-8 sm:top-10 left-10 sm:left-12 doll-clay flex flex-col items-center" data-name="쑥제니" onclick="pickItem('sp-1')">
        <svg class="w-20 h-20 sm:w-24 sm:h-24 drop-shadow-lg" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="grad-hair-green" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#93C174"/>
              <stop offset="60%" stop-color="#5B873D"/>
              <stop offset="100%" stop-color="#3C5C26"/>
            </radialGradient>
            <radialGradient id="grad-face" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#FFF5EA"/>
              <stop offset="70%" stop-color="#FDE5D0"/>
              <stop offset="100%" stop-color="#ECC6A7"/>
            </radialGradient>
          </defs>
          <!-- Hair buns -->
          <circle cx="22" cy="30" r="16" fill="url(#grad-hair-green)"/>
          <circle cx="78" cy="30" r="16" fill="url(#grad-hair-green)"/>
          <!-- Face -->
          <ellipse cx="50" cy="54" rx="34" ry="32" fill="url(#grad-face)"/>
          <!-- Bangs -->
          <path d="M 22 45 C 32 30, 48 34, 50 40 C 52 34, 68 30, 78 45 C 68 32, 32 32, 22 45 Z" fill="url(#grad-hair-green)"/>
          <!-- Eyes -->
          <ellipse cx="38" cy="53" rx="3.5" ry="5.5" fill="#3D291F"/>
          <ellipse cx="62" cy="53" rx="3.5" ry="5.5" fill="#3D291F"/>
          <circle cx="39.5" cy="51.5" r="1.5" fill="#FFFFFF"/>
          <circle cx="63.5" cy="51.5" r="1.5" fill="#FFFFFF"/>
          <!-- Blush -->
          <ellipse cx="32" cy="61" rx="6" ry="3.5" fill="#FF8BA7" opacity="0.6"/>
          <ellipse cx="68" cy="61" rx="6" ry="3.5" fill="#FF8BA7" opacity="0.6"/>
          <!-- Smile -->
          <path d="M 45 62 Q 50 67 55 62" stroke="#B85D43" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="badge-tag -mt-1 text-center text-[11px] font-bold text-amber-950 bg-white/85 backdrop-blur-sm rounded-full px-2.5 py-0.5 shadow-sm">쑥제니</span>
      </div>

      <!-- Clay Doll 2: Top-Right (호박제니) -->
      <div id="sp-2" class="absolute top-8 sm:top-10 right-10 sm:right-12 doll-clay flex flex-col items-center" data-name="호박제니" onclick="pickItem('sp-2')">
        <svg class="w-20 h-20 sm:w-24 sm:h-24 drop-shadow-lg" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="grad-hair-yellow" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#FFE885"/>
              <stop offset="60%" stop-color="#F6B144"/>
              <stop offset="100%" stop-color="#C77D16"/>
            </radialGradient>
          </defs>
          <!-- Side ponytails -->
          <ellipse cx="18" cy="46" rx="10" ry="16" fill="url(#grad-hair-yellow)" transform="rotate(-20 18 46)"/>
          <ellipse cx="82" cy="46" rx="10" ry="16" fill="url(#grad-hair-yellow)" transform="rotate(20 82 46)"/>
          <!-- Face -->
          <ellipse cx="50" cy="54" rx="34" ry="32" fill="url(#grad-face)"/>
          <!-- Bangs -->
          <path d="M 22 46 Q 50 32 78 46 Q 66 32 50 34 Q 34 32 22 46 Z" fill="url(#grad-hair-yellow)"/>
          <!-- Ribbon on hair -->
          <path d="M 44 26 L 56 26 L 50 32 Z" fill="#E85D34"/>
          <!-- Winking Eyes -->
          <path d="M 34 54 Q 39 49 44 54" stroke="#3D291F" stroke-width="3" stroke-linecap="round" fill="none"/>
          <ellipse cx="62" cy="53" rx="3.5" ry="5.5" fill="#3D291F"/>
          <circle cx="63.5" cy="51.5" r="1.5" fill="#FFFFFF"/>
          <!-- Blush -->
          <ellipse cx="32" cy="61" rx="6" ry="3.5" fill="#FFA685" opacity="0.75"/>
          <ellipse cx="68" cy="61" rx="6" ry="3.5" fill="#FFA685" opacity="0.75"/>
          <!-- Smile -->
          <path d="M 46 62 Q 50 67 54 62" stroke="#B85D43" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="badge-tag -mt-1 text-center text-[11px] font-bold text-amber-950 bg-white/85 backdrop-blur-sm rounded-full px-2.5 py-0.5 shadow-sm">호박제니</span>
      </div>

      <!-- Clay Doll 3: Center (백설제니) -->
      <div id="sp-3" class="absolute top-1/2 left-1/2 doll-clay flex flex-col items-center z-20" data-name="백설제니" onclick="pickItem('sp-3')">
        <svg class="w-22 h-22 sm:w-26 sm:h-26 drop-shadow-xl" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="grad-hair-choco" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#6B4F3B"/>
              <stop offset="70%" stop-color="#4A3425"/>
              <stop offset="100%" stop-color="#2E1C12"/>
            </radialGradient>
          </defs>
          <!-- Beret hat (Pure White Clay) -->
          <ellipse cx="50" cy="27" rx="32" ry="15" fill="#FFFFFF" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
          <circle cx="50" cy="14" r="3.5" fill="#FF8BA7"/>
          <!-- Face -->
          <ellipse cx="50" cy="56" rx="35" ry="33" fill="url(#grad-face)"/>
          <!-- Hair curls -->
          <path d="M 18 50 Q 14 68 22 72 Q 26 56 22 45 Z" fill="url(#grad-hair-choco)"/>
          <path d="M 82 50 Q 86 68 78 72 Q 74 56 78 45 Z" fill="url(#grad-hair-choco)"/>
          <path d="M 23 44 Q 50 38 77 44 Q 60 36 50 37 Q 38 36 23 44 Z" fill="url(#grad-hair-choco)"/>
          <!-- Sparkling Eyes -->
          <ellipse cx="37" cy="55" rx="4" ry="6" fill="#3D291F"/>
          <ellipse cx="63" cy="55" rx="4" ry="6" fill="#3D291F"/>
          <circle cx="39" cy="53" r="2" fill="#FFFFFF"/>
          <circle cx="65" cy="53" r="2" fill="#FFFFFF"/>
          <!-- Blush -->
          <ellipse cx="31" cy="63" rx="7" ry="4" fill="#FF8BA7" opacity="0.65"/>
          <ellipse cx="69" cy="63" rx="7" ry="4" fill="#FF8BA7" opacity="0.65"/>
          <!-- Open Joyful Mouth -->
          <path d="M 46 64 Q 50 71 54 64 Z" fill="#D34B56"/>
        </svg>
        <span class="badge-tag -mt-1 text-center text-xs font-bold text-amber-950 bg-white/95 backdrop-blur-sm rounded-full px-3 py-0.5 shadow-sm">백설제니</span>
      </div>

      <!-- Clay Doll 4: Bottom-Left (핑크제니) -->
      <div id="sp-4" class="absolute bottom-8 sm:bottom-10 left-9 sm:left-11 doll-clay flex flex-col items-center" data-name="핑크제니" onclick="pickItem('sp-4')">
        <svg class="w-20 h-20 sm:w-24 sm:h-24 drop-shadow-lg" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="grad-hair-pink" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#FFA8BA"/>
              <stop offset="60%" stop-color="#E86E85"/>
              <stop offset="100%" stop-color="#B83A53"/>
            </radialGradient>
          </defs>
          <!-- Bob Hair -->
          <ellipse cx="50" cy="52" rx="38" ry="34" fill="url(#grad-hair-pink)"/>
          <!-- Face -->
          <ellipse cx="50" cy="55" rx="32" ry="30" fill="url(#grad-face)"/>
          <!-- Straight Bangs -->
          <path d="M 23 46 Q 50 42 77 46 Q 64 36 50 37 Q 36 36 23 46 Z" fill="url(#grad-hair-pink)"/>
          <!-- Flower Hairpin -->
          <circle cx="70" cy="38" r="6" fill="#FFF" opacity="0.9"/>
          <circle cx="70" cy="38" r="2.5" fill="#FFE57F"/>
          <!-- Big Cute Eyes -->
          <ellipse cx="38" cy="54" rx="3.5" ry="5.5" fill="#3D291F"/>
          <ellipse cx="62" cy="54" rx="3.5" ry="5.5" fill="#3D291F"/>
          <circle cx="39.5" cy="52" r="1.5" fill="#FFFFFF"/>
          <circle cx="63.5" cy="52" r="1.5" fill="#FFFFFF"/>
          <!-- Blush -->
          <ellipse cx="32" cy="62" rx="6" ry="3.5" fill="#FF688B" opacity="0.6"/>
          <ellipse cx="68" cy="62" rx="6" ry="3.5" fill="#FF688B" opacity="0.6"/>
          <!-- Smile -->
          <path d="M 46 63 Q 50 67 54 63" stroke="#B85D43" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="badge-tag -mt-1 text-center text-[11px] font-bold text-amber-950 bg-white/85 backdrop-blur-sm rounded-full px-2.5 py-0.5 shadow-sm">핑크제니</span>
      </div>

      <!-- Clay Doll 5: Bottom-Right (포도제니) -->
      <div id="sp-5" class="absolute bottom-8 sm:bottom-10 right-9 sm:right-11 doll-clay flex flex-col items-center" data-name="포도제니" onclick="pickItem('sp-5')">
        <svg class="w-20 h-20 sm:w-24 sm:h-24 drop-shadow-lg" viewBox="0 0 100 100">
          <defs>
            <radialGradient id="grad-hair-purple" cx="40%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#C292D6"/>
              <stop offset="60%" stop-color="#8E52A8"/>
              <stop offset="100%" stop-color="#5E2674"/>
            </radialGradient>
          </defs>
          <!-- Braids / Twin Tails -->
          <circle cx="20" cy="56" r="12" fill="url(#grad-hair-purple)"/>
          <circle cx="80" cy="56" r="12" fill="url(#grad-hair-purple)"/>
          <!-- Face -->
          <ellipse cx="50" cy="54" rx="34" ry="32" fill="url(#grad-face)"/>
          <!-- Bangs -->
          <path d="M 23 44 C 36 32, 45 42, 50 40 C 55 42, 64 32, 77 44 Q 50 30 23 44 Z" fill="url(#grad-hair-purple)"/>
          <!-- Cat Eyes Style -->
          <ellipse cx="38" cy="53" rx="4" ry="5.5" fill="#3D291F" transform="rotate(-6 38 53)"/>
          <ellipse cx="62" cy="53" rx="4" ry="5.5" fill="#3D291F" transform="rotate(6 62 53)"/>
          <circle cx="39" cy="51.5" r="1.6" fill="#FFFFFF"/>
          <circle cx="63" cy="51.5" r="1.6" fill="#FFFFFF"/>
          <!-- Blush -->
          <ellipse cx="32" cy="62" rx="6" ry="3.5" fill="#E26DB5" opacity="0.6"/>
          <ellipse cx="68" cy="62" rx="6" ry="3.5" fill="#E26DB5" opacity="0.6"/>
          <!-- Cat Mouth / Smile -->
          <path d="M 43 62 Q 47 65 50 63 Q 53 65 57 62" stroke="#B85D43" stroke-width="2.2" stroke-linecap="round" fill="none"/>
        </svg>
        <span class="badge-tag -mt-1 text-center text-[11px] font-bold text-amber-950 bg-white/85 backdrop-blur-sm rounded-full px-2.5 py-0.5 shadow-sm">포도제니</span>
      </div>

    </div>

    <!-- Instruction hint pill -->
    <div id="instruction-pill" class="mt-5 inline-flex items-center gap-2 bg-amber-900/10 text-amber-950 px-5 py-2 rounded-full font-bold text-xs sm:text-sm">
      <span class="animate-bounce">👉</span> 마음에 드는 제니를 콕 눌러 경품을 뽑아보세요!
    </div>
  </main>

  <!-- Footer Controls -->
  <footer class="relative z-10 w-full max-w-xl flex items-center justify-between py-2.5 text-stone-600 text-xs sm:text-sm">
    <button id="btn-sound" class="clay-btn px-3 py-1.5 rounded-full clay-badge text-stone-700 flex items-center gap-1 font-bold">
      <span id="sound-icon">🔊</span> <span id="sound-text">효과음 켜짐</span>
    </button>
    <div class="text-stone-500 font-semibold flex items-center gap-1">
      <span>🌕 귀여운 가을 제니 뽑기</span>
    </div>
  </footer>

  <!-- Modal: Draw Result -->
  <div id="modal-result" class="fixed inset-0 clay-modal-bg hidden flex items-center justify-center p-4 z-50">
    <div class="w-full max-w-sm clay-card p-6 text-center transform transition-all scale-95 duration-200" id="result-box">
      <div class="w-20 h-20 mx-auto mb-3 flex items-center justify-center text-4xl clay-plate p-2" id="result-icon">
        🎁
      </div>

      <div class="text-xs font-bold text-amber-700 uppercase tracking-widest mb-1" id="result-doll-name">
        쑥제니의 선물!
      </div>

      <!-- Main Result Prize -->
      <div class="py-3 px-4 bg-amber-50 rounded-2xl border border-amber-200/60 mb-2" id="result-title-container">
        <h2 class="text-2xl sm:text-3xl font-black text-amber-950 tracking-tight" id="result-prize-title">
          역1
        </h2>
      </div>

      <p class="text-xs sm:text-sm text-stone-500 mb-5" id="result-subtext">
        축하합니다! 제니가 선물을 건네주었습니다 🎉
      </p>

      <button id="btn-close-result" class="w-full py-3 clay-btn clay-btn-green rounded-2xl font-bold text-base shadow-md">
        확인하고 계속하기
      </button>
    </div>
  </div>

  <!-- Modal: History -->
  <div id="modal-history" class="fixed inset-0 clay-modal-bg hidden flex items-center justify-center p-4 z-50">
    <div class="w-full max-w-md clay-card p-6 flex flex-col max-h-[85vh]">
      <div class="flex items-center justify-between pb-3 border-b border-stone-200 mb-4">
        <div class="flex items-center gap-2">
          <span class="text-2xl">📜</span>
          <h3 class="text-lg sm:text-xl font-extrabold text-stone-900">당첨 내역 히스토리</h3>
        </div>
        <button onclick="toggleModal('modal-history', false)" class="text-stone-400 hover:text-stone-600 text-2xl font-bold">&times;</button>
      </div>

      <div id="history-list" class="overflow-y-auto space-y-2 flex-1 pr-1"></div>

      <div class="pt-4 mt-2 border-t border-stone-200 flex justify-between items-center">
        <button onclick="clearHistory()" class="text-xs text-red-500 font-bold hover:underline">
          내역 초기화
        </button>
        <button onclick="toggleModal('modal-history', false)" class="px-5 py-2.5 clay-btn clay-badge text-stone-800 font-bold text-sm rounded-xl">
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Settings / Prize Table -->
  <div id="modal-settings" class="fixed inset-0 clay-modal-bg hidden flex items-center justify-center p-4 z-50">
    <div class="w-full max-w-md clay-card p-6 flex flex-col max-h-[88vh]">
      <div class="flex items-center justify-between pb-2 border-b border-stone-200 mb-2">
        <div class="flex items-center gap-2">
          <span class="text-2xl">⚙️</span>
          <h3 class="text-lg sm:text-xl font-extrabold text-stone-900">경품 목록 및 가중치</h3>
        </div>
        <button onclick="toggleModal('modal-settings', false)" class="text-stone-400 hover:text-stone-600 text-2xl font-bold">&times;</button>
      </div>

      <p class="text-xs text-stone-500 mb-3">
        * 3개 중 2개꼴(약 67%)로 꽝이 나오며, 당첨 시 <strong>역1 &gt; 랜덤시댄 &gt; ... &gt; 예쁜방셀</strong> 순으로 확률이 설정되어 있습니다.
      </p>

      <div id="prizes-table" class="overflow-y-auto space-y-2 flex-1 pr-1">
        <!-- Injected by JS -->
      </div>

      <div class="pt-3 mt-2 border-t border-stone-200 flex items-center justify-between">
        <button onclick="resetDefaultPrizes()" class="text-xs text-amber-800 font-bold hover:underline">
          기본 설정 복원
        </button>
        <button onclick="saveCustomPrizes()" class="px-4 py-2 clay-btn clay-btn-green font-bold text-sm rounded-xl">
          저장 완료
        </button>
      </div>
    </div>
  </div>

  <script>
    const AudioEngine = {
      ctx: null,
      enabled: true,

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      },

      playSquish() {
        if (!this.enabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(360, now);
          osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
          osc.frequency.exponentialRampToValueAtTime(320, now + 0.22);

          gain.gain.setValueAtTime(0.35, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.22);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.24);
        } catch (e) {
          console.error(e);
        }
      },

      playWin() {
        if (!this.enabled) return;
        this.init();
        try {
          const chords = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
          chords.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            const start = this.ctx.currentTime + idx * 0.08;

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0.25, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.42);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.start(start);
            osc.stop(start + 0.44);
          });
        } catch (e) {
          console.error(e);
        }
      },

      playLose() {
        if (!this.enabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(160, now + 0.35);

          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.36);
        } catch (e) {
          console.error(e);
        }
      },

      playReset() {
        if (!this.enabled) return;
        this.init();
        try {
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();

          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, now);
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);

          gain.gain.setValueAtTime(0.3, now);
          gain.gain.linearRampToValueAtTime(0.01, now + 0.2);

          osc.connect(gain);
          gain.connect(this.ctx.destination);

          osc.start(now);
          osc.stop(now + 0.22);
        } catch (e) {
          console.error(e);
        }
      }
    };

    /* 
      정확히 반대로 보정된 확률 가중치:
      - 꽝 (다음 기회에...): 가중치 200 (전체 약 66.7%로 3개 중 2개꼴)
      - 당첨 33.3% 안에서:
        역1 (가장 높음: 36) > 랜덤시댄 (25) > 노래한곡 (16) > 뽑기1장 (10) 
        > 스쿼트20 (6) > 셀카 (4) > 한장방셀 (2.5) > 1000사다리 (1.5) > 예쁜방셀 (초희귀: 0.5)
    */
    const DEFAULT_PRIZES = [
      { id: 0, name: '다음 기회에... (꽝)', weight: 200, icon: '🍂', isLose: true },
      { id: 1, name: '역1', weight: 36, icon: '🔥', isLose: false },
      { id: 2, name: '랜덤시댄', weight: 25, icon: '💃', isLose: false },
      { id: 3, name: '노래한곡', weight: 16, icon: '🎤', isLose: false },
      { id: 4, name: '뽑기1장', weight: 10, icon: '🎟️', isLose: false },
      { id: 5, name: '스쿼트20', weight: 6, icon: '🏋️', isLose: false },
      { id: 6, name: '셀카', weight: 4, icon: '🤳', isLose: false },
      { id: 7, name: '한장방셀', weight: 2.5, icon: '📸', isLose: false },
      { id: 8, name: '1000사다리', weight: 1.5, icon: '🪜', isLose: false },
      { id: 9, name: '예쁜방셀', weight: 0.5, icon: '🌸', isLose: false }
    ];

    const MAX_COINS = 3;
    let coins = MAX_COINS;
    // v3 버전 키를 사용하여 새로고침 시에도 즉시 새 가중치가 적용되도록 설정
    let prizes = JSON.parse(localStorage.getItem('jennie_prizes_v3')) || DEFAULT_PRIZES;
    let history = JSON.parse(localStorage.getItem('jennie_history_v3')) || [];
    let openedItems = [];
    let isDrawing = false;

    function createFallingLeaves() {
      const container = document.getElementById('leaves-container');
      const emojis = ['🍁', '🍂', '🌾', '🌰', '🍃'];
      const count = 12;

      for (let i = 0; i < count; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'floating-leaf';
        leaf.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        leaf.style.left = `${Math.random() * 95}%`;
        leaf.style.fontSize = `${16 + Math.random() * 16}px`;
        leaf.style.animationDuration = `${8 + Math.random() * 8}s`;
        leaf.style.animationDelay = `${Math.random() * 6}s`;
        leaf.style.opacity = '0';
        container.appendChild(leaf);
      }
    }

    function updateCoinUI() {
      const coinCountEl = document.getElementById('coin-count');
      const pouchesEl = document.getElementById('coin-pouches');
      coinCountEl.innerText = coins;

      pouchesEl.innerHTML = '';
      for (let i = 0; i < MAX_COINS; i++) {
        const span = document.createElement('span');
        span.className = 'text-xl sm:text-2xl transition-all duration-300';
        if (i < coins) {
          span.innerText = '💰';
          span.style.filter = 'drop-shadow(0 2px 4px rgba(210,130,20,0.4))';
        } else {
          span.innerText = '👝';
          span.style.opacity = '0.35';
          span.style.filter = 'grayscale(1)';
        }
        pouchesEl.appendChild(span);
      }

      const pill = document.getElementById('instruction-pill');
      if (coins === 0) {
        pill.innerHTML = '✨ 기회를 모두 사용했습니다! <strong>[새로하기]</strong>를 눌러 다시 도전하세요.';
        pill.className = 'mt-5 inline-flex items-center gap-1.5 bg-rose-100 text-rose-900 border border-rose-200 px-5 py-2 rounded-full font-bold text-xs sm:text-sm';
      } else {
        pill.innerHTML = '<span class="animate-bounce">👉</span> 마음에 드는 제니를 콕 눌러 경품을 뽑아보세요!';
        pill.className = 'mt-5 inline-flex items-center gap-2 bg-amber-900/10 text-amber-950 px-5 py-2 rounded-full font-bold text-xs sm:text-sm';
      }
    }

    function pickRandomPrize() {
      const totalWeight = prizes.reduce((sum, p) => sum + Number(p.weight), 0);
      let rand = Math.random() * totalWeight;

      for (const item of prizes) {
        if (rand < item.weight) {
          return item;
        }
        rand -= item.weight;
      }
      return prizes[0]; // fallback
    }

    function pickItem(id) {
      if (isDrawing) return;

      const element = document.getElementById(id);
      if (openedItems.includes(id)) {
        AudioEngine.playSquish();
        showToast('이미 열어본 제니입니다! 다른 인형을 골라주세요.');
        return;
      }

      if (coins <= 0) {
        AudioEngine.playSquish();
        showToast('남은 복주머니가 없습니다. [새로하기]를 눌러 다시 시작하세요!');
        return;
      }

      isDrawing = true;
      coins -= 1;
      openedItems.push(id);
      updateCoinUI();

      AudioEngine.playSquish();

      element.classList.remove('anim-pop');
      void element.offsetWidth;
      element.classList.add('anim-pop');
      element.classList.add('opened');

      const badge = element.querySelector('.badge-tag');
      if (badge) {
        badge.innerText = '선택됨';
        badge.classList.add('bg-stone-200/90', 'text-stone-500');
      }

      const dollName = element.getAttribute('data-name');

      setTimeout(() => {
        const prize = pickRandomPrize();

        if (prize.isLose) {
          AudioEngine.playLose();
        } else {
          if (window.confetti) {
            confetti({
              particleCount: 65,
              spread: 55,
              origin: { y: 0.62 },
              colors: ['#FFE47F', '#F6B144', '#E8748A', '#8FC472', '#C292D6']
            });
          }
          AudioEngine.playWin();
        }

        const record = {
          date: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          doll: dollName,
          prize: prize.name,
          icon: prize.icon,
          isLose: prize.isLose
        };
        history.unshift(record);
        localStorage.setItem('jennie_history_v3', JSON.stringify(history));

        showResultModal(dollName, prize);
        isDrawing = false;
      }, 500);
    }

    function showResultModal(dollName, prize) {
      document.getElementById('result-doll-name').innerText = `✨ ${dollName}의 선물 상자 ✨`;
      document.getElementById('result-prize-title').innerText = prize.name;
      document.getElementById('result-icon').innerText = prize.icon;

      const titleContainer = document.getElementById('result-title-container');
      const subtext = document.getElementById('result-subtext');

      if (prize.isLose) {
        titleContainer.className = 'py-3 px-4 bg-stone-100 rounded-2xl border border-stone-200 mb-2';
        subtext.innerText = '아쉽네요! 다음 기회에 더 좋은 선물이 나올 거예요 🍂';
      } else {
        titleContainer.className = 'py-3 px-4 bg-amber-50 rounded-2xl border border-amber-200/80 mb-2';
        subtext.innerText = '축하합니다! 제니가 선물을 건네주었습니다 🎉';
      }

      toggleModal('modal-result', true);
    }

    function resetGame() {
      coins = MAX_COINS;
      openedItems = [];

      const dolls = document.querySelectorAll('.doll-clay');
      dolls.forEach(el => {
        el.classList.remove('anim-pop', 'opened');
        const badge = el.querySelector('.badge-tag');
        if (badge) {
          const originName = el.getAttribute('data-name');
          badge.innerText = originName;
          badge.classList.remove('bg-stone-200/90', 'text-stone-500');
        }
      });

      updateCoinUI();
      AudioEngine.playReset();
      showToast('🔄 제니들이 다시 방긋 웃으며 돌아왔습니다! (코인 3개 충전)');
    }

    function toggleModal(modalId, show) {
      const modal = document.getElementById(modalId);
      if (show) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function showToast(message) {
      const existing = document.getElementById('active-toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'active-toast';
      toast.className = 'fixed bottom-20 z-50 bg-stone-900/90 text-white px-5 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm font-bold animate-bounce text-center';
      toast.innerText = message;
      document.body.appendChild(toast);
      setTimeout(() => {
        if (toast) toast.remove();
      }, 2300);
    }

    function renderHistory() {
      const container = document.getElementById('history-list');
      container.innerHTML = '';

      if (history.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-stone-400 text-sm font-medium">
            아직 당첨 내역이 없습니다.<br>귀여운 클레이 제니를 콕 눌러 뽑아보세요!
          </div>
        `;
        return;
      }

      history.forEach(item => {
        const row = document.createElement('div');
        const bgStyle = item.isLose ? 'bg-stone-100/80 border-stone-200' : 'bg-amber-50/70 border-amber-200/70';
        row.className = `flex items-center justify-between p-3 rounded-2xl border ${bgStyle}`;
        row.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-2xl">${item.icon}</span>
            <div>
              <div class="text-sm font-black ${item.isLose ? 'text-stone-600' : 'text-amber-950'}">${item.prize}</div>
              <div class="text-xs text-stone-500">${item.doll}</div>
            </div>
          </div>
          <span class="text-[11px] text-stone-400 font-semibold">${item.date}</span>
        `;
        container.appendChild(row);
      });
    }

    function clearHistory() {
      history = [];
      localStorage.removeItem('jennie_history_v3');
      renderHistory();
      showToast('당첨 내역이 초기화되었습니다.');
    }

    function renderSettings() {
      const table = document.getElementById('prizes-table');
      table.innerHTML = '';

      prizes.forEach((p, idx) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 p-2 bg-amber-50/70 rounded-xl border border-amber-200/60';
        row.innerHTML = `
          <span class="text-lg w-7 text-center">${p.icon}</span>
          <input type="text" class="prize-name-input flex-1 bg-white border border-stone-200 rounded-lg px-2.5 py-1 text-xs text-stone-800 font-bold focus:outline-none focus:ring-1 focus:ring-amber-500" value="${p.name}" data-idx="${idx}" />
          <div class="flex items-center gap-1">
            <span class="text-[11px] text-stone-500 font-medium">가중치</span>
            <input type="number" step="0.1" min="0.1" max="1000" class="prize-weight-input w-16 bg-white border border-stone-200 rounded-lg px-1.5 py-1 text-xs text-center font-bold focus:outline-none focus:ring-1 focus:ring-amber-500" value="${p.weight}" data-idx="${idx}" />
          </div>
        `;
        table.appendChild(row);
      });
    }

    function saveCustomPrizes() {
      const nameInputs = document.querySelectorAll('.prize-name-input');
      const weightInputs = document.querySelectorAll('.prize-weight-input');

      nameInputs.forEach((input, i) => {
        prizes[i].name = input.value.trim() || prizes[i].name;
      });
      weightInputs.forEach((input, i) => {
        prizes[i].weight = Math.max(0.1, parseFloat(input.value) || 1);
      });

      localStorage.setItem('jennie_prizes_v3', JSON.stringify(prizes));
      toggleModal('modal-settings', false);
      showToast('✨ 경품 설정이 저장되었습니다!');
    }

    function resetDefaultPrizes() {
      prizes = JSON.parse(JSON.stringify(DEFAULT_PRIZES));
      localStorage.setItem('jennie_prizes_v3', JSON.stringify(prizes));
      renderSettings();
      showToast('기본 경품 및 가중치로 복원되었습니다.');
    }

    document.addEventListener('DOMContentLoaded', () => {
      createFallingLeaves();
      updateCoinUI();

      document.getElementById('btn-reset').addEventListener('click', () => {
        resetGame();
      });

      document.getElementById('btn-history').addEventListener('click', () => {
        renderHistory();
        toggleModal('modal-history', true);
      });

      document.getElementById('btn-settings').addEventListener('click', () => {
        renderSettings();
        toggleModal('modal-settings', true);
      });

      document.getElementById('btn-close-result').addEventListener('click', () => {
        toggleModal('modal-result', false);
      });

      document.getElementById('btn-sound').addEventListener('click', () => {
        AudioEngine.enabled = !AudioEngine.enabled;
        const icon = document.getElementById('sound-icon');
        const text = document.getElementById('sound-text');
        if (AudioEngine.enabled) {
          icon.innerText = '🔊';
          text.innerText = '효과음 켜짐';
          AudioEngine.playReset();
        } else {
          icon.innerText = '🔇';
          text.innerText = '음소거';
        }
      });
    });
  </script>
</body>
</html>
