            display: inline-block;

            transform: scale(1.1) rotate(8deg);
        }

            animation: shake 0.5s ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            20% { transform: rotate(-15deg) scale(1.1); }
            40% { transform: rotate(15deg) scale(1.1); }
            60% { transform: rotate(-10deg) scale(1.05); }
            80% { transform: rotate(10deg) scale(1.05); }

            bottom: 0;
            left: 50%;
            background: rgba(0, 255, 255, 0.3);
            border: 1px solid rgba(0, 255, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: rise 1.5s ease-in-out forwards;
        }

        @keyframes rise {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(-50%, -110px) scale(1.3); opacity: 0; }

"오늘도 행운이 너와 함께한다."
            ]
        };

        const prefixes = [
            "우주의 기운에 따르면, ", "소라고동의 통찰로는, ", "깊은 바닷속 계시에 의하면, ",
            "단언컨대, ", "지금 상황에서는 ", "머지않아 ", "확실한 것은, ",
            "소라고동이 가만히 들여다보니, ", "신비로운 직감에 의하면, ", "지나가는 구름의 흐름을 보아하니, "
        ];

        const suffixes = [
            " 지혜롭게 대처해라.", " 너무 조급해하지 마라.", " 결과는 너의 노력에 달렸다.",
            " 확신을 가져도 좋다.", " 마음에 평정을 유지해라.", " 일단 한 걸음 물러서서 관망해라.",
            " 스스로의 직감을 끝까지 믿어라."
        ];

        const rareEvents = [
            "✨ 이번 질문은 우주가 허락한 단 하나의 진실이다. 당장 로또를 사라!",
            "🔥 묻지도 따지지도 말고 오늘 하루 방콕해라. 대재앙이 몰려온다!",
            "🍀 네가 바라는 모든 소원이 오늘 밤 이루어질 것이다!",
            "💎 너의 선택이 완벽한 성공을 이끌어낼 것이다!"
        ];

        function analyzeQuestion(rawInput) {
            const text = rawInput.trim();
            state.totalCount++;

let category = "기타";

// 욕설
if (/(씨발|시발|ㅅㅂ|개새|개새끼|병신|ㅂㅅ|미친|지랄|좆|존나|꺼져|닥쳐|죽어|염병|썅|씹|븅신)/i.test(text))
    category = "욕설";

// 인사
else if (/(안녕|안뇽|반가|하이|헬로|ㅎㅇ|좋은아침|좋은저녁|반갑|오랜만|잘지냈|안녕하세요|hello|hi)/i.test(text))
    category = "인사";

// 취업
else if (/(취업|취직|입사|회사|직장|출근|퇴사|이직|면접|면접관|합격|불합격|공채|채용|채용공고|헤드헌터|연봉|월급|급여|알바|아르바이트|인턴|자소서|자기소개서|이력서|포트폴리오|경력|신입|사원)/i.test(text))
    category = "취업";

// 연애
else if (/(연애|사랑|고백|썸|썸남|썸녀|남친|여친|남자친구|여자친구|소개팅|짝사랑|이별|재회|데이트|결혼할사람|호감|플러팅|카톡|연락|고백할까|사귀)/i.test(text))
    category = "연애";

// 돈
else if (/(돈|재산|부자|가난|월급|연봉|용돈|환급|세금|카드|카드값|통장|적금|예금|저축|대출|빚|채무|이자|수입|지출|재테크|보험|현금|자산|생활비)/i.test(text))
    category = "돈";

// 주식
else if (/(주식|증시|코스피|코스닥|삼성전자|엔비디아|애플|테슬라|매수|매도|물타기|불타기|상한가|하한가|종목|배당|PER|ETF|나스닥|미장|국장|공모주|손절|익절)/i.test(text))
    category = "주식";

// 코인
else if (/(코인|비트코인|비트|BTC|이더|ETH|리플|도지|솔라나|알트|김프|업비트|바이낸스|떡상|떡락|선물|롱|숏|레버리지|가상화폐|암호화폐)/i.test(text))
    category = "코인";

// 결혼
else if (/(결혼|웨딩|청첩장|상견례|신혼|혼인|신혼여행|예물|예단|프로포즈|결혼식|배우자|남편|아내|부부)/i.test(text))
    category = "결혼";

// 가족
else if (/(가족|엄마|아빠|부모|부모님|형|누나|언니|오빠|동생|형제|자매|할머니|할아버지|친척|조카|집안)/i.test(text))
    category = "가족";

// 친구
else if (/(친구|절친|베프|우정|동창|동기|친한친구|술친구|모임|지인)/i.test(text))
    category = "친구";

// 건강
else if (/(건강|몸살|감기|독감|병원|의사|약|약국|영양제|비타민|피로|운동|다이어트|살|비만|혈압|당뇨|허리|목|무릎|아프|기침|열|두통|스트레스|잠|수면)/i.test(text))
    category = "건강";

// 공부
else if (/(공부|학습|독서실|성적|숙제|과제|복습|예습|암기|필기|교재|문제집|인강|강의|수업|학교|대학교|학생|교수|학원|책)/i.test(text))
    category = "공부";

// 시험
else if (/(시험|합격|불합격|수능|모의고사|중간고사|기말고사|자격증|토익|토플|JLPT|한국사|기사시험|공무원시험|면허시험|응시)/i.test(text))
    category = "시험";

// 음식
else if (/(음식|먹을까|뭐먹|배고파|맛집|식당|치킨|피자|햄버거|족발|보쌈|삼겹살|고기|라면|국밥|초밥|회|짜장|짬뽕|떡볶이|김밥|커피|디저트|술|맥주|소주|배달|점심|저녁|아침|야식)/i.test(text))
    category = "음식";

// 게임
else if (/(게임|롤|리그오브레전드|LOL|발로란트|오버워치|피파|메이플|던파|로스트아크|배그|PUBG|스타|디아블로|마인크래프트|포켓몬|티어|랭크|강화|가챠|레벨업|보스|던전)/i.test(text))
    category = "게임";

// 언제
else if (/(언제|몇시|몇 시|몇년|몇 년|언제쯤|언제까지|며칠|몇달|몇 달|얼마나 걸려|시기|타이밍)/i.test(text))
    category = "언제";

// 어디
else if (/(어디|어디서|어느곳|어느 곳|장소|위치|방향|어디로|어디에|찾아가|가야|갈까)/i.test(text))
    category = "어디";

// 예/아니오
else if (/(될까|할까|맞을까|가능할까|괜찮을까|사도될까|가도될까|해도될까|맞아|맞나|맞습니까|인가|일까|일지|가능성|확률|\?$)/i.test(text))
    category = "예/아니오";

            if (!["기타", "인사", "욕설"].includes(category)) {
                state.userMemory = category;
            }

            if (state.totalCount > 20) {
                state.moodIndex = 3;
                document.body.className = "mood-enlightened";
            } else if (state.totalCount > 10) {
                state.moodIndex = 2;
                document.body.className = "mood-tsundere";
            } else if (state.totalCount > 4) {
                state.moodIndex = 1;
                document.body.className = "mood-kind";
            } else {
                state.moodIndex = 0;
                document.body.className = "";
            }

            return category;
        }

        function generateAnswer(category) {
            const isRare = Math.random() < 0.05;
            if (isRare) {
                document.getElementById('rareNotice').style.display = 'block';
                return rareEvents[Math.floor(Math.random() * rareEvents.length)];
            } else {
                document.getElementById('rareNotice').style.display = 'none';
            }

            const pool = categories[category] || categories["기타"];
            let baseAnswer = "";
            let attempts = 0;

            do {
                baseAnswer = pool[Math.floor(Math.random() * pool.length)];
                attempts++;
            } while (state.recentAnswers.includes(baseAnswer) && attempts < 5);

            let finalAnswer = baseAnswer;
            if (Math.random() < 0.5 && !["욕설", "인사"].includes(category)) {
                const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
                const suffix = suffixes[Math.floor(Math.random() * suffixes.length)];
                finalAnswer = `${prefix}${baseAnswer}${suffix}`;
            }

            state.recentAnswers.push(baseAnswer);
            if (state.recentAnswers.length > 15) state.recentAnswers.shift();

            if (state.moodIndex === 2) finalAnswer += " (똑바로 차려라.)";
            else if (state.moodIndex === 3) finalAnswer += " ...뭐, 결국 네 선택이다.";

            return finalAnswer;
        }

        function triggerEffects() {
            const wrapper = document.getElementById('conchWrapper');
            const conchImg = document.getElementById('conchImg');
            
            conchImg.classList.add('shake');
            setTimeout(() => conchImg.classList.remove('shake'), 500);

            for (let i = 0; i < 5; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                const size = Math.random() * 15 + 10;
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.left = `${Math.random() * 80 - 40}px`;
                bubble.style.animationDuration = `${Math.random() * 0.8 + 1}s`;
                wrapper.appendChild(bubble);
                setTimeout(() => bubble.remove(), 1500);
            }
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const cleanText = text.replace(/\[.*?\]/g, '').replace(/[✨🔥🍀💎🔮🌟]/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'ko-KR';
            utterance.pitch = 0.6;
            utterance.rate = 0.95; 
            window.speechSynthesis.speak(utterance);
        }

        function updateStatusUI() {
            document.getElementById('statMood').textContent = `기분: ${state.moodNames[state.moodIndex]}`;
            document.getElementById('statCount').textContent = `질문 횟수: ${state.totalCount}회`;
            document.getElementById('statMemory').textContent = ` `;
        }

        function askConch() {
            const input = document.getElementById('questionInput');
            const answerDiv = document.getElementById('answerText');
            const categoryTag = document.getElementById('categoryTag');
            const actionBtns = document.getElementById('actionBtns');
            
            const rawText = input.value.trim();
            if (rawText === "") {
                alert("소라고동에게 건넬 질문을 입력해주세요!");
                input.focus();
                return;
            }

            const category = analyzeQuestion(rawText);
            const answer = generateAnswer(category);

            state.history.unshift({ q: rawText, a: answer });
            updateHistoryUI();

            answerDiv.classList.remove('show');
            actionBtns.classList.remove('show');
            categoryTag.textContent = ``;

            setTimeout(() => {
                answerDiv.textContent = answer;
                answerDiv.classList.add('show');
                actionBtns.classList.add('show');
                triggerEffects();
                speakText(answer);
                updateStatusUI();
                input.value = "";
                input.focus();
            }, 300);
        }

        function copyAnswer() {
            const answerText = document.getElementById('answerText').textContent;
            navigator.clipboard.writeText(answerText).then(() => {
                alert("소라고동의 답변이 클립보드에 복사되었습니다!");
            });
        }

        function toggleHistory() {
            const historyBox = document.getElementById('historyBox');
            if (historyBox.style.display === 'block') {
                historyBox.style.display = 'none';
            } else {
                historyBox.style.display = 'block';
            }
        }

        function updateHistoryUI() {
            const historyBox = document.getElementById('historyBox');
            historyBox.innerHTML = state.history.map(item => `
                <div class="history-item">
                    <div class="history-q">Q: ${item.q}</div>
                    <div class="history-a">A: ${item.a}</div>
                </div>
            `).join('');
        }

        document.getElementById('questionInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askConch();
            }
        });
    </script>
</body>
</html>
