    <script>
        // --- 1. Web Audio API 엔진 ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        const SoundEngine = {
            getDistanceGain: function(worldPos, maxDist = 320) {
                if (!camera || !worldPos) return 1.0;
                const dist = camera.position.distanceTo(worldPos);
                const factor = THREE.MathUtils.clamp(1 - (dist - 15) / (maxDist - 15), 0, 1);
                return factor * factor;
            },

            playMetallicHit: function(volume = 0.4, worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const finalVolume = volume * this.getDistanceGain(worldPos, 260);
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1200 + Math.random() * 600, now);
                    osc.frequency.exponentialRampToValueAtTime(140, now + 0.1);
                    gain.gain.setValueAtTime(finalVolume * 0.4, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } catch(e) {}
            },

            playFlipperLaunch: function(worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const finalVolume = 0.5 * this.getDistanceGain(worldPos, 360);
                    if (finalVolume <= 0.001) return;

                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.type = 'square';
                    osc1.frequency.setValueAtTime(220, now);
                    osc1.frequency.exponentialRampToValueAtTime(50, now + 0.2);
                    gain1.gain.setValueAtTime(finalVolume * 0.6, now);
                    gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.start(now);
                    osc1.stop(now + 0.2);
                } catch(e) {}
            },

            playBooster: function(worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const finalVolume = 0.3 * this.getDistanceGain(worldPos, 350);
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.3);
                    gain.gain.setValueAtTime(finalVolume, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.3);
                } catch(e) {}
            },

            playWormhole: function(worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const finalVolume = 0.4 * this.getDistanceGain(worldPos, 400);
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(800, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.4);
                    gain.gain.setValueAtTime(finalVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.4);
                } catch(e) {}
            },

            playItemBox: function(worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const finalVolume = 0.3 * this.getDistanceGain(worldPos, 300);
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.07);
                    osc.frequency.setValueAtTime(1046, now + 0.15);
                    gain.gain.setValueAtTime(finalVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } catch(e) {}
            }
        };

        // --- 5. 절차적 스튜디오 환경 큐브맵(IBL) 생성 ---
        function generateProceduralEnvironmentMap(renderer) {
            const size = 256;
            const cubeRenderTarget = new THREE.WebGLCubeRenderTarget(size, {
                format: THREE.RGBFormat,
                generateMipmaps: true,
                minFilter: THREE.LinearMipmapLinearFilter,
                magFilter: THREE.LinearFilter
            });

            const cubeCamera = new THREE.CubeCamera(0.1, 100, cubeRenderTarget);
            const tempScene = new THREE.Scene();

            const boxGeo = new THREE.BoxGeometry(40, 40, 40);
            const mats = [
                new THREE.MeshBasicMaterial({ color: 0x00e5ff }),
                new THREE.MeshBasicMaterial({ color: 0xff007f }),
                new THREE.MeshBasicMaterial({ color: 0xffffff }),
                new THREE.MeshBasicMaterial({ color: 0x050510 }),
                new THREE.MeshBasicMaterial({ color: 0x38bdf8 }),
                new THREE.MeshBasicMaterial({ color: 0xa855f7 })
            ];
            const envBox = new THREE.Mesh(boxGeo, mats);
            envBox.material.forEach(m => m.side = THREE.BackSide);
            tempScene.add(envBox);

            cubeCamera.update(renderer, tempScene);
            return cubeRenderTarget.texture;
        }

        // --- 6. 절차적 카본 & 레이싱 그리드 트랙 텍스처 생성 ---
        function generateProceduralTrackTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#111118';
            ctx.fillRect(0, 0, 1024, 1024);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
            ctx.lineWidth = 2;
            const step = 32;
            for (let x = 0; x < 1024; x += step) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1024); ctx.stroke();
            }
            for (let y = 0; y < 1024; y += step) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
            }

            ctx.fillStyle = 'rgba(0, 229, 255, 0.22)';
            ctx.fillRect(504, 0, 16, 1024);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(510, 0, 4, 1024);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 4;
            ctx.setLineDash([40, 40]);
            ctx.beginPath(); ctx.moveTo(256, 0); ctx.lineTo(256, 1024); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(768, 0); ctx.lineTo(768, 1024); ctx.stroke();
            ctx.setLineDash([]);

            for (let y = 0; y < 1024; y += 64) {
                ctx.fillStyle = (y / 64) % 2 === 0 ? '#ff0055' : '#ffffff';
                ctx.fillRect(0, y, 28, 64);
                ctx.fillRect(996, y, 28, 64);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 24);
            return texture;
        }

        // --- 8. RMF(Rotation Minimizing Frames) 연산 ---
        function computeRobustSurfaceFrames() {
            surfaceFrames = [];
            
            const p0 = trackSpline.getPointAt(0);
            const t0 = trackSpline.getTangentAt(0).normalize();
            
            let initialUp = new THREE.Vector3(0, 1, 0);
            if (Math.abs(t0.dot(initialUp)) > 0.95) initialUp = new THREE.Vector3(0, 0, 1);
            
            let r0 = new THREE.Vector3().crossVectors(t0, initialUp).normalize();
            let u0 = new THREE.Vector3().crossVectors(r0, t0).normalize();

            let currentP = p0;
            let currentT = t0;
            let currentR = r0;
            let currentU = u0;

            for (let i = 0; i <= SEGMENTS_COUNT; i++) {
                const t = i / SEGMENTS_COUNT;
                const nextP = trackSpline.getPointAt(t);
                const nextT = trackSpline.getTangentAt(t).normalize();

                if (i > 0) {
                    const v1 = new THREE.Vector3().subVectors(nextP, currentP);
                    const c1 = v1.lengthSq();
                    if (c1 > 1e-6) {
                        const rL = currentR.clone().sub(v1.clone().multiplyScalar((2 / c1) * currentR.dot(v1)));
                        const tL = currentT.clone().sub(v1.clone().multiplyScalar((2 / c1) * currentT.dot(v1)));
                        
                        const v2 = new THREE.Vector3().subVectors(nextT, tL);
                        const c2 = v2.lengthSq();
                        if (c2 > 1e-6) {
                            currentR = rL.sub(v2.clone().multiplyScalar((2 / c2) * rL.dot(v2))).normalize();
                        } else {
                            currentR = rL.normalize();
                        }
                        currentU = new THREE.Vector3().crossVectors(currentR, nextT).normalize();
                    }
                    currentP = nextP;
                    currentT = nextT;
                }

                const dt = 0.005;
                const tBefore = Math.max(0, t - dt);
                const tAfter = Math.min(1, t + dt);
                const tanB = trackSpline.getTangentAt(tBefore).normalize();
                const tanA = trackSpline.getTangentAt(tAfter).normalize();
                
                const dTan = new THREE.Vector3().subVectors(tanA, tanB);
                const lateralCurvature = dTan.dot(currentR);
                const bankAngle = THREE.MathUtils.clamp(lateralCurvature * 8.5, -0.52, 0.52);

                const finalR = currentR.clone().applyAxisAngle(currentT, bankAngle);
                const finalU = currentU.clone().applyAxisAngle(currentT, bankAngle);

                surfaceFrames.push({
                    point: currentP.clone(),
                    tangent: currentT.clone(),
                    normal: finalU,
                    binormal: finalR
                });
            }
        }

        function getSurfaceOrientationAt(progress) {
            const safeT = THREE.MathUtils.clamp(progress, 0.0001, 0.9999);
            const floatIdx = safeT * SEGMENTS_COUNT;
            const idx1 = Math.floor(floatIdx);
            const idx2 = Math.min(SEGMENTS_COUNT, idx1 + 1);
            const alpha = floatIdx - idx1;

            const f1 = surfaceFrames[idx1];
            const f2 = surfaceFrames[idx2];

            const point = trackSpline.getPointAt(safeT);
            const tangent = trackSpline.getTangentAt(safeT).normalize();
            const normal = f1.normal.clone().lerp(f2.normal, alpha).normalize();
            const binormal = f1.binormal.clone().lerp(f2.binormal, alpha).normalize();

            return { point, tangent, normal, binormal };
        }

        function getTrackSagHeight(laneOffset) {
            const offsetNorm = THREE.MathUtils.clamp(laneOffset / (ROAD_WIDTH / 2), -1, 1);
            return (1 - offsetNorm * offsetNorm) * -0.9;
        }

        // --- 9. 정교한 PBR 트랙 및 게이트 빌드 ---
        function buildTrack(mapKey) {
            trackMeshes.forEach(mesh => scene.remove(mesh));
            trackMeshes = [];
            sceneryMeshes.forEach(mesh => scene.remove(mesh));
            sceneryMeshes = [];
            
            clearEntities();

            const mapData = trackPresets[mapKey];
            scene.background = new THREE.Color(mapData.ambient);
            scene.fog = new THREE.FogExp2(mapData.fog, 0.0014);

            trackSpline = new THREE.CatmullRomCurve3(mapData.points);
            trackSpline.closed = false;

            computeRobustSurfaceFrames();

            const CROSS_SECTIONS = 6;
            const vertices = [];
            const uvs = [];
            const indices = [];
            const leftEdgePts = [];
            const rightEdgePts = [];

            const isChasm = (t) => {
                if (!mapData.jumpZones) return false;
                return mapData.jumpZones.some(z => t > z.start + 0.015 && t < z.end - 0.015);
            };

            for (let i = 0; i <= SEGMENTS_COUNT; i++) {
                const t = i / SEGMENTS_COUNT;
                const { point, normal, binormal } = surfaceFrames[i];

                for (let j = 0; j <= CROSS_SECTIONS; j++) {
                    const u = j / CROSS_SECTIONS;
                    const offsetNorm = (u - 0.5) * 2;
                    const widthOffset = offsetNorm * (ROAD_WIDTH / 2);
                    const sagHeight = getTrackSagHeight(widthOffset);

                    const vert = point.clone()
                        .add(binormal.clone().multiplyScalar(widthOffset))
                        .add(normal.clone().multiplyScalar(sagHeight));

                    vertices.push(vert.x, vert.y, vert.z);
                    uvs.push(u, t);

                    if (j === 0) leftEdgePts.push(vert.clone().add(normal.clone().multiplyScalar(0.7)));
                    if (j === CROSS_SECTIONS) rightEdgePts.push(vert.clone().add(normal.clone().multiplyScalar(0.7)));
                }

                if (i < SEGMENTS_COUNT) {
                    const nextT = (i + 1) / SEGMENTS_COUNT;
                    if (!isChasm(t) && !isChasm(nextT)) {
                        for (let j = 0; j < CROSS_SECTIONS; j++) {
                            const curRow = i * (CROSS_SECTIONS + 1);
                            const nextRow = (i + 1) * (CROSS_SECTIONS + 1);

                            indices.push(curRow + j, curRow + j + 1, nextRow + j);
                            indices.push(curRow + j + 1, nextRow + j + 1, nextRow + j);
                        }
                    }
                }
            }

            const roadGeometry = new THREE.BufferGeometry();
            roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            roadGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            roadGeometry.setIndex(indices);
            roadGeometry.computeVertexNormals();

            const trackTexture = generateProceduralTrackTexture();
            const roadMaterial = new THREE.MeshStandardMaterial({
                color: mapData.roadColor,
                map: trackTexture,
                roughness: 0.32,
                metalness: 0.65,
                side: THREE.DoubleSide
            });

            const roadMesh = new THREE.Mesh(roadGeometry, roadMaterial);
            scene.add(roadMesh);
            trackMeshes.push(roadMesh);

            if (leftEdgePts.length > 0) {
                const railGeoL = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(leftEdgePts), SEGMENTS_COUNT, 0.45, 6, false);
                const railGeoR = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rightEdgePts), SEGMENTS_COUNT, 0.45, 6, false);
                const railMat = new THREE.MeshStandardMaterial({
                    color: mapData.glowColor,
                    emissive: mapData.glowColor,
                    emissiveIntensity: 1.8,
                    roughness: 0.1
                });

                const railL = new THREE.Mesh(railGeoL, railMat);
                const railR = new THREE.Mesh(railGeoR, railMat);
                scene.add(railL, railR);
                trackMeshes.push(railL, railR);
            }

            if (mapKey === 'cyber') {
                for (let k = 0.08; k < 0.95; k += 0.07) {
                    const { point, normal } = getSurfaceOrientationAt(k);
                    const ringGeo = new THREE.TorusGeometry(ROAD_WIDTH * 0.55, 0.35, 8, 24);
                    const ringMat = new THREE.MeshStandardMaterial({ color: 0xec4899, emissive: 0xec4899, emissiveIntensity: 1.5 });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.position.copy(point).add(normal.clone().multiplyScalar(4.0));
                    scene.add(ringMesh);
                    trackMeshes.push(ringMesh);
                }
            }

            createSurfaceGate(0, 0x00e5ff, 'START LINE');
            createSurfaceGate(1, 0xff0055, 'FINISH LINE');

            proceduralSpawnEntities();
            buildScenery(mapData.glowColor);
        }

        function createSurfaceGate(t, color, text) {
            const { point, tangent, normal, binormal } = getSurfaceOrientationAt(t);
            const group = new THREE.Group();

            const gateGeo = new THREE.TorusGeometry(26, 0.6, 8, 32, Math.PI);
            const gateMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 1.5, roughness: 0.2 });
            const arch = new THREE.Mesh(gateGeo, gateMat);
            group.add(arch);

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = '#' + color.toString(16).padStart(6, '0');
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 504, 120);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px "Black Han Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const bannerMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
            const bannerMesh = new THREE.Mesh(new THREE.PlaneGeometry(22, 4.8), bannerMat);
            bannerMesh.position.y = 20.5;
            group.add(bannerMesh);

            const rotMatrix = new THREE.Matrix4();
            rotMatrix.makeBasis(binormal, normal, tangent.clone().negate());
            group.quaternion.setFromRotationMatrix(rotMatrix);
            group.position.copy(point);

            scene.add(group);
            trackMeshes.push(group);
        }

        function clearEntities() {
            dynamicItems.forEach(i => scene.remove(i.group));
            dynamicItems = [];
            dynamicTraps.forEach(t => scene.remove(t.mesh));
            dynamicTraps = [];
            dynamicFlippers.forEach(f => scene.remove(f.group));
            dynamicFlippers = [];
            dynamicSpinners.forEach(s => scene.remove(s.mesh));
            dynamicSpinners = [];
            activeWormholes.forEach(w => scene.remove(w.mesh));
            activeWormholes = [];
        }

        // --- 10. 3D 홀로그램 아이템 모델 생성 ---
        function createHoloItemModel(type) {
            const group = new THREE.Group();

            if (type === 'booster') {
                const bodyGeo = new THREE.ConeGeometry(0.8, 2.4, 16);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff3b30, emissive: 0xff0055, emissiveIntensity: 1.2, metalness: 0.8, roughness: 0.2 });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                body.rotation.x = -Math.PI / 2;
                group.add(body);

                const ringGeo = new THREE.TorusGeometry(0.9, 0.15, 8, 16);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                group.add(new THREE.Mesh(ringGeo, ringMat));
            } else if (type === 'thunder') {
                const boltGeo = new THREE.CylinderGeometry(0.2, 0.4, 2.4, 8);
                const boltMat = new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0xffcc00, emissiveIntensity: 1.8 });
                const b1 = new THREE.Mesh(boltGeo, boltMat);
                b1.rotation.z = Math.PI / 4;
                b1.position.set(-0.4, 0.4, 0);
                const b2 = new THREE.Mesh(boltGeo, boltMat);
                b2.rotation.z = -Math.PI / 4;
                b2.position.set(0.4, -0.4, 0);
                group.add(b1, b2);
            } else if (type === 'magnet') {
                const magnetGeo = new THREE.TorusGeometry(1.0, 0.35, 12, 16, Math.PI);
                const magnetMat = new THREE.MeshStandardMaterial({ color: 0xa855f7, emissive: 0x9333ea, emissiveIntensity: 1.4, metalness: 0.7, roughness: 0.2 });
                const mag = new THREE.Mesh(magnetGeo, magnetMat);
                mag.rotation.z = Math.PI;
                group.add(mag);
            } else {
                const shieldGeo = new THREE.OctahedronGeometry(1.2, 0);
                const shieldMat = new THREE.MeshStandardMaterial({ color: 0x00e5ff, emissive: 0x00e5ff, emissiveIntensity: 1.5, wireframe: true });
                group.add(new THREE.Mesh(shieldGeo, shieldMat));
            }

            const podGeo = new THREE.SphereGeometry(1.9, 16, 16);
            const podMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, transmission: 0.9, opacity: 0.5, transparent: true, roughness: 0.08, ior: 1.4
            });
            group.add(new THREE.Mesh(podGeo, podMat));

            return group;
        }

        function proceduralSpawnEntities() {
            clearEntities();

            const itemTypes = ['booster', 'thunder', 'magnet', 'shield'];
            const itemCount = 8;
            for (let i = 0; i < itemCount; i++) {
                const t = 0.08 + (i / itemCount) * 0.82;
                [-7.5, 0, 7.5].forEach((offset, idx) => {
                    const assignedType = itemTypes[(i + idx) % itemTypes.length];
                    const itemVisual = createHoloItemModel(assignedType);
                    scene.add(itemVisual);

                    dynamicItems.push({
                        group: itemVisual,
                        type: assignedType,
                        progress: t,
                        laneOffset: offset,
                        active: true,
                        respawnTimer: 0
                    });
                });
            }

            const trapCount = 16;
            const bananaGeo = new THREE.TorusGeometry(1.4, 0.6, 8, 16, Math.PI);
            const bananaMat = new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0xffaa00, emissiveIntensity: 0.8 });
            const boostGeo = new THREE.BoxGeometry(6.5, 0.3, 4.5);
            const boostMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 1.6 });
            const bumperGeo = new THREE.CylinderGeometry(2.5, 3.2, 2.5, 16);
            const bumperMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 1.5, metalness: 0.8, roughness: 0.2 });

            for (let i = 0; i < trapCount; i++) {
                const t = 0.06 + Math.random() * 0.88;
                const rnd = Math.random();
                let type = 'boost';
                let mesh = null;

                if (rnd < 0.45) {
                    type = 'boost';
                    mesh = new THREE.Mesh(boostGeo, boostMat);
                } else if (rnd < 0.75) {
                    type = 'banana';
                    mesh = new THREE.Mesh(bananaGeo, bananaMat);
                } else {
                    type = 'bumper';
                    mesh = new THREE.Mesh(bumperGeo, bumperMat);
                }

                scene.add(mesh);
                dynamicTraps.push({
                    mesh: mesh, type: type, progress: t, laneOffset: (Math.random() - 0.5) * (ROAD_WIDTH - 8), active: true
                });
            }

            const mapData = trackPresets[activeMapKey];
            if (mapData.flippers) {
                mapData.flippers.forEach(cfg => createFlipperEntity(cfg.progress, cfg.side));
            }
            if (mapData.spinners) {
                mapData.spinners.forEach(cfg => createSpinnerEntity(cfg.progress, cfg.speed));
            }
            if (mapData.wormholes) {
                mapData.wormholes.forEach(cfg => spawnSingleUseWormhole(cfg.enter, cfg.rewindTo));
            }

            alignAllEntities();
        }

        function createFlipperEntity(progress, side) {
            const group = new THREE.Group();
            const pivotBaseGeo = new THREE.CylinderGeometry(1.6, 1.8, 3.5, 16);
            const pivotBaseMat = new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.9, roughness: 0.2 });
            group.add(new THREE.Mesh(pivotBaseGeo, pivotBaseMat));

            const paddlePivot = new THREE.Group();
            const paddleGeo = new THREE.BoxGeometry(11.5, 2.2, 1.8);
            paddleGeo.translate(side === 'left' ? 5.2 : -5.2, 0, 0);

            const paddleMat = new THREE.MeshStandardMaterial({
                color: side === 'left' ? 0xff007f : 0x00e5ff,
                emissive: side === 'left' ? 0xff0055 : 0x00a2ff,
                emissiveIntensity: 1.4,
                roughness: 0.15,
                metalness: 0.85
            });
            paddlePivot.add(new THREE.Mesh(paddleGeo, paddleMat));

            const neonGeo = new THREE.BoxGeometry(11.0, 0.4, 0.4);
            neonGeo.translate(side === 'left' ? 5.2 : -5.2, 1.2, 0);
            paddlePivot.add(new THREE.Mesh(neonGeo, new THREE.MeshBasicMaterial({ color: 0xffffff })));

            group.add(paddlePivot);
            scene.add(group);

            dynamicFlippers.push({
                group: group,
                paddlePivot: paddlePivot,
                progress: progress,
                side: side,
                baseLane: side === 'left' ? -(ROAD_WIDTH / 2 - 1.8) : (ROAD_WIDTH / 2 - 1.8),
                swingPhase: Math.random() * Math.PI * 2,
                currentAngle: 0,
                angularVelocity: 0
            });
        }

        function createSpinnerEntity(progress, speed) {
            const group = new THREE.Group();
            const postGeo = new THREE.CylinderGeometry(1.0, 1.0, 5.0, 16);
            const postMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.3 });
            group.add(new THREE.Mesh(postGeo, postMat));

            const bladeGeo = new THREE.BoxGeometry(10.0, 1.2, 1.0);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0xeab308, emissive: 0xca8a04, emissiveIntensity: 1.2, metalness: 0.8, roughness: 0.2 });
            const bladeMesh = new THREE.Mesh(bladeGeo, bladeMat);
            bladeMesh.position.y = 1.8;
            group.add(bladeMesh);

            scene.add(group);
            dynamicSpinners.push({
                mesh: group,
                bladeMesh: bladeMesh,
                progress: progress,
                rotationSpeed: speed || 0.05
            });
        }

        function spawnSingleUseWormhole(enterProgress, rewindDistance) {
            const group = new THREE.Group();
            const ringGeo = new THREE.TorusGeometry(8.5, 1.2, 16, 32);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0x9333ea, emissive: 0xa855f7, emissiveIntensity: 2.0, wireframe: true });
            group.add(new THREE.Mesh(ringGeo, ringMat));

            const coreGeo = new THREE.CircleGeometry(7.5, 24);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x3b0764, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
            group.add(new THREE.Mesh(coreGeo, coreMat));

            scene.add(group);
            activeWormholes.push({
                mesh: group, enter: enterProgress, rewindTo: rewindDistance, active: true, respawnCooldown: 0
            });
        }

        function alignAllEntities() {
            if (!trackSpline || surfaceFrames.length === 0) return;

            dynamicItems.forEach(item => {
                const { point, normal, binormal } = getSurfaceOrientationAt(item.progress);
                const sagHeight = getTrackSagHeight(item.laneOffset);
                item.group.position.copy(point)
                    .add(binormal.clone().multiplyScalar(item.laneOffset))
                    .add(normal.clone().multiplyScalar(2.6 + sagHeight));
            });

            dynamicTraps.forEach(trap => {
                const { point, tangent, normal, binormal } = getSurfaceOrientationAt(trap.progress);
                const sagHeight = getTrackSagHeight(trap.laneOffset);
                const rotMatrix = new THREE.Matrix4();
                rotMatrix.makeBasis(binormal, normal, tangent.clone().negate());
                trap.mesh.quaternion.setFromRotationMatrix(rotMatrix);
                trap.mesh.position.copy(point)
                    .add(binormal.clone().multiplyScalar(trap.laneOffset))
                    .add(normal.clone().multiplyScalar((trap.type === 'bumper' ? 1.25 : 0.7) + sagHeight));
            });

            dynamicFlippers.forEach(f => {
                const { point, tangent, normal, binormal } = getSurfaceOrientationAt(f.progress);
                const sagHeight = getTrackSagHeight(f.baseLane);
                const rotMatrix = new THREE.Matrix4();
                rotMatrix.makeBasis(binormal, normal, tangent.clone().negate());
                f.group.quaternion.setFromRotationMatrix(rotMatrix);
                f.group.position.copy(point)
                    .add(binormal.clone().multiplyScalar(f.baseLane))
                    .add(normal.clone().multiplyScalar(1.2 + sagHeight));
            });

            dynamicSpinners.forEach(s => {
                const { point, tangent, normal, binormal } = getSurfaceOrientationAt(s.progress);
                const sagHeight = getTrackSagHeight(0);
                const rotMatrix = new THREE.Matrix4();
                rotMatrix.makeBasis(binormal, normal, tangent.clone().negate());
                s.mesh.quaternion.setFromRotationMatrix(rotMatrix);
                s.mesh.position.copy(point).add(normal.clone().multiplyScalar(1.5 + sagHeight));
            });

            activeWormholes.forEach(w => {
                if (w.active) {
                    const { point, tangent, normal, binormal } = getSurfaceOrientationAt(w.enter);
                    const rotMatrix = new THREE.Matrix4();
                    rotMatrix.makeBasis(binormal, normal, tangent.clone().negate());
                    w.mesh.quaternion.setFromRotationMatrix(rotMatrix);
                    w.mesh.position.copy(point).add(normal.clone().multiplyScalar(7.5));
                }
            });
        }

        function buildScenery(glowColor) {
            const starGeo = new THREE.BufferGeometry();
            const starPositions = [];
            for (let i = 0; i < 2000; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const r = 2600 + Math.random() * 800;
                starPositions.push(r * Math.sin(phi) * Math.cos(theta), r * Math.sin(phi) * Math.sin(theta), r * Math.cos(phi));
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2.0, transparent: true, opacity: 0.8 });
            const starPoints = new THREE.Points(starGeo, starMat);
            scene.add(starPoints);
            sceneryMeshes.push(starPoints);

            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            for (let i = 0; i < 55; i++) {
                const h = 80 + Math.random() * 160;
                const w = 25 + Math.random() * 40;
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x080816,
                    emissive: (i % 3 === 0) ? glowColor : 0x0a0a24,
                    emissiveIntensity: 0.4,
                    roughness: 0.4
                });
                const bldg = new THREE.Mesh(boxGeo, mat);
                const angle = Math.random() * Math.PI * 2;
                const dist = 650 + Math.random() * 550;
                bldg.scale.set(w, h, w);
                bldg.position.set(Math.cos(angle) * dist, h / 2 - 60, Math.sin(angle) * dist);
                scene.add(bldg);
                sceneryMeshes.push(bldg);
            }

            const gridHelper = new THREE.GridHelper(3200, 80, glowColor, 0x111126);
            gridHelper.position.y = -65;
            scene.add(gridHelper);
            sceneryMeshes.push(gridHelper);
        }

        // --- 11. 구슬 엔티티 생성 (제니 1인 단독 기본값 대응) ---
        function createRacers() {
            racers.forEach(r => scene.remove(r.mesh));
            racers = [];

            const personalities = [
                { style: 'aggressive', baseLanePreference: 0.0, wanderSpan: 5.5, itemGreed: 0.85 },
                { style: 'left_wing',  baseLanePreference: -4.5, wanderSpan: 4.0, itemGreed: 0.65 },
                { style: 'right_wing', baseLanePreference: 4.5,  wanderSpan: 4.0, itemGreed: 0.65 },
                { style: 'wide_drifter', baseLanePreference: 0.0, wanderSpan: 6.5, itemGreed: 0.95 },
                { style: 'in_cutter',  baseLanePreference: -2.5, wanderSpan: 4.5, itemGreed: 0.50 },
                { style: 'out_runner', baseLanePreference: 3.0,  wanderSpan: 4.5, itemGreed: 0.70 }

            racers = currentPlayers.map((player, index) => {
                const group = new THREE.Group();

                marbleMesh.add(coreMesh);

                const gyroGeo = new THREE.TorusGeometry(BALL_RADIUS * 0.78, 0.08, 12, 32);
                const gyroMat = new THREE.MeshStandardMaterial({
                    color: 0xcccccc,
                    emissive: colorHex,
                    emissiveIntensity: 0.8,
                    metalness: 0.95,
                    roughness: 0.08
                });
                const gyro1 = new THREE.Mesh(gyroGeo, gyroMat);
                const gyro2 = new THREE.Mesh(gyroGeo, gyroMat);
                gyro2.rotation.x = Math.PI / 2;
                marbleMesh.add(gyro1, gyro2);

                const shellGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
                const shellMat = new THREE.MeshPhysicalMaterial({
                    color: 0xffffff,
                    metalness: 0.05,
                    roughness: 0.02,
                    transmission: 0.92,
                    ior: 1.52,
                    thickness: 1.4,

                });

                group.add(marbleMesh);

                const shadowGeo = new THREE.PlaneGeometry(BALL_RADIUS * 2.8, BALL_RADIUS * 2.8);
                const shadowCanvas = document.createElement('canvas');

                shadowCanvas.height = 128;

                grad.addColorStop(0, 'rgba(0, 0, 0, 0.7)');
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
                sCtx.fillStyle = grad;
                sCtx.fillRect(0, 0, 128, 128);
                const shadowTex = new THREE.CanvasTexture(shadowCanvas);
                const shadowMat = new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false });
                const contactShadow = new THREE.Mesh(shadowGeo, shadowMat);
                contactShadow.rotation.x = -Math.PI / 2;
                contactShadow.position.y = -BALL_RADIUS + 0.05;
                group.add(contactShadow);

                const glowGeo = new THREE.RingGeometry(BALL_RADIUS * 0.4, BALL_RADIUS * 1.5, 24);
                const glowMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.55 });
                const groundGlow = new THREE.Mesh(glowGeo, glowMat);

                const texture = new THREE.CanvasTexture(canvas);

                group.add(sprite);

                scene.add(group);

                const startProgress = Math.max(0, 0.005 - (index * 0.0006));
                const totalP = currentPlayers.length;
                // 단독 출전일 경우 중앙(0.0)에 정렬, 복수일 경우 고르게 분산
                const laneSpread = totalP === 1 ? 0 : (-7.0 + (index / (totalP - 1)) * 14.0);
                const personality = personalities[index % personalities.length];

                return {
                    id: player.id,
