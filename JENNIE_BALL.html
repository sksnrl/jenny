    <script>
        // --- 1. Web Audio API 엔진 (거리 감쇠 3D 사운드) ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        const SoundEngine = {
            // 카메라와 사운드 발생 위치 간 거리에 따른 볼륨 감쇠 계수 (0.0 ~ 1.0)
            getDistanceGain: function(worldPos, maxDist = 320) {
                if (!camera || !worldPos) return 1.0;
                const dist = camera.position.distanceTo(worldPos);
                const factor = THREE.MathUtils.clamp(1 - (dist - 15) / (maxDist - 15), 0, 1);
                return factor * factor; // 자연스러운 2차 곡선 감쇠
            },

            playMetallicHit: function(volume = 0.4, worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const distGain = this.getDistanceGain(worldPos, 260);
                    const finalVolume = volume * distGain;
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1400 + Math.random() * 800, now);
                    osc.frequency.exponentialRampToValueAtTime(120, now + 0.12);

                    gain.gain.setValueAtTime(finalVolume * 0.5, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } catch(e) {}
            },

            playBooster: function(worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const distGain = this.getDistanceGain(worldPos, 350);
                    const finalVolume = 0.35 * distGain;
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.35);

                    gain.gain.setValueAtTime(finalVolume, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.35);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } catch(e) {}
            },

            playWormhole: function(worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const distGain = this.getDistanceGain(worldPos, 400);
                    const finalVolume = 0.45 * distGain;
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(900, now);
                    osc.frequency.exponentialRampToValueAtTime(90, now + 0.45);

                    gain.gain.setValueAtTime(finalVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } catch(e) {}
            },

            playItemBox: function(worldPos = null) {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const distGain = this.getDistanceGain(worldPos, 300);
                    const finalVolume = 0.28 * distGain;
                    if (finalVolume <= 0.001) return;

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.08);
                    osc.frequency.setValueAtTime(783.99, now + 0.16);
                    osc.frequency.setValueAtTime(1046.50, now + 0.24);

                    gain.gain.setValueAtTime(finalVolume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } catch(e) {}
            }
        };

                ambient: 0x070114,
                fog: 0x0e0224,
                roadColor: 0x180d2b,
                glowColor: 0xec4899,
                jumpZones: [{ start: 0.45, end: 0.52, height: 40 }],

                    new THREE.Vector3(0, 80, -800),

                ]
            },
            chaos: {
                name: '카오스 디멘션 보텍스',
                desc: '분기길, 점프대, 1회용 웜홀, 핀볼 범퍼가 모두 총출동한 최종 결전장',
                ambient: 0x0d0317,

                    { start: 0.18, end: 0.25, height: 45 },

        };

        // --- 4. 엔진 상태 변수 ---
        let scene, camera, renderer;
        let racers = [];
        let trackSpline = null;
        let trackMeshes = [];
        let sceneryMeshes = [];
        let activeMapKey = 'roller';

        const SEGMENTS_COUNT = 750;
        let surfaceFrames = [];
        const BALL_RADIUS = 1.6;
        const ROAD_WIDTH = 28.0;

        let dynamicItems = [];
        let dynamicTraps = [];
        let activeWormhole = null;

        let raceStarted = false;
        let racePaused = false;
        let raceEnded = false;
        let raceTime = 0;
        let finishedCount = 0;

        let cameraMode = 'chase';
        let selectedTargetRacer = null;
        let particles = [];
        let screenShakeIntensity = 0;

        let isMouseDown = false;
        let mouseX = 0, mouseY = 0;
        let orbitAngleX = 0, orbitAngleY = Math.PI / 4, orbitRadius = 150;

        // --- 5. Three.js 초기화 ---
        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.5, 6000);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.95);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.4);
            dirLight.position.set(150, 350, 150);
            scene.add(dirLight);

            setupMouseControls();
            buildTrack(activeMapKey);
            createRacers();
            updateLeaderboardUI();

            window.addEventListener('resize', onWindowResize);
        }

        // --- 6. 서피스 프레임 계산 ---
        function computeRobustSurfaceFrames() {
            surfaceFrames = [];
            let prevNormal = new THREE.Vector3(0, 1, 0);

            for (let i = 0; i <= SEGMENTS_COUNT; i++) {
                const t = i / SEGMENTS_COUNT;
                const point = trackSpline.getPointAt(t);
                const tangent = trackSpline.getTangentAt(t).normalize();

                let binormal = new THREE.Vector3().crossVectors(tangent, prevNormal).normalize();
                if (binormal.lengthSq() < 0.001) {
                    binormal = new THREE.Vector3().crossVectors(tangent, new THREE.Vector3(0, 0, 1)).normalize();
                }

                let normal = new THREE.Vector3().crossVectors(binormal, tangent).normalize();
                if (normal.y < -0.3 && prevNormal.y > 0) {
                    normal.negate();
                    binormal.negate();
                }
                prevNormal = normal.clone();

                surfaceFrames.push({ point, tangent, normal, binormal });
            }
        }

        function getSurfaceOrientationAt(progress) {
            const safeT = Math.min(0.9999, Math.max(0.0001, progress));
            const floatIdx = safeT * SEGMENTS_COUNT;
            const idx1 = Math.floor(floatIdx);
            const idx2 = Math.min(SEGMENTS_COUNT, idx1 + 1);
            const alpha = floatIdx - idx1;

            const f1 = surfaceFrames[idx1];
            const f2 = surfaceFrames[idx2];

            const point = trackSpline.getPointAt(safeT);
            const tangent = trackSpline.getTangentAt(safeT).normalize();
            const normal = f1.normal.clone().lerp(f2.normal, alpha).normalize();
            const binormal = f1.binormal.clone().lerp(f2.binormal, alpha).normalize();

            return { point, tangent, normal, binormal };
        }

        // --- 7. 트랙 및 랜덤 프로시저럴 엔티티 생성 ---
        function buildTrack(mapKey) {
            trackMeshes.forEach(mesh => scene.remove(mesh));
            trackMeshes = [];
            sceneryMeshes.forEach(mesh => scene.remove(mesh));
            sceneryMeshes = [];
            
            clearEntities();

            const mapData = trackPresets[mapKey];
            scene.background = new THREE.Color(mapData.ambient);
            scene.fog = new THREE.FogExp2(mapData.fog, 0.002);

            trackSpline = new THREE.CatmullRomCurve3(mapData.points);
            trackSpline.closed = false;

            computeRobustSurfaceFrames();

            const vertices = [];
            const uvs = [];
            const indices = [];
            const leftEdgePts = [];
            const rightEdgePts = [];

            const isChasm = (t) => {
                if (!mapData.jumpZones) return false;
                return mapData.jumpZones.some(z => t > z.start + 0.015 && t < z.end - 0.015);
            };

            for (let i = 0; i <= SEGMENTS_COUNT; i++) {
                const t = i / SEGMENTS_COUNT;
                const { point, normal, binormal } = surfaceFrames[i];

                const leftPoint = point.clone().add(binormal.clone().multiplyScalar(-ROAD_WIDTH / 2));
                const rightPoint = point.clone().add(binormal.clone().multiplyScalar(ROAD_WIDTH / 2));

                leftEdgePts.push(leftPoint.clone().add(normal.clone().multiplyScalar(0.5)));
                rightEdgePts.push(rightPoint.clone().add(normal.clone().multiplyScalar(0.5)));

                vertices.push(leftPoint.x, leftPoint.y, leftPoint.z);
                vertices.push(rightPoint.x, rightPoint.y, rightPoint.z);

                uvs.push(0, t * 90);
                uvs.push(1, t * 90);

                if (i < SEGMENTS_COUNT) {
                    const nextT = (i + 1) / SEGMENTS_COUNT;
                    if (!isChasm(t) && !isChasm(nextT)) {
                        const base = i * 2;
                        indices.push(base, base + 1, base + 2);
                        indices.push(base + 1, base + 3, base + 2);
                    }
                }
            }

            const roadGeometry = new THREE.BufferGeometry();
            roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            roadGeometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            roadGeometry.setIndex(indices);
            roadGeometry.computeVertexNormals();

            const roadMaterial = new THREE.MeshStandardMaterial({
                color: mapData.roadColor,
                roughness: 0.35,
                metalness: 0.75,
                side: THREE.DoubleSide
            });

            const roadMesh = new THREE.Mesh(roadGeometry, roadMaterial);
            scene.add(roadMesh);
            trackMeshes.push(roadMesh);

            const railGeoL = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(leftEdgePts), SEGMENTS_COUNT, 0.45, 6, false);
            const railGeoR = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(rightEdgePts), SEGMENTS_COUNT, 0.45, 6, false);
            const railMat = new THREE.MeshBasicMaterial({ color: mapData.glowColor });

            const railL = new THREE.Mesh(railGeoL, railMat);
            const railR = new THREE.Mesh(railGeoR, railMat);
            scene.add(railL, railR);
            trackMeshes.push(railL, railR);

            createSurfaceGate(0, 0x00e5ff, 'START LINE');
            createSurfaceGate(1, 0xff0055, 'FINISH LINE');

            mapData.jumpZones.forEach(z => createSurfaceGate(z.start, 0xffeb3b, 'AIR JUMP'));
            if (mapData.forkZones) {
                mapData.forkZones.forEach(f => createSurfaceGate(f.start, 0xa855f7, 'FORK SPLIT'));
            }

            proceduralSpawnEntities();
            buildScenery(mapData.glowColor);
        }

        function createSurfaceGate(t, color, text) {
            const { point, tangent, normal, binormal } = getSurfaceOrientationAt(t);
            const group = new THREE.Group();

            const gateGeo = new THREE.TorusGeometry(16, 0.9, 8, 24, Math.PI);
            const gateMat = new THREE.MeshStandardMaterial({ color: color, emissive: color, emissiveIntensity: 0.9, roughness: 0.2 });
            const arch = new THREE.Mesh(gateGeo, gateMat);
            group.add(arch);

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 512, 128);
            ctx.strokeStyle = '#' + color.toString(16).padStart(6, '0');
            ctx.lineWidth = 8;
            ctx.strokeRect(4, 4, 504, 120);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 44px "Black Han Sans", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 64);

            const texture = new THREE.CanvasTexture(canvas);
            const bannerMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const bannerMesh = new THREE.Mesh(new THREE.PlaneGeometry(18, 4), bannerMat);
            bannerMesh.position.y = 8.5;
            group.add(bannerMesh);

            const rotMatrix = new THREE.Matrix4();
            rotMatrix.makeBasis(binormal, normal, tangent);
            group.quaternion.setFromRotationMatrix(rotMatrix);
            group.position.copy(point);

            scene.add(group);
            trackMeshes.push(group);
        }

        function clearEntities() {
            dynamicItems.forEach(i => scene.remove(i.mesh));
            dynamicItems = [];
            dynamicTraps.forEach(t => scene.remove(t.mesh));
            dynamicTraps = [];
            if (activeWormhole) {
                scene.remove(activeWormhole.mesh);
                activeWormhole = null;
            }
        }

        // --- 8. 무작위 다양성 배치 및 1회용 웜홀 ---
        function proceduralSpawnEntities() {
            clearEntities();

            const itemBoxGeo = new THREE.BoxGeometry(2.8, 2.8, 2.8);
            const itemBoxMat = new THREE.MeshPhysicalMaterial({
                color: 0xffea00, metalness: 0.2, roughness: 0.1, transmission: 0.5,
                transparent: true, opacity: 0.95, emissive: 0xffaa00, emissiveIntensity: 0.8
            });
            const ringGeo = new THREE.TorusGeometry(2.4, 0.15, 8, 24);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0xff00ff });

            const itemCount = 6 + Math.floor(Math.random() * 3);
            for (let i = 0; i < itemCount; i++) {
                const t = 0.08 + (i / itemCount) * 0.82 + (Math.random() - 0.5) * 0.04;
                [-7.0, 0, 7.0].forEach(offset => {
                    const group = new THREE.Group();
                    group.add(new THREE.Mesh(itemBoxGeo, itemBoxMat.clone()));
                    group.add(new THREE.Mesh(ringGeo, ringMat));
                    scene.add(group);

                    dynamicItems.push({
                        mesh: group,
                        progress: t,
                        laneOffset: offset,
                        active: true,
                        respawnTimer: 0
                    });
                });
            }

            const trapCount = 14 + Math.floor(Math.random() * 6);
            const bananaGeo = new THREE.TorusGeometry(1.4, 0.6, 8, 16, Math.PI);
            const bananaMat = new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0xffaa00, emissiveIntensity: 0.5 });
            const boostGeo = new THREE.BoxGeometry(6.5, 0.3, 4.5);
            const boostMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8 });
            const bumperGeo = new THREE.CylinderGeometry(2.5, 3.2, 2.5, 16);
            const bumperMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.8 });

            for (let i = 0; i < trapCount; i++) {
                const t = 0.06 + Math.random() * 0.88;
                const rndType = Math.random();
                let type = 'boost';
                let mesh = null;

                if (rndType < 0.40) {
                    type = 'boost';
                    mesh = new THREE.Mesh(boostGeo, boostMat);
                } else if (rndType < 0.75) {
                    type = 'banana';
                    mesh = new THREE.Mesh(bananaGeo, bananaMat);
                } else {
                    type = 'bumper';
                    mesh = new THREE.Mesh(bumperGeo, bumperMat);
                }

                scene.add(mesh);
                dynamicTraps.push({
                    mesh: mesh,
                    type: type,
                    progress: t,
                    laneOffset: (Math.random() - 0.5) * (ROAD_WIDTH - 6),
                    active: true
                });
            }

            spawnSingleUseWormhole();
            alignAllEntities();
        }

        function spawnSingleUseWormhole() {
            if (activeWormhole) scene.remove(activeWormhole.mesh);

            const enterProgress = 0.52 + Math.random() * 0.22;
            const rewindDistance = 0.08 + Math.random() * 0.06;

            const group = new THREE.Group();
            const ringGeo = new THREE.TorusGeometry(8.5, 1.2, 16, 32);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x9333ea, wireframe: true });
            group.add(new THREE.Mesh(ringGeo, ringMat));

            const coreGeo = new THREE.CircleGeometry(7.5, 24);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x3b0764, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
            group.add(new THREE.Mesh(coreGeo, coreMat));

            scene.add(group);

            activeWormhole = {
                mesh: group,
                enter: enterProgress,
                rewindTo: Math.max(0.04, enterProgress - rewindDistance),
                active: true,
                respawnCooldown: 0
            };
        }

        function alignAllEntities() {
            if (!trackSpline || surfaceFrames.length === 0) return;

            dynamicItems.forEach(item => {
                const { point, normal, binormal } = getSurfaceOrientationAt(item.progress);
                item.mesh.position.copy(point)
                    .add(binormal.clone().multiplyScalar(item.laneOffset))
                    .add(normal.clone().multiplyScalar(3.0));
            });

            dynamicTraps.forEach(trap => {
                const { point, tangent, normal, binormal } = getSurfaceOrientationAt(trap.progress);
                const rotMatrix = new THREE.Matrix4();
                rotMatrix.makeBasis(binormal, normal, tangent);
                trap.mesh.quaternion.setFromRotationMatrix(rotMatrix);
                trap.mesh.position.copy(point)
                    .add(binormal.clone().multiplyScalar(trap.laneOffset))
                    .add(normal.clone().multiplyScalar(trap.type === 'bumper' ? 1.25 : 0.7));
            });

            if (activeWormhole && activeWormhole.active) {
                const { point, tangent, normal, binormal } = getSurfaceOrientationAt(activeWormhole.enter);
                const rotMatrix = new THREE.Matrix4();
                rotMatrix.makeBasis(binormal, normal, tangent);
                activeWormhole.mesh.quaternion.setFromRotationMatrix(rotMatrix);
                activeWormhole.mesh.position.copy(point).add(normal.clone().multiplyScalar(7.5));
            }
        }

        function buildScenery(glowColor) {
            const boxGeo = new THREE.BoxGeometry(1, 1, 1);
            for (let i = 0; i < 45; i++) {
                const h = 70 + Math.random() * 140;
                const w = 25 + Math.random() * 35;
                const mat = new THREE.MeshStandardMaterial({
                    color: 0x080816,
                    emissive: (i % 3 === 0) ? glowColor : 0x0a0a24,
                    emissiveIntensity: 0.35
                });
                const bldg = new THREE.Mesh(boxGeo, mat);
                const angle = Math.random() * Math.PI * 2;
                const dist = 240 + Math.random() * 360;
                bldg.scale.set(w, h, w);
                bldg.position.set(Math.cos(angle) * dist, h / 2 - 50, Math.sin(angle) * dist);
                scene.add(bldg);
                sceneryMeshes.push(bldg);
            }

            const gridHelper = new THREE.GridHelper(2200, 60, glowColor, 0x111126);
            gridHelper.position.y = -60;
            scene.add(gridHelper);
            sceneryMeshes.push(gridHelper);
        }

        // --- 9. 레이서 생성 ---
        function createRacers() {
            racers.forEach(r => scene.remove(r.mesh));
            racers = [];

            racers = currentPlayers.map((player, index) => {
                const group = new THREE.Group();
                const colorHex = parseInt(player.color.replace('#', '0x'));

                const marbleMesh = new THREE.Group();

                const sphereGeo = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
                const chromeMat = new THREE.MeshStandardMaterial({
                    color: 0xeeeeee, metalness: 0.95, roughness: 0.08,
                    emissive: colorHex, emissiveIntensity: 0.25
                });
                marbleMesh.add(new THREE.Mesh(sphereGeo, chromeMat));

                const ringGeo = new THREE.TorusGeometry(BALL_RADIUS * 1.005, 0.06, 8, 32);
                const ringMat = new THREE.MeshBasicMaterial({ color: colorHex });
                const equatorRing1 = new THREE.Mesh(ringGeo, ringMat);
                const equatorRing2 = new THREE.Mesh(ringGeo, ringMat);
                equatorRing2.rotation.x = Math.PI / 2;
                marbleMesh.add(equatorRing1, equatorRing2);

                group.add(marbleMesh);

                const glowGeo = new THREE.RingGeometry(BALL_RADIUS * 0.4, BALL_RADIUS * 1.5, 24);
                const glowMat = new THREE.MeshBasicMaterial({ color: colorHex, side: THREE.DoubleSide, transparent: true, opacity: 0.65 });
                const groundGlow = new THREE.Mesh(glowGeo, glowMat);
                groundGlow.rotation.x = Math.PI / 2;
                groundGlow.position.y = -BALL_RADIUS + 0.1;
                group.add(groundGlow);

                const shieldGeo = new THREE.SphereGeometry(BALL_RADIUS * 1.45, 24, 24);
                const shieldMat = new THREE.MeshBasicMaterial({ color: 0x00e5ff, wireframe: true, transparent: true, opacity: 0 });
                const shieldMesh = new THREE.Mesh(shieldGeo, shieldMat);
                group.add(shieldMesh);

                const beaconGeo = new THREE.CylinderGeometry(0.12, 0.12, 18, 8);
                const beaconMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.5 });
                const beacon = new THREE.Mesh(beaconGeo, beaconMat);
                beacon.position.y = 9.5;
                group.add(beacon);

                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 180;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.roundRect(10, 10, 492, 160, 30);
                ctx.fill();
                ctx.lineWidth = 10;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#000000';
                ctx.font = '800 110px "Black Han Sans", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(player.name, 256, 90);

                const texture = new THREE.CanvasTexture(canvas);
                const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(6.4, 2.6, 1);
                sprite.position.set(0, 5.2, 0);
                group.add(sprite);

                scene.add(group);

                const startProgress = Math.max(0, 0.005 - (index * 0.0006));
                const laneSpread = currentPlayers.length === 1 ? 0 : ((index % 5) - 2) * 4.6;

                return {
                    id: player.id,
                    name: player.name,
                    color: colorHex,
                    colorStr: player.color,
                    desc: player.desc || '질주하는 슈퍼 마블!',
                    mesh: group,
                    marbleMesh: marbleMesh,
                    shieldMesh: shieldMesh,
                    beacon: beacon,
                    progress: startProgress,
                    laneOffset: laneSpread,
                    targetLaneOffset: laneSpread,
                    preferredFork: index % 2 === 0 ? 'left' : 'right',
                    laneChangeSpeed: 0.035 + Math.random() * 0.03,
                    baseSpeed: 0.00050,
                    speedMultiplier: 1.0,
                    velocityOffset: 0,
                    rollAngle: 0,
                    currentItem: null,
                    spinAngle: 0,
                    spinTimer: 0,
                    hasShield: false,
                    shieldTimer: 0,
                    bumperInvulTimer: 0, // 범퍼 연속 충돌 방지용 무적 타이머
                    isAirborne: false,
                    finished: false,
                    finishTime: 0,
                    rank: index + 1
                };
            });

            selectedTargetRacer = racers[0];
            alignRacersToTrack();
        }

        // --- 10. 물리 시뮬레이션 및 충돌 / 1회용 웜홀 소멸 로직 ---
        function updatePhysicsAndItems() {
            const mapData = trackPresets[activeMapKey];

            const ranked = [...racers].sort((a, b) => b.progress - a.progress);
            ranked.forEach((r, idx) => {
                r.rank = idx + 1;
                r.beacon.material.opacity = (r.rank === 1 || r.id === selectedTargetRacer?.id) ? 0.85 : 0.25;
            });

            dynamicItems.forEach(item => {
                if (item.active) {
                    item.mesh.rotation.y += 0.04;
                    item.mesh.children[1].rotation.x += 0.03;
                } else {
                    item.respawnTimer -= 0.016;
                    if (item.respawnTimer <= 0) {
                        item.active = true;
                        item.mesh.visible = true;
                    }
                }
            });

            if (activeWormhole) {
                if (activeWormhole.active) {
                    activeWormhole.mesh.rotation.z += 0.05;
                } else {
                    activeWormhole.respawnCooldown -= 0.016;
                    if (activeWormhole.respawnCooldown <= 0) {
                        spawnSingleUseWormhole();
                        alignAllEntities();
                    }
                }
            }

            racers.forEach(r => {
                if (r.finished) return;

                // 범퍼 무적 타이머 감소
                if (r.bumperInvulTimer > 0) {
                    r.bumperInvulTimer -= 0.016;
                }

                let rubberbandFactor = 1.0;
                if (racers.length > 1) {
                    if (r.rank >= 5) rubberbandFactor = 1.38;
                    else if (r.rank >= 3) rubberbandFactor = 1.18;
                    else if (r.rank === 1) rubberbandFactor = 0.95;
                }

                if (r.spinTimer > 0) {
                    r.spinTimer -= 0.016;
                    r.spinAngle += 0.35;
                    r.speedMultiplier = 0.35;
                } else {
                    r.spinAngle = 0;
                    r.speedMultiplier += (1.0 - r.speedMultiplier) * 0.03;
                }

                if (r.hasShield) {
                    r.shieldTimer -= 0.016;
                    r.shieldMesh.material.opacity = 0.6;
                    r.shieldMesh.rotation.y += 0.05;
                    if (r.shieldTimer <= 0) {
                        r.hasShield = false;
                        r.shieldMesh.material.opacity = 0;
                    }
                }

                let inFork = false;
                if (mapData.forkZones) {
                    mapData.forkZones.forEach(fork => {
                        if (r.progress >= fork.start && r.progress <= fork.end) {
                            inFork = true;
                            r.targetLaneOffset = r.preferredFork === 'left' ? fork.leftShift : fork.rightShift;
                        }
                    });
                }

                if (!inFork && Math.random() < 0.018) {
                    r.targetLaneOffset = (Math.random() - 0.5) * (ROAD_WIDTH - 6);
                }

                const laneDiff = (r.targetLaneOffset - r.laneOffset);
                r.laneOffset += laneDiff * r.laneChangeSpeed + r.velocityOffset;
                r.velocityOffset *= 0.88;

                const currentMoveSpeed = r.baseSpeed * rubberbandFactor * r.speedMultiplier;
                r.progress += currentMoveSpeed;

                const forwardDistance = currentMoveSpeed * 1200.0;
                r.rollAngle += forwardDistance / BALL_RADIUS;

                if (r.speedMultiplier > 1.3 && Math.random() < 0.35) {
                    createSparks(r.mesh.position, r.color);
                }

                if (activeWormhole && activeWormhole.active) {
                    if (Math.abs(r.progress - activeWormhole.enter) < 0.004) {
                        r.progress = activeWormhole.rewindTo;
                        r.spinTimer = 1.0;
                        r.speedMultiplier = 0.4;
                        SoundEngine.playWormhole(r.mesh.position);
                        createSparks(r.mesh.position, 0x9333ea);
                        screenShakeIntensity = 0.85;

                        activeWormhole.active = false;
                        activeWormhole.mesh.visible = false;
                        activeWormhole.respawnCooldown = 12.0;

                        showCinematicSubtitle(`🌀 [${r.name}] 웜홀에 흡수되어 뒤로 워프! (웜홀 소멸됨)`);
                    }
                }

                dynamicItems.forEach(item => {
                    if (item.active && Math.abs(r.progress - item.progress) < 0.0035 && Math.abs(r.laneOffset - item.laneOffset) < 3.8) {
                        item.active = false;
                        item.mesh.visible = false;
                        item.respawnTimer = 4.0;
                        SoundEngine.playItemBox(r.mesh.position);
                        triggerRandomItem(r);
                    }
                });

                dynamicTraps.forEach(trap => {
                    if (trap.active && Math.abs(r.progress - trap.progress) < 0.0035 && Math.abs(r.laneOffset - trap.laneOffset) < 3.4) {
                        if (trap.type === 'banana') {
                            if (r.hasShield) {
                                r.hasShield = false;
                                r.shieldMesh.material.opacity = 0;
                                showCinematicSubtitle(`🛡️ [${r.name}] 쉴드로 바나나 방어!`);
                            } else {
                                r.spinTimer = 1.2;
                                createSparks(r.mesh.position, 0xffea00);
                                showCinematicSubtitle(`🍌 [${r.name}] 바나나 밟고 미끄러짐!`);
                                if (r.id === selectedTargetRacer?.id) screenShakeIntensity = 0.6;
                            }
                        } else if (trap.type === 'boost') {
                            r.speedMultiplier = 2.2;
                            SoundEngine.playBooster(r.mesh.position);
                            createSparks(r.mesh.position, 0x00ffcc);
                            showCinematicSubtitle(`⚡ [${r.name}] 부스터 패드 폭풍 가속!`);
                        } else if (trap.type === 'bumper') {
                            // 무적 시간 중이면 충돌 무시 (무한 루프 방지)
                            if (r.bumperInvulTimer > 0) return;

                            // 1. 역행 폭을 적절히 축소하여 과도한 뒤쪽 워프 방지
                            r.progress = Math.max(0.005, r.progress - 0.018);

                            // 2. 범퍼 위치를 기준으로 확실히 바깥쪽 차선으로 강제 튕김
                            const pushDir = r.laneOffset >= trap.laneOffset ? 1 : -1;
                            r.laneOffset += pushDir * 6.5; 
                            r.targetLaneOffset = THREE.MathUtils.clamp(r.laneOffset + pushDir * 5.0, -(ROAD_WIDTH / 2 - 2), (ROAD_WIDTH / 2 - 2));
                            r.velocityOffset = pushDir * 5.5;

                            // 3. 1.8초간 동일 범퍼 및 인근 범퍼 판정 무적화
                            r.bumperInvulTimer = 1.8;
                            r.spinTimer = 0.7;
                            r.speedMultiplier = 0.5;

                            SoundEngine.playMetallicHit(0.8, r.mesh.position);
                            createSparks(r.mesh.position, 0xff0055);
                            showCinematicSubtitle(`💥 [${r.name}] 핀볼 범퍼에 강타당해 튕겨나감!`);
                            screenShakeIntensity = 0.7;
                        }
                    }
                });

                if (r.progress >= 1.0) {
                    r.progress = 1.0;
                    r.finished = true;
                    r.finishTime = raceTime;
                    finishedCount++;

                    createSparks(r.mesh.position, 0xffffff);
                    showCinematicSubtitle(`🏁 [${r.name}] 결승선 통과! (${finishedCount}위)`);

                    if (finishedCount === 1) screenShakeIntensity = 0.8;
                    if (finishedCount >= racers.length) finishRace();
                }
            });

            if (racers.length > 1) {
                handleMarbleCollisions();
            }
        }

        function handleMarbleCollisions() {
            const collisionDist = BALL_RADIUS * 2.1;

            for (let i = 0; i < racers.length; i++) {
                for (let j = i + 1; j < racers.length; j++) {
                    const r1 = racers[i];
                    const r2 = racers[j];
                    if (r1.finished || r2.finished) continue;

                    const pos1 = r1.mesh.position;
                    const pos2 = r2.mesh.position;
                    const dist = pos1.distanceTo(pos2);

                    if (dist < collisionDist) {
                        const overlap = collisionDist - dist;
                        const laneDelta = r1.laneOffset - r2.laneOffset;
                        const pushDir = laneDelta >= 0 ? 1 : -1;

                        r1.velocityOffset += pushDir * (overlap * 0.45);
                        r2.velocityOffset -= pushDir * (overlap * 0.45);

                        if (r1.progress > r2.progress) {
                            r1.speedMultiplier = Math.min(2.0, r1.speedMultiplier + 0.35);
                            r2.speedMultiplier = Math.max(0.4, r2.speedMultiplier - 0.25);
                        } else {
                            r2.speedMultiplier = Math.min(2.0, r2.speedMultiplier + 0.35);
                            r1.speedMultiplier = Math.max(0.4, r1.speedMultiplier - 0.25);
                        }

                        const midPos = pos1.clone().add(pos2).multiplyScalar(0.5);
                        SoundEngine.playMetallicHit(0.35, midPos);
                        createSparks(midPos, 0xffffff);

                        if (Math.random() < 0.2) {
                            showCinematicSubtitle(`💥 [${r1.name}]와 [${r2.name}] 격렬한 몸싸움!`);
                        }
                    }
                }
            }
        }

        function triggerRandomItem(racer) {
            const isBackMarker = racers.length > 1 && racer.rank >= 3;
            const items = isBackMarker ? 
                ['booster', 'thunder', 'magnet', 'booster', 'shield'] : 
                ['shield', 'banana', 'booster', 'banana'];

            const chosen = items[Math.floor(Math.random() * items.length)];

            if (chosen === 'booster') {
                racer.currentItem = '🚀';
                racer.speedMultiplier = 2.6;
                SoundEngine.playBooster(racer.mesh.position);
                createSparks(racer.mesh.position, 0xff4500);
                showCinematicSubtitle(`🚀 [${racer.name}] 로켓 부스터 점화!`);
            } else if (chosen === 'thunder') {
                racer.currentItem = '⚡';
                const leaders = racers.filter(r => r.rank <= 2 && r.id !== racer.id && !r.finished);
                if (leaders.length > 0) {
                    leaders.forEach(target => {
                        if (target.hasShield) {
                            target.hasShield = false;
                            target.shieldMesh.material.opacity = 0;
                            showCinematicSubtitle(`🛡 [${target.name}] 쉴드로 번개 방어!`);
                        } else {
                            target.spinTimer = 1.4;
                            createSparks(target.mesh.position, 0x00ffff);
                            showCinematicSubtitle(`⚡ [${racer.name}]의 번개 저격! [${target.name}] 감전!`);
                        }
                    });
                    screenShakeIntensity = 0.8;
                } else {
                    racer.speedMultiplier = 1.8;
                    showCinematicSubtitle(`⚡ [${racer.name}] 번개 오버차지 충전!`);
                }
            } else if (chosen === 'magnet') {
                racer.currentItem = '🧲';
                const frontRacer = racers.find(r => r.rank === racer.rank - 1);
                if (frontRacer) {
                    racer.progress = Math.min(frontRacer.progress - 0.005, racer.progress + 0.035);
                    racer.speedMultiplier = 1.8;
                    createSparks(racer.mesh.position, 0xff00ff);
                    showCinematicSubtitle(`🧲 [${racer.name}] 자석 흡착! [${frontRacer.name}] 뒤로 급속 흡입!`);
                } else {
                    racer.speedMultiplier = 1.9;
                    showCinematicSubtitle(`🧲 [${racer.name}] 자력 가속 추진!`);
                }
            } else if (chosen === 'shield') {
                racer.currentItem = '🛡️';
                racer.hasShield = true;
                racer.shieldTimer = 5.0;
                showCinematicSubtitle(`🛡️ [${racer.name}] 황금 쉴드 전개!`);
            } else if (chosen === 'banana') {
                racer.currentItem = '🍌';
                const bananaGeo = new THREE.TorusGeometry(1.4, 0.6, 8, 16, Math.PI);
                const bananaMat = new THREE.MeshStandardMaterial({ color: 0xffea00, emissive: 0xffaa00, emissiveIntensity: 0.5 });
                const mesh = new THREE.Mesh(bananaGeo, bananaMat);
                scene.add(mesh);
                dynamicTraps.push({
                    mesh: mesh,
                    type: 'banana',
                    progress: Math.max(0, racer.progress - 0.01),
                    laneOffset: racer.laneOffset,
                    active: true
                });
                alignAllEntities();
                showCinematicSubtitle(`🍌 [${racer.name}] 트랙에 바나나 투척!`);
            }

            setTimeout(() => { racer.currentItem = null; }, 3500);
        }

        // --- 11. 레이서 서피스 접지 정렬 ---
        function alignRacersToTrack() {
            if (!trackSpline || surfaceFrames.length === 0) return;

            const mapData = trackPresets[activeMapKey];
            const jumpZones = mapData.jumpZones || [];

            racers.forEach(r => {
                const { point, tangent, normal, binormal } = getSurfaceOrientationAt(r.progress);

                let jumpYOffset = 0;
                const safeProgress = Math.min(0.999, Math.max(0.0001, r.progress));
                const activeJump = jumpZones.find(z => safeProgress >= z.start && safeProgress <= z.end);

                if (activeJump) {
                    r.isAirborne = true;
                    const jumpNorm = (safeProgress - activeJump.start) / (activeJump.end - activeJump.start);
                    jumpYOffset = Math.sin(jumpNorm * Math.PI) * activeJump.height;
                } else {
                    if (r.isAirborne) {
                        r.isAirborne = false;
                        SoundEngine.playMetallicHit(0.5, r.mesh.position);
                        createSparks(r.mesh.position, 0x00e5ff);
                    }
                }

                r.mesh.position.copy(point)
                    .add(binormal.clone().multiplyScalar(r.laneOffset))
                    .add(normal.clone().multiplyScalar(BALL_RADIUS + jumpYOffset));

                const rotMatrix = new THREE.Matrix4();
                rotMatrix.makeBasis(binormal, normal, tangent);
                r.mesh.quaternion.setFromRotationMatrix(rotMatrix);

                r.marbleMesh.rotation.x = r.rollAngle;

                if (r.spinAngle > 0) {
                    const spinQuat = new THREE.Quaternion();
                    spinQuat.setFromAxisAngle(normal, r.spinAngle);
                    r.mesh.quaternion.premultiply(spinQuat);
                }
            });
        }

        // --- 12. 세로형 롱 서킷 미니맵 레이더 ---
        function drawMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            if (!canvas || !trackSpline) return;
            const ctx = canvas.getContext('2d');

            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const points = trackSpline.getPoints(160);

            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.z < minZ) minZ = p.z;
                if (p.z > maxZ) maxZ = p.z;
            });

            const pad = 14;
            const rangeX = (maxX - minX) || 1;
            const rangeZ = (maxZ - minZ) || 1;

            const mapX = (x) => pad + ((x - minX) / rangeX) * (canvas.width - pad * 2);
            const mapY = (z) => pad + ((z - minZ) / rangeZ) * (canvas.height - pad * 2);

            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
            ctx.beginPath();
            points.forEach((p, idx) => {
                if (idx === 0) ctx.moveTo(mapX(p.x), mapY(p.z));
                else ctx.lineTo(mapX(p.x), mapY(p.z));
            });
            ctx.stroke();

            if (activeWormhole && activeWormhole.active) {
                const pt = trackSpline.getPointAt(activeWormhole.enter);
                ctx.fillStyle = '#9333ea';
                ctx.beginPath();
                ctx.arc(mapX(pt.x), mapY(pt.z), 5, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.fillStyle = '#00e5ff';
            ctx.beginPath(); ctx.arc(mapX(points[0].x), mapY(points[0].z), 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff0055';
            ctx.beginPath(); ctx.arc(mapX(points[points.length - 1].x), mapY(points[points.length - 1].z), 4, 0, Math.PI * 2); ctx.fill();

            racers.forEach(r => {
                const pos = r.mesh.position;
                const rx = mapX(pos.x);
                const ry = mapY(pos.z);

                ctx.fillStyle = r.colorStr || '#' + r.color.toString(16).padStart(6, '0');
                ctx.beginPath();
                ctx.arc(rx, ry, r.id === selectedTargetRacer?.id ? 6.0 : 3.8, 0, Math.PI * 2);
                ctx.fill();

                if (r.id === selectedTargetRacer?.id || r.rank === 1) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            });
        }

        // --- 13. 레이스 제어 흐름 ---
        function startRace() {
            if (raceStarted && !raceEnded) return;

            getAudioContext();

            raceStarted = true;
            racePaused = false;
            raceEnded = false;
            raceTime = 0;
            finishedCount = 0;

            setControlsLocked(true);

            racers.forEach(r => {
                r.finished = false;
                r.finishTime = 0;
                r.isAirborne = false;
                r.speedMultiplier = 1.0;
                r.rollAngle = 0;
                r.spinTimer = 0;
                r.hasShield = false;
                r.bumperInvulTimer = 0;
                r.currentItem = null;
                r.velocityOffset = 0;
            });

            document.getElementById('race-status-badge').textContent = 'RACING';
            document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-rose-500/20 text-rose-400 rounded font-mono font-bold animate-pulse';

            const btn = document.getElementById('btn-start');
            btn.innerHTML = '<i class="fa-solid fa-flag-checkered animate-bounce"></i><span>진행 중</span>';
            btn.classList.replace('from-pink-600', 'from-emerald-600');
            btn.classList.replace('to-rose-600', 'to-teal-600');

            document.getElementById('btn-pause').disabled = false;
            updatePauseButtonUI();

            showCinematicSubtitle(`🏁 [${trackPresets[activeMapKey].name}] 레이스 스타트!`);
        }

        function togglePauseRace() {
            if (!raceStarted || raceEnded) return;

            racePaused = !racePaused;
            updatePauseButtonUI();

            if (racePaused) {
                document.getElementById('race-status-badge').textContent = 'PAUSED';
                document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-yellow-500/20 text-yellow-300 rounded font-mono font-bold';
                showCinematicSubtitle("⏸️ 레이스가 일시 중지되었습니다.");
            } else {
                document.getElementById('race-status-badge').textContent = 'RACING';
                document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-rose-500/20 text-rose-400 rounded font-mono font-bold animate-pulse';
                showCinematicSubtitle("▶ 레이스를 재개합니다!");
            }
        }

        function updatePauseButtonUI() {
            const pauseIcon = document.getElementById('pause-icon');
            const pauseText = document.getElementById('pause-text');
            if (racePaused) {
                pauseIcon.className = 'fa-solid fa-play';
                pauseText.textContent = '계속';
            } else {
                pauseIcon.className = 'fa-solid fa-pause';
                pauseText.textContent = '일시중지';
            }
        }

        function finishRace() {
            raceEnded = true;
            racePaused = false;
            setControlsLocked(false);
            document.getElementById('btn-pause').disabled = true;

            document.getElementById('race-status-badge').textContent = 'FINISH';
            document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-yellow-500/20 text-yellow-300 rounded font-mono font-bold';

            const sorted = [...racers].sort((a, b) => a.finishTime - b.finishTime);
            showCinematicSubtitle(`🏆 1위 [${sorted[0].name}] 결승선 통과! 최종 챔피언!`);

            openResultModal(sorted);
        }

        function resetRace() {
            raceStarted = false;
            racePaused = false;
            raceEnded = false;
            raceTime = 0;
            finishedCount = 0;

            setControlsLocked(false);

            const modal = document.getElementById('result-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 400);

            const btn = document.getElementById('btn-start');
            btn.innerHTML = '<i class="fa-solid fa-play"></i><span>레이스 스타트</span>';
            btn.classList.replace('from-emerald-600', 'from-pink-600');
            btn.classList.replace('to-teal-600', 'to-rose-600');

            const btnPause = document.getElementById('btn-pause');
            btnPause.disabled = true;
            updatePauseButtonUI();

            document.getElementById('race-status-badge').textContent = 'READY';
            document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-cyan-500/20 text-cyan-300 rounded font-mono font-bold';

            racers.forEach((r, index) => {
                r.progress = Math.max(0, 0.005 - (index * 0.0006));
                r.laneOffset = currentPlayers.length === 1 ? 0 : ((index % 5) - 2) * 4.6;
                r.targetLaneOffset = r.laneOffset;
                r.speedMultiplier = 1.0;
                r.rollAngle = 0;
                r.spinTimer = 0;
                r.hasShield = false;
                r.bumperInvulTimer = 0;
                r.finished = false;
                r.finishTime = 0;
                r.currentItem = null;
                r.velocityOffset = 0;
            });

            proceduralSpawnEntities();

            selectedTargetRacer = racers[0];
            alignRacersToTrack();
            updateLeaderboardUI();
            showCinematicSubtitle("🏁 서킷 준비 완료. [레이스 스타트]를 눌러주세요.");
        }

        function setControlsLocked(locked) {
            document.getElementById('map-select').disabled = locked;
            document.getElementById('btn-player-modal').disabled = locked;
        }

        function onSelectMap(mapKey) {
            if (raceStarted && !raceEnded) return;
            activeMapKey = mapKey;
            buildTrack(mapKey);
            resetRace();
            showCinematicSubtitle(`🗺️ 트랙 로딩 완료: [${trackPresets[mapKey].name}]`);
        }

        // --- 14. 엔트리 설정 모달 ---
        function openPlayerModal() {
            if (raceStarted && !raceEnded) return;
            renderPlayerEditList();
            const modal = document.getElementById('player-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 20);
        }

        function closePlayerModal() {
            const modal = document.getElementById('player-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function renderPlayerEditList() {
            const listEl = document.getElementById('player-edit-list');
            listEl.innerHTML = currentPlayers.map((p, idx) => `
                <div class="flex items-center gap-2 p-2 bg-white/5 rounded-xl border border-white/5">
                    <span class="text-xs font-mono text-white/50 w-6 text-center">${idx + 1}</span>
                    <input type="color" value="${p.color}" onchange="updatePlayerColor(${idx}, this.value)" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0 outline-none">
                    <input type="text" value="${p.name}" oninput="updatePlayerName(${idx}, this.value)" class="flex-1 bg-white/10 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none focus:border-purple-500 font-bold">
                    <button onclick="removePlayerSlot(${idx})" class="text-white/40 hover:text-rose-400 p-1.5 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }

        function updatePlayerName(idx, val) { currentPlayers[idx].name = val; }
        function updatePlayerColor(idx, val) { currentPlayers[idx].color = val; }

        function removePlayerSlot(idx) {
            if (currentPlayers.length <= 1) {
                alert("최소 1명 이상의 참가자가 필요합니다.");
                return;
            }
            currentPlayers.splice(idx, 1);
            renderPlayerEditList();
        }

        function addNewPlayerSlot() {
            if (currentPlayers.length >= 16) {
                alert("최대 16명까지 참가할 수 있습니다.");
                return;
            }
            const colors = ['#00e5ff', '#ff007f', '#ffd700', '#00ff66', '#a855f7', '#ff6600', '#38bdf8'];
            currentPlayers.push({
                id: 'p' + (Date.now() % 10000),
                name: `구슬 ${currentPlayers.length + 1}`,
                color: colors[Math.floor(Math.random() * colors.length)],
                desc: '질주하는 크롬 마블!'
            });
            renderPlayerEditList();
        }

        function applyBulkPlayers() {
            const input = document.getElementById('bulk-player-input').value.trim();
            if (!input) return;
            const names = input.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (names.length === 0) return;

            const palette = ['#ff2d75', '#00e5ff', '#ffd700', '#38bdf8', '#ef4444', '#00ff66', '#a855f7', '#ff6600'];
            currentPlayers = names.slice(0, 16).map((name, i) => ({
                id: 'p' + (i + 1),
                name: name,
                color: palette[i % palette.length],
                desc: '질주하는 슈퍼 마블!'
            }));

            document.getElementById('bulk-player-input').value = '';
            renderPlayerEditList();
        }

        function resetDefaultPlayers() {
            currentPlayers = [
                { id: 'p1', name: 'JENNIE', color: '#ff2d75', desc: '빛나는 황금빛 크롬 스틸볼!' }
            ];
            renderPlayerEditList();
        }

        function saveAndApplyPlayers() {
            closePlayerModal();
            createRacers();
            resetRace();
            showCinematicSubtitle("✨ 참가 구슬 엔트리 설정 완료!");
        }

        // --- 15. 리더보드 & 모달 UI ---
        function updateLeaderboardUI() {
            const listEl = document.getElementById('leaderboard-list');
            if (!listEl) return;

            const sorted = [...racers].sort((a, b) => {
                if (a.finished && b.finished) return a.finishTime - b.finishTime;
                if (a.finished) return -1;
                if (b.finished) return 1;
                return b.progress - a.progress;
            });

            listEl.innerHTML = sorted.map((r, i) => `
                <div onclick="selectRacer('${r.id}')" class="flex items-center justify-between p-1.5 rounded-lg bg-white/5 hover:bg-white/10 cursor-pointer transition-all border ${selectedTargetRacer?.id === r.id ? 'border-pink-500 bg-pink-500/10' : 'border-transparent'}">
                    <div class="flex items-center space-x-2">
                        <span class="w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-black ${i === 0 ? 'bg-yellow-400 text-black' : i === 1 ? 'bg-slate-300 text-black' : i === 2 ? 'bg-amber-600 text-white' : 'bg-white/10 text-white'}">
                            ${i + 1}
                        </span>
                        <span class="font-bold text-[12px] tracking-wide" style="color: ${r.colorStr}">${r.name}</span>
                        ${r.currentItem ? `<span class="text-xs animate-bounce">${r.currentItem}</span>` : ''}
                    </div>
                    <span class="text-[10px] font-mono ${r.finished ? 'text-green-400 font-bold' : (r.spinTimer > 0 ? 'text-red-400 font-bold animate-pulse' : (r.speedMultiplier > 1.5 ? 'text-yellow-300 font-bold' : 'text-white/60'))}">
                        ${r.finished ? 'GOAL!' : (r.spinTimer > 0 ? 'SPIN!' : (r.speedMultiplier > 1.5 ? 'BOOST!' : Math.floor(r.progress * 100) + '%'))}
                    </span>
                </div>
            `).join('');
        }

        function openResultModal(sorted) {
            const modal = document.getElementById('result-modal');
            const podiumEl = document.getElementById('podium-container');
            const rankingListEl = document.getElementById('modal-ranking-list');
            const winner = sorted[0];

            document.getElementById('winner-tagline').textContent = `🏆 최종 챔피언: [${winner.name}] - "${winner.desc}"`;

            const p1 = sorted[0], p2 = sorted[1], p3 = sorted[2];
            podiumEl.innerHTML = `
                ${p2 ? `
                <div class="flex flex-col items-center flex-1">
                    <span class="text-xs font-bold truncate max-w-[80px]" style="color: ${p2.colorStr}">${p2.name}</span>
                    <div class="w-full bg-slate-300/20 border-t-2 border-slate-300 h-16 rounded-t-xl flex items-center justify-center font-black text-slate-300 text-lg">2</div>
                </div>` : ''}
                <div class="flex flex-col items-center flex-1 -mt-4">
                    <i class="fa-solid fa-crown text-yellow-400 text-lg mb-1 animate-bounce"></i>
                    <span class="text-sm font-black truncate max-w-[90px]" style="color: ${p1.colorStr}">${p1.name}</span>
                    <div class="w-full bg-yellow-500/30 border-t-4 border-yellow-400 h-24 rounded-t-xl flex items-center justify-center font-black text-yellow-400 text-2xl shadow-lg">1</div>
                </div>
                ${p3 ? `
                <div class="flex flex-col items-center flex-1">
                    <span class="text-xs font-bold truncate max-w-[80px]" style="color: ${p3.colorStr}">${p3.name}</span>
                    <div class="w-full bg-amber-700/20 border-t-2 border-amber-600 h-12 rounded-t-xl flex items-center justify-center font-black text-amber-500 text-base">3</div>
                </div>` : ''}
            `;

            rankingListEl.innerHTML = sorted.slice(3).map((r, idx) => `
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-white/5 border border-white/5">
                    <div class="flex items-center space-x-2">
                        <span class="font-mono text-white/50 text-[11px]">${idx + 4}위</span>
                        <span class="font-bold text-xs" style="color: ${r.colorStr}">${r.name}</span>
                    </div>
                    <span class="text-white/40 text-[10px] font-mono">${r.finishTime.toFixed(2)}s</span>
                </div>
            `).join('');

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 20);
        }

        function selectRacer(id) {
            const found = racers.find(r => r.id === id);
            if (found) {
                selectedTargetRacer = found;
                showCinematicSubtitle(`집중 타깃: [${found.name}]`);
                updateLeaderboardUI();
            }
        }

        function setCameraMode(mode) {
            cameraMode = mode;
            ['chase', 'action', 'drone', 'orbit'].forEach(m => {
                const btn = document.getElementById(`cam-${m}`);
                if (btn) {
                    btn.className = m === mode ? 
                        "px-3 py-1.5 bg-pink-600 rounded-xl text-xs font-bold text-white shadow-lg shadow-pink-600/50 flex items-center space-x-2" : 
                        "px-3 py-1.5 bg-white/10 hover:bg-pink-600 rounded-xl text-xs font-bold transition-all flex items-center space-x-2";
                }
            });
            showCinematicSubtitle(`카메라 앵글: ${mode.toUpperCase()}`);
        }

        function showCinematicSubtitle(text) {
            const subEl = document.getElementById('cinematic-subtitle');
            if (!subEl) return;
            subEl.querySelector('span').textContent = text;
            subEl.style.opacity = '1';
            subEl.style.transform = 'translateY(0)';

            clearTimeout(subEl._timeout);
            subEl._timeout = setTimeout(() => {
                subEl.style.opacity = '0';
                subEl.style.transform = 'translateY(16px)';
            }, 2600);
        }

        function createSparks(pos, colorHex) {
            const count = 16;
            const geom = new THREE.BufferGeometry();
            const positions = [];
            const velocities = [];

            for (let i = 0; i < count; i++) {
                positions.push(pos.x, pos.y, pos.z);
                velocities.push(
                    (Math.random() - 0.5) * 2.2,
                    Math.random() * 1.6 + 0.4,
                    (Math.random() - 0.5) * 2.2
                );
            }

            geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const mat = new THREE.PointsMaterial({
                color: colorHex, size: 0.8, transparent: true, opacity: 1.0, blending: THREE.AdditiveBlending
            });

            const pSystem = new THREE.Points(geom, mat);
            scene.add(pSystem);
            particles.push({ system: pSystem, velocities: velocities, life: 25 });
        }

        function setupMouseControls() {
            const container = document.getElementById('canvas-container');
            
            container.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                mouseX = e.clientX;
                mouseY = e.clientY;

                orbitAngleX -= deltaX * 0.008;
                orbitAngleY = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, orbitAngleY + deltaY * 0.008));
            });

            window.addEventListener('mouseup', () => { isMouseDown = false; });
            
            container.addEventListener('wheel', (e) => {
                orbitRadius = Math.max(15, Math.min(450, orbitRadius + e.deltaY * 0.08));
            });
        }

        // --- 16. 메인 애니메이션 렌더 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            if (raceStarted && !racePaused && !raceEnded && trackSpline) {
                raceTime += 0.016;
                updatePhysicsAndItems();
                alignRacersToTrack();

                if (Math.floor(raceTime * 10) % 8 === 0) {
                    updateLeaderboardUI();
                }
            }

            for (let idx = particles.length - 1; idx >= 0; idx--) {
                const p = particles[idx];
                const posArr = p.system.geometry.attributes.position.array;
                for (let i = 0; i < p.velocities.length / 3; i++) {
                    posArr[i * 3] += p.velocities[i * 3];
                    posArr[i * 3 + 1] += p.velocities[i * 3 + 1];
                    posArr[i * 3 + 2] += p.velocities[i * 3 + 2];
                    p.velocities[i * 3 + 1] -= 0.04;
                }
                p.system.geometry.attributes.position.needsUpdate = true;
                p.system.material.opacity -= 0.04;
                p.life--;
                if (p.life <= 0) {
                    scene.remove(p.system);
                    particles.splice(idx, 1);
                }
            }

            if (selectedTargetRacer && trackSpline) {
                const targetPos = selectedTargetRacer.mesh.position;
                const { tangent, normal, binormal } = getSurfaceOrientationAt(selectedTargetRacer.progress);

                let desiredCameraPos = new THREE.Vector3();

                if (cameraMode === 'chase') {
                    const baseOffset = tangent.clone().multiplyScalar(-orbitRadius * 0.15)
                        .add(normal.clone().multiplyScalar(orbitRadius * 0.06));
                    
                    const rotatedOffset = baseOffset.clone()
                        .add(binormal.clone().multiplyScalar(Math.sin(orbitAngleX) * (orbitRadius * 0.2)))
                        .add(normal.clone().multiplyScalar((orbitAngleY - Math.PI / 4) * (orbitRadius * 0.25)));

                    desiredCameraPos.copy(targetPos).add(rotatedOffset);
                    camera.position.lerp(desiredCameraPos, 0.12);
                    camera.lookAt(targetPos.clone().add(normal.clone().multiplyScalar(1.5)));

                } else if (cameraMode === 'action') {
                    const baseOffset = binormal.clone().multiplyScalar(Math.cos(orbitAngleX) * (orbitRadius * 0.15))
                        .add(tangent.clone().multiplyScalar(Math.sin(orbitAngleX) * (orbitRadius * 0.15)))
                        .add(normal.clone().multiplyScalar(Math.sin(orbitAngleY) * (orbitRadius * 0.12)));

                    desiredCameraPos.copy(targetPos).add(baseOffset);
                    camera.position.lerp(desiredCameraPos, 0.12);
                    camera.lookAt(targetPos);

                } else if (cameraMode === 'drone') {
                    const droneHeight = Math.sin(orbitAngleY) * (orbitRadius * 0.8) + 20;
                    const droneDist = Math.cos(orbitAngleY) * (orbitRadius * 0.8);
                    
                    desiredCameraPos.copy(targetPos)
                        .add(new THREE.Vector3(Math.sin(orbitAngleX) * droneDist, droneHeight, Math.cos(orbitAngleX) * droneDist));

                    camera.position.lerp(desiredCameraPos, 0.09);
                    camera.lookAt(targetPos);

                } else if (cameraMode === 'orbit') {
                    const cx = targetPos.x + Math.sin(orbitAngleX) * Math.cos(orbitAngleY) * orbitRadius;
                    const cz = targetPos.z + Math.cos(orbitAngleX) * Math.cos(orbitAngleY) * orbitRadius;
                    const cy = targetPos.y + Math.sin(orbitAngleY) * orbitRadius;
                    camera.position.set(cx, cy, cz);
                    camera.lookAt(targetPos);
                }
            }

            if (screenShakeIntensity > 0) {
                camera.position.x += (Math.random() - 0.5) * screenShakeIntensity;
                camera.position.y += (Math.random() - 0.5) * screenShakeIntensity;
                screenShakeIntensity *= 0.9;
            }

            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }

            drawMinimap();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function() {
            // 스페이스바 단축키 이벤트 리스너
            window.addEventListener('keydown', (e) => {
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) {
                    return;
                }

                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    if (raceEnded) return;

                    if (!raceStarted) {
                        startRace();
                    } else {
                        togglePauseRace();
                    }
                }
            });

            initThree();
            animate();
            showCinematicSubtitle("🎬 JENNIE 볼 준비 완료! [레이스 스타트] 또는 [Space]를 눌러주세요.");
        };
    </script>
</body>
