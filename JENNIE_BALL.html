                    coreMesh: coreMesh,
                    gyro1: gyro1,
                    gyro2: gyro2,
                    shieldMesh: shieldMesh,
                    beacon: beacon,
                    progress: startProgress,
                    laneOffset: laneSpread,
                    targetLaneOffset: laneSpread,
                    aiPersonality: personality,
                    aiDecisionTimer: Math.random() * 0.4,
                    preferredFork: index % 2 === 0 ? 'left' : 'right',
                    laneChangeSpeed: 0.055 + Math.random() * 0.025,
                    baseSpeed: 0.00045,
                    currentVelocity: 0.00045,
                    speedMultiplier: 1.0,
                    velocityOffset: 0,
                    marbleQuaternion: new THREE.Quaternion(),
                    scaleStretch: new THREE.Vector3(1, 1, 1),
                    currentItem: null,
                    spinAngle: 0,
                    spinTimer: 0,
                    hasShield: false,
                    shieldTimer: 0,
                    bumperInvulTimer: 0,
                    airLaunchHeight: 0,
                    airLaunchVelocity: 0,
                    flipperCooldown: 0,
                    isAirborne: false,
                    finished: false,
                    finishTime: 0,
                    rank: index + 1
                };
            });

            selectedTargetRacer = racers[0];
            alignRacersToTrack();
        }

        // --- 12. 물리 및 AI 업데이트 ---
        function updatePhysicsAndItems(deltaTime) {
            const mapData = trackPresets[activeMapKey];
            const timeScale = deltaTime / 0.016;

            const ranked = [...racers].sort((a, b) => b.progress - a.progress);
            ranked.forEach((r, idx) => {
                r.rank = idx + 1;
                r.beacon.material.opacity = (r.rank === 1 || r.id === selectedTargetRacer?.id) ? 0.85 : 0.25;
            });

            dynamicFlippers.forEach(f => {
                f.swingPhase += 0.08 * timeScale;
                const prevAngle = f.currentAngle;
                const rawSin = Math.sin(f.swingPhase);
                let curve = rawSin > 0 ? Math.pow(rawSin, 1.8) : -Math.pow(-rawSin, 1.8) * 0.4;
                const maxSwing = (Math.PI / 360) * 360;
                f.currentAngle = (f.side === 'left' ? 1 : -1) * (curve * maxSwing);
                f.paddlePivot.rotation.y = f.currentAngle;
                f.angularVelocity = (f.currentAngle - prevAngle) * (f.side === 'left' ? 1 : -1);
            });

            dynamicSpinners.forEach(s => {
                s.bladeMesh.rotation.y += s.rotationSpeed * timeScale;
            });

            dynamicItems.forEach(item => {
                if (item.active) {
                    item.group.rotation.y += 0.035 * timeScale;
                    item.group.position.y += Math.sin(raceTime * 3 + item.laneOffset) * 0.008;
                } else {
                    item.respawnTimer -= deltaTime;
                    if (item.respawnTimer <= 0) {
                        item.active = true;
                        item.group.visible = true;
                    }
                }
            });

            activeWormholes.forEach(w => {
                if (w.active) {
                    w.mesh.rotation.z += 0.05 * timeScale;
                } else {
                    w.respawnCooldown -= deltaTime;
                    if (w.respawnCooldown <= 0) {
                        w.active = true;
                        w.mesh.visible = true;
                    }
                }
            });

            racers.forEach(r => {
                if (r.finished) return;

                if (r.bumperInvulTimer > 0) r.bumperInvulTimer -= deltaTime;
                if (r.flipperCooldown > 0) r.flipperCooldown -= deltaTime;

                r.coreMesh.rotation.y += 0.05 * timeScale;
                r.gyro1.rotation.x += 0.04 * timeScale;
                r.gyro2.rotation.y += 0.04 * timeScale;

                r.scaleStretch.lerp(new THREE.Vector3(1, 1, 1), 0.1 * timeScale);
                r.marbleMesh.scale.copy(r.scaleStretch);

                if (r.airLaunchHeight > 0 || r.airLaunchVelocity > 0) {
                    r.airLaunchHeight += r.airLaunchVelocity * timeScale;
                    r.airLaunchVelocity -= 1.6 * timeScale;
                    if (r.airLaunchHeight <= 0) {
                        r.airLaunchHeight = 0;
                        r.airLaunchVelocity = 0;
                        r.scaleStretch.set(1.3, 0.7, 1.3);
                        SoundEngine.playMetallicHit(0.6, r.mesh.position);
                    }
                }

                let separationForce = 0;
                racers.forEach(other => {
                    if (other.id !== r.id && !other.finished) {
                        const dProg = other.progress - r.progress;
                        if (Math.abs(dProg) < 0.012) {
                            const distLane = r.laneOffset - other.laneOffset;
                            if (Math.abs(distLane) < 4.0) {
                                const sign = distLane >= 0 ? 1 : -1;
                                separationForce += sign * (4.0 - Math.abs(distLane)) * 0.15;
                            }
                        }
                    }
                });

                r.aiDecisionTimer -= deltaTime;
                if (r.aiDecisionTimer <= 0) {
                    r.aiDecisionTimer = 0.5 + Math.random() * 0.4;

                    let nearestDanger = null;
                    dynamicTraps.forEach(trap => {
                        if (trap.active && trap.type !== 'boost') {
                            const dProg = trap.progress - r.progress;
                            if (dProg > 0 && dProg < 0.04 && Math.abs(trap.laneOffset - r.laneOffset) < 3.8) {
                                nearestDanger = trap;
                            }
                        }
                    });

                    let bestItem = null;
                    let minItemDist = Infinity;
                    if (!nearestDanger && Math.random() < r.aiPersonality.itemGreed) {
                        dynamicItems.forEach(item => {
                            if (item.active) {
                                const dProg = item.progress - r.progress;
                                if (dProg > 0.005 && dProg < 0.05) {
                                    const dist = Math.hypot(dProg * 1000, item.laneOffset - r.laneOffset);
                                    if (dist < minItemDist) {
                                        minItemDist = dist;
                                        bestItem = item;
                                    }
                                }
                            }
                        });
                    }

                    if (nearestDanger) {
                        const avoidDir = nearestDanger.laneOffset >= r.laneOffset ? -1 : 1;
                        r.targetLaneOffset = THREE.MathUtils.clamp(r.laneOffset + avoidDir * 6.5, -9.0, 9.0);
                    } else if (bestItem) {
                        r.targetLaneOffset = bestItem.laneOffset;
                    } else {
                        const basePref = r.aiPersonality.baseLanePreference;
                        const span = r.aiPersonality.wanderSpan;
                        const target = basePref + (Math.random() - 0.5) * 2 * span;
                        r.targetLaneOffset = THREE.MathUtils.clamp(target, -8.5, 8.5);
                    }
                }

                let rubberbandFactor = 1.0;
                if (racers.length > 1) {
                    if (r.rank >= 5) rubberbandFactor = 1.35;
                    else if (r.rank >= 3) rubberbandFactor = 1.15;
                    else if (r.rank === 1) rubberbandFactor = 0.96;
                }

                if (r.spinTimer > 0) {
                    r.spinTimer -= deltaTime;
                    r.spinAngle += 0.35 * timeScale;
                    r.speedMultiplier = 0.35;
                } else {
                    r.spinAngle = 0;
                    r.speedMultiplier += (1.0 - r.speedMultiplier) * 0.03 * timeScale;
                }

                if (r.hasShield) {
                    r.shieldTimer -= deltaTime;
                    r.shieldMesh.material.opacity = 0.6;
                    r.shieldMesh.rotation.y += 0.05 * timeScale;
                    if (r.shieldTimer <= 0) {
                        r.hasShield = false;
                        r.shieldMesh.material.opacity = 0;
                    }
                }

                let inFork = false;
                if (mapData.forkZones) {
                    mapData.forkZones.forEach(fork => {
                        if (r.progress >= fork.start && r.progress <= fork.end) {
                            inFork = true;
                            r.targetLaneOffset = r.preferredFork === 'left' ? fork.leftShift : fork.rightShift;
                        }
                    });
                }

                const dtCurv = 0.005;
                const tPrev = Math.max(0, r.progress - dtCurv);
                const tNext = Math.min(1, r.progress + dtCurv);
                const tanP = trackSpline.getTangentAt(tPrev).normalize();
                const tanN = trackSpline.getTangentAt(tNext).normalize();
                const dTan = new THREE.Vector3().subVectors(tanN, tanP);
                const { binormal, normal, tangent } = getSurfaceOrientationAt(r.progress);
                const lateralCurv = dTan.dot(binormal);
                
                const fMult = mapData.frictionMult || 1.0;
                const centrifugalForce = -lateralCurv * (r.currentVelocity * 350.0) * (2.0 - fMult);
                r.velocityOffset += centrifugalForce * timeScale;

                const centeringGravity = - (r.laneOffset / (ROAD_WIDTH / 2)) * 0.18;
                let wallRepelForce = 0;
                const safeWallMargin = 9.5;
                if (Math.abs(r.laneOffset) > safeWallMargin) {
                    const excess = Math.abs(r.laneOffset) - safeWallMargin;
                    wallRepelForce = -Math.sign(r.laneOffset) * excess * 0.45;
                }

                const laneDiff = (r.targetLaneOffset - r.laneOffset);
                r.laneOffset += (laneDiff * r.laneChangeSpeed * timeScale) + 
                                (r.velocityOffset * timeScale) + 
                                (separationForce * timeScale) +
                                (centeringGravity * timeScale) +
                                (wallRepelForce * timeScale);
                
                r.velocityOffset *= Math.pow(0.90 * fMult, timeScale);

                const maxLane = ROAD_WIDTH / 2 - 2.2;
                if (Math.abs(r.laneOffset) > maxLane) {
                    r.laneOffset = Math.sign(r.laneOffset) * maxLane;
                    r.velocityOffset *= -0.3;
                }

                const gravityDot = tangent.dot(new THREE.Vector3(0, -1, 0));
                const gravityAccel = gravityDot * 0.00035;

                r.currentVelocity = THREE.MathUtils.clamp(
                    r.baseSpeed * rubberbandFactor * r.speedMultiplier + gravityAccel,
                    0.00015,
                    0.0022
                );

                r.progress += r.currentVelocity * timeScale;

                const forwardDelta = r.currentVelocity * 1400.0 * timeScale;
                const rotAxis = new THREE.Vector3().crossVectors(normal, tangent).normalize();
                const rotAngle = forwardDelta / BALL_RADIUS;

                const deltaQuat = new THREE.Quaternion().setFromAxisAngle(rotAxis, rotAngle);
                r.marbleQuaternion.premultiply(deltaQuat);
                r.marbleMesh.quaternion.copy(r.marbleQuaternion);

                dynamicFlippers.forEach(f => {
                    if (r.flipperCooldown > 0) return;

                    const TRACK_METERS = 2200.0;
                    const dz = (r.progress - f.progress) * TRACK_METERS;
                    const dx = r.laneOffset - f.baseLane;

                    const FLIPPER_LEN = 11.5;
                    const isLeft = f.side === 'left';
                    const sideDir = isLeft ? 1 : -1;
                    const tipX = sideDir * FLIPPER_LEN * Math.cos(f.currentAngle);
                    const tipZ = FLIPPER_LEN * Math.sin(f.currentAngle);

                    const segLenSq = tipX * tipX + tipZ * tipZ;
                    const t = THREE.MathUtils.clamp((dx * tipX + dz * tipZ) / segLenSq, 0, 1);
                    
                    const closestX = t * tipX;
                    const closestZ = t * tipZ;
                    const distX = dx - closestX;
                    const distZ = dz - closestZ;
                    const distSq = distX * distX + distZ * distZ;
                    const hitRadius = BALL_RADIUS + 1.2;

                    if (distSq < hitRadius * hitRadius) {
                        let normX = -tipZ;
                        let normZ = tipX;
                        const normLen = Math.hypot(normX, normZ) || 1;
                        normX /= normLen;
                        normZ /= normLen;
                        if (normZ < 0) { normX = -normX; normZ = -normZ; }

                        const isUpSwinging = f.angularVelocity > 0;
                        const tipLeverage = 0.4 + 1.8 * Math.pow(t, 1.4);
                        const swingBoost = isUpSwinging ? 1.6 : 0.6;
                        const finalForce = tipLeverage * swingBoost;

                        r.velocityOffset = normX * (6.0 * finalForce);
                        r.targetLaneOffset = THREE.MathUtils.clamp(
                            r.laneOffset + normX * (10.0 * finalForce), 
                            -(ROAD_WIDTH / 2 - 2), 
                            (ROAD_WIDTH / 2 - 2)
                        );

                        r.speedMultiplier = Math.min(3.2, 1.2 + normZ * (1.8 * finalForce));
                        r.progress += (normZ * 0.008 * finalForce);
                        r.airLaunchVelocity = 12.0 + 22.0 * finalForce;
                        r.flipperCooldown = 1.4;
                        r.scaleStretch.set(0.7, 1.4, 0.7);

                        if (t > 0.65 && isUpSwinging) {
                            SoundEngine.playFlipperLaunch(r.mesh.position);
                            showCinematicSubtitle(`🔥 [${r.name}] 플리퍼 끝자락 스위트스팟 정타! (x${finalForce.toFixed(1)})`);
                            screenShakeIntensity = 0.8;
                        } else {
                            SoundEngine.playMetallicHit(0.7, r.mesh.position);
                            showCinematicSubtitle(`⚡ [${r.name}] 플리퍼 몸체에 빗맞음!`);
                            screenShakeIntensity = 0.3;
                        }
                    }
                });

                dynamicSpinners.forEach(s => {
                    if (Math.abs(r.progress - s.progress) < 0.004) {
                        if (Math.abs(r.laneOffset) < 5.0) {
                            r.spinTimer = 1.0;
                            r.speedMultiplier = 0.45;
                            const pushSign = r.laneOffset >= 0 ? 1 : -1;
                            r.velocityOffset += pushSign * 8.0;
                            SoundEngine.playMetallicHit(0.75, r.mesh.position);
                            showCinematicSubtitle(`🌀 [${r.name}] 회전 스피너 블레이드에 강타!`);
                        }
                    }
                });

                activeWormholes.forEach(w => {
                    if (w.active && Math.abs(r.progress - w.enter) < 0.004) {
                        r.progress = w.rewindTo;
                        r.spinTimer = 1.0;
                        r.speedMultiplier = 0.4;
                        SoundEngine.playWormhole(r.mesh.position);
                        screenShakeIntensity = 0.8;

                        w.active = false;
                        w.mesh.visible = false;
                        w.respawnCooldown = 12.0;
                        showCinematicSubtitle(`🌀 [${r.name}] 차원 웜홀에 흡수되어 워프!`);
                    }
                });

                dynamicItems.forEach(item => {
                    if (item.active && Math.abs(r.progress - item.progress) < 0.0035 && Math.abs(r.laneOffset - item.laneOffset) < 3.8) {
                        item.active = false;
                        item.group.visible = false;
                        item.respawnTimer = 4.0;
                        SoundEngine.playItemBox(r.mesh.position);
                        triggerHoloItem(r, item.type);
                    }
                });

                dynamicTraps.forEach(trap => {
                    if (trap.active && Math.abs(r.progress - trap.progress) < 0.0035 && Math.abs(r.laneOffset - trap.laneOffset) < 3.4) {
                        if (trap.type === 'banana') {
                            if (r.hasShield) {
                                r.hasShield = false;
                                r.shieldMesh.material.opacity = 0;
                                showCinematicSubtitle(`🛡️ [${r.name}] 쉴드로 바나나 방어!`);
                            } else {
                                r.spinTimer = 1.2;
                                showCinematicSubtitle(`🍌 [${r.name}] 바나나 밟고 미끄러짐!`);
                                if (r.id === selectedTargetRacer?.id) screenShakeIntensity = 0.5;
                            }
                        } else if (trap.type === 'boost') {
                            r.speedMultiplier = 2.2;
                            r.scaleStretch.set(0.8, 0.8, 1.4);
                            SoundEngine.playBooster(r.mesh.position);
                            showCinematicSubtitle(`⚡ [${r.name}] 부스터 패드 폭풍 가속!`);
                        } else if (trap.type === 'bumper') {
                            if (r.bumperInvulTimer > 0) return;

                            r.progress = Math.max(0.005, r.progress - 0.018);
                            const pushDir = r.laneOffset >= trap.laneOffset ? 1 : -1;
                            r.laneOffset += pushDir * 6.5; 
                            r.targetLaneOffset = THREE.MathUtils.clamp(r.laneOffset + pushDir * 5.0, -(ROAD_WIDTH / 2 - 2), (ROAD_WIDTH / 2 - 2));
                            r.velocityOffset = pushDir * 5.5;

                            r.bumperInvulTimer = 1.8;
                            r.spinTimer = 0.7;
                            r.speedMultiplier = 0.5;
                            r.scaleStretch.set(1.4, 0.7, 1.4);

                            SoundEngine.playMetallicHit(0.8, r.mesh.position);
                            showCinematicSubtitle(`💥 [${r.name}] 핀볼 범퍼에 강타당해 튕겨나감!`);
                            screenShakeIntensity = 0.6;
                        }
                    }
                });

                if (r.progress >= 1.0) {
                    r.progress = 1.0;
                    r.finished = true;
                    r.finishTime = raceTime;
                    finishedCount++;

                    showCinematicSubtitle(`🏁 [${r.name}] 결승선 통과! (${finishedCount}위)`);
                    if (finishedCount === 1) screenShakeIntensity = 0.8;
                    if (finishedCount >= racers.length) finishRace();
                }
            });

            if (racers.length > 1) {
                handleMarbleCollisions(timeScale);
            }
        }

        function handleMarbleCollisions(timeScale) {
            const collisionDist = BALL_RADIUS * 2.1;

            for (let i = 0; i < racers.length; i++) {
                for (let j = i + 1; j < racers.length; j++) {
                    const r1 = racers[i];
                    const r2 = racers[j];
                    if (r1.finished || r2.finished) continue;

                    const pos1 = r1.mesh.position;
                    const pos2 = r2.mesh.position;
                    const dist = pos1.distanceTo(pos2);

                    if (dist < collisionDist) {
                        const overlap = collisionDist - dist;
                        const laneDelta = r1.laneOffset - r2.laneOffset;
                        const pushDir = laneDelta >= 0 ? 1 : -1;

                        r1.velocityOffset += pushDir * (overlap * 0.4) * timeScale;
                        r2.velocityOffset -= pushDir * (overlap * 0.4) * timeScale;

                        if (r1.progress > r2.progress) {
                            r1.speedMultiplier = Math.min(2.0, r1.speedMultiplier + 0.35);
                            r2.speedMultiplier = Math.max(0.4, r2.speedMultiplier - 0.25);
                        } else {
                            r2.speedMultiplier = Math.min(2.0, r2.speedMultiplier + 0.35);
                            r1.speedMultiplier = Math.max(0.4, r1.speedMultiplier - 0.25);
                        }

                        const midPos = pos1.clone().add(pos2).multiplyScalar(0.5);
                        SoundEngine.playMetallicHit(0.35, midPos);

                        if (Math.random() < 0.15 * timeScale) {
                            showCinematicSubtitle(`💥 [${r1.name}]와 [${r2.name}] 격렬한 몸싸움!`);
                        }
                    }
                }
            }
        }

        function triggerHoloItem(racer, itemType) {
            if (itemType === 'booster') {
                racer.currentItem = '🚀';
                racer.speedMultiplier = 2.6;
                SoundEngine.playBooster(racer.mesh.position);
                showCinematicSubtitle(`🚀 [${racer.name}] 로켓 부스터 점화!`);
            } else if (itemType === 'thunder') {
                racer.currentItem = '⚡';
                const leaders = racers.filter(r => r.rank <= 2 && r.id !== racer.id && !r.finished);
                if (leaders.length > 0) {
                    leaders.forEach(target => {
                        if (target.hasShield) {
                            target.hasShield = false;
                            target.shieldMesh.material.opacity = 0;
                            showCinematicSubtitle(`🛡 [${target.name}] 쉴드로 번개 방어!`);
                        } else {
                            target.spinTimer = 1.4;
                            showCinematicSubtitle(`⚡ [${racer.name}]의 번개 저격! [${target.name}] 감전!`);
                        }
                    });
                    screenShakeIntensity = 0.7;
                } else {
                    racer.speedMultiplier = 1.8;
                    showCinematicSubtitle(`⚡ [${racer.name}] 번개 오버차지 충전!`);
                }
            } else if (itemType === 'magnet') {
                racer.currentItem = '🧲';
                const frontRacer = racers.find(r => r.rank === racer.rank - 1);
                if (frontRacer) {
                    racer.progress = Math.min(frontRacer.progress - 0.005, racer.progress + 0.035);
                    racer.speedMultiplier = 1.8;
                    showCinematicSubtitle(`🧲 [${racer.name}] 자석 흡착! [${frontRacer.name}] 뒤로 급속 흡입!`);
                } else {
                    racer.speedMultiplier = 1.9;
                    showCinematicSubtitle(`🧲 [${racer.name}] 자력 가속 추진!`);
                }
            } else if (itemType === 'shield') {
                racer.currentItem = '🛡️';
                racer.hasShield = true;
                racer.shieldTimer = 5.0;
                showCinematicSubtitle(`🛡️ [${racer.name}] 황금 쉴드 전개!`);
            }

            setTimeout(() => { racer.currentItem = null; }, 3500);
        }

        // --- 13. 레이서 위치 정렬 ---
        function alignRacersToTrack() {
            if (!trackSpline || surfaceFrames.length === 0) return;

            const mapData = trackPresets[activeMapKey];
            const jumpZones = mapData.jumpZones || [];

            racers.forEach(r => {
                const { point, tangent, normal, binormal } = getSurfaceOrientationAt(r.progress);

                let trackJumpY = 0;
                const safeProgress = THREE.MathUtils.clamp(r.progress, 0.0001, 0.999);
                const activeJump = jumpZones.find(z => safeProgress >= z.start && safeProgress <= z.end);

                if (activeJump) {
                    r.isAirborne = true;
                    const jumpNorm = (safeProgress - activeJump.start) / (activeJump.end - activeJump.start);
                    trackJumpY = Math.sin(jumpNorm * Math.PI) * activeJump.height;
                } else {
                    if (r.isAirborne && r.airLaunchHeight === 0) {
                        r.isAirborne = false;
                        SoundEngine.playMetallicHit(0.5, r.mesh.position);
                    }
                }

                const sagHeight = getTrackSagHeight(r.laneOffset);
                const totalY = BALL_RADIUS + sagHeight + trackJumpY + r.airLaunchHeight;

                r.mesh.position.copy(point)
                    .add(binormal.clone().multiplyScalar(r.laneOffset))
                    .add(normal.clone().multiplyScalar(totalY));

                const rotMatrix = new THREE.Matrix4();
                rotMatrix.makeBasis(binormal, normal, tangent.clone().negate());
                r.mesh.quaternion.setFromRotationMatrix(rotMatrix);

                if (r.spinAngle > 0) {
                    const spinQuat = new THREE.Quaternion().setFromAxisAngle(normal, r.spinAngle);
                    r.mesh.quaternion.premultiply(spinQuat);
                }
            });
        }

        // --- 14. 전방향 2D 톱다운 텔레메트리 레이더 ---
        function drawMinimap() {
            const canvas = document.getElementById('minimap-canvas');
            if (!canvas || !trackSpline) return;
            const ctx = canvas.getContext('2d');

            if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
                canvas.width = canvas.clientWidth;
                canvas.height = canvas.clientHeight;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const points = trackSpline.getPoints(200);

            let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
            points.forEach(p => {
                if (p.x < minX) minX = p.x;
                if (p.x > maxX) maxX = p.x;
                if (p.z < minZ) minZ = p.z;
                if (p.z > maxZ) maxZ = p.z;
            });

            const pad = 16;
            const rangeX = (maxX - minX) || 1;
            const rangeZ = (maxZ - minZ) || 1;
            
            const maxRange = Math.max(rangeX, rangeZ);
            const scale = (Math.min(canvas.width, canvas.height) - pad * 2) / maxRange;
            const offsetX = (canvas.width - rangeX * scale) / 2;
            const offsetY = (canvas.height - rangeZ * scale) / 2;

            const mapX = (x) => offsetX + (x - minX) * scale;
            const mapY = (z) => offsetY + (z - minZ) * scale;

            ctx.lineWidth = 4.0;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = 'rgba(0, 229, 255, 0.45)';
            ctx.beginPath();
            points.forEach((p, idx) => {
                if (idx === 0) ctx.moveTo(mapX(p.x), mapY(p.z));
                else ctx.lineTo(mapX(p.x), mapY(p.z));
            });
            ctx.stroke();

            dynamicFlippers.forEach(f => {
                const pt = trackSpline.getPointAt(f.progress);
                ctx.fillStyle = f.side === 'left' ? '#ff007f' : '#00e5ff';
                ctx.fillRect(mapX(pt.x) - 3.5, mapY(pt.z) - 3.5, 7, 7);
            });

            activeWormholes.forEach(w => {
                if (w.active) {
                    const pt = trackSpline.getPointAt(w.enter);
                    ctx.fillStyle = '#9333ea';
                    ctx.beginPath();
                    ctx.arc(mapX(pt.x), mapY(pt.z), 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.fillStyle = '#00e5ff';
            ctx.beginPath(); ctx.arc(mapX(points[0].x), mapY(points[0].z), 4, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff0055';
            ctx.beginPath(); ctx.arc(mapX(points[points.length - 1].x), mapY(points[points.length - 1].z), 4, 0, Math.PI * 2); ctx.fill();

            racers.forEach(r => {
                const pos = r.mesh.position;
                const rx = mapX(pos.x);
                const ry = mapY(pos.z);

                ctx.fillStyle = r.colorStr || '#' + r.color.toString(16).padStart(6, '0');
                ctx.beginPath();
                ctx.arc(rx, ry, r.id === selectedTargetRacer?.id ? 5.5 : 3.5, 0, Math.PI * 2);
                ctx.fill();

                if (r.id === selectedTargetRacer?.id || r.rank === 1) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }
            });
        }

        // --- 15. 레이스 제어 흐름 ---
        function startRace() {
            if (raceStarted && !raceEnded) return;
            getAudioContext();

            raceStarted = true;
            racePaused = false;
            raceEnded = false;
            raceTime = 0;
            finishedCount = 0;
            clock.start();

            setControlsLocked(true);

            racers.forEach(r => {
                r.finished = false;
                r.finishTime = 0;
                r.isAirborne = false;
                r.speedMultiplier = 1.0;
                r.currentVelocity = r.baseSpeed;
                r.spinTimer = 0;
                r.hasShield = false;
                r.bumperInvulTimer = 0;
                r.airLaunchHeight = 0;
                r.airLaunchVelocity = 0;
                r.flipperCooldown = 0;
                r.currentItem = null;
                r.velocityOffset = 0;
            });

            document.getElementById('race-status-badge').textContent = 'RACING';
            document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-rose-500/20 text-rose-400 rounded font-mono font-bold animate-pulse';

            const btn = document.getElementById('btn-start');
            btn.innerHTML = '<i class="fa-solid fa-flag-checkered animate-bounce"></i><span>진행 중</span>';
            btn.classList.replace('from-pink-600', 'from-emerald-600');
            btn.classList.replace('to-rose-600', 'to-teal-600');

            document.getElementById('btn-pause').disabled = false;
            updatePauseButtonUI();

            showCinematicSubtitle(`🏁 [${trackPresets[activeMapKey].name}] 레이스 스타트!`);
        }

        function togglePauseRace() {
            if (!raceStarted || raceEnded) return;
            racePaused = !racePaused;
            updatePauseButtonUI();

            if (racePaused) {
                document.getElementById('race-status-badge').textContent = 'PAUSED';
                document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-yellow-500/20 text-yellow-300 rounded font-mono font-bold';
                showCinematicSubtitle("⏸️ 레이스가 일시 중지되었습니다.");
            } else {
                clock.getDelta();
                document.getElementById('race-status-badge').textContent = 'RACING';
                document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-rose-500/20 text-rose-400 rounded font-mono font-bold animate-pulse';
                showCinematicSubtitle("▶ 레이스를 재개합니다!");
            }
        }

        function updatePauseButtonUI() {
            const pauseIcon = document.getElementById('pause-icon');
            const pauseText = document.getElementById('pause-text');
            if (racePaused) {
                pauseIcon.className = 'fa-solid fa-play';
                pauseText.textContent = '계속';
            } else {
                pauseIcon.className = 'fa-solid fa-pause';
                pauseText.textContent = '일시중지';
            }
        }

        function finishRace() {
            raceEnded = true;
            racePaused = false;
            setControlsLocked(false);
            document.getElementById('btn-pause').disabled = true;

            document.getElementById('race-status-badge').textContent = 'FINISH';
            document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-yellow-500/20 text-yellow-300 rounded font-mono font-bold';

            const sorted = [...racers].sort((a, b) => a.finishTime - b.finishTime);
            showCinematicSubtitle(`🏆 1위 [${sorted[0].name}] 결승선 통과! 최종 챔피언!`);
            openResultModal(sorted);
        }

        function resetRace() {
            raceStarted = false;
            racePaused = false;
            raceEnded = false;
            raceTime = 0;
            finishedCount = 0;

            setControlsLocked(false);

            const modal = document.getElementById('result-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 400);

            const btn = document.getElementById('btn-start');
            btn.innerHTML = '<i class="fa-solid fa-play"></i><span>레이스 스타트</span>';
            btn.classList.replace('from-emerald-600', 'from-pink-600');
            btn.classList.replace('to-teal-600', 'to-rose-600');

            const btnPause = document.getElementById('btn-pause');
            btnPause.disabled = true;
            updatePauseButtonUI();

            document.getElementById('race-status-badge').textContent = 'READY';
            document.getElementById('race-status-badge').className = 'text-[10px] px-2 py-0.5 bg-cyan-500/20 text-cyan-300 rounded font-mono font-bold';

            const totalP = racers.length;
            racers.forEach((r, index) => {
                r.progress = Math.max(0, 0.005 - (index * 0.0006));
                r.laneOffset = totalP === 1 ? 0 : (-7.0 + (index / (totalP - 1)) * 14.0);
                r.targetLaneOffset = r.laneOffset;
                r.speedMultiplier = 1.0;
                r.spinTimer = 0;
                r.hasShield = false;
                r.bumperInvulTimer = 0;
                r.airLaunchHeight = 0;
                r.airLaunchVelocity = 0;
                r.flipperCooldown = 0;
                r.finished = false;
                r.finishTime = 0;
                r.currentItem = null;
                r.velocityOffset = 0;
                r.aiDecisionTimer = Math.random() * 0.4;
            });

            proceduralSpawnEntities();
            selectedTargetRacer = racers[0];
            alignRacersToTrack();
            updateLeaderboardUI();
            showCinematicSubtitle("🏁 서킷 준비 완료. [레이스 스타트]를 눌러주세요.");
        }

        function setControlsLocked(locked) {
            document.getElementById('map-select').disabled = locked;
            document.getElementById('btn-player-modal').disabled = locked;
        }

        function onSelectMap(mapKey) {
            if (raceStarted && !raceEnded) return;
            activeMapKey = mapKey;
            buildTrack(mapKey);
            resetRace();
            showCinematicSubtitle(`🗺️ 트랙 로딩 완료: [${trackPresets[mapKey].name}]`);
        }

        // --- 16. 엔트리 설정 모달 ---
        function openPlayerModal() {
            if (raceStarted && !raceEnded) return;
            renderPlayerEditList();
            const modal = document.getElementById('player-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 20);
        }

        function closePlayerModal() {
            const modal = document.getElementById('player-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function renderPlayerEditList() {
            const listEl = document.getElementById('player-edit-list');
            listEl.innerHTML = currentPlayers.map((p, idx) => `
                <div class="flex items-center gap-2 p-2 bg-white/5 rounded-xl border border-white/5">
                    <span class="text-xs font-mono text-white/50 w-6 text-center">${idx + 1}</span>
                    <input type="color" value="${p.color}" onchange="updatePlayerColor(${idx}, this.value)" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0 outline-none">
                    <input type="text" value="${p.name}" oninput="updatePlayerName(${idx}, this.value)" class="flex-1 bg-white/10 border border-white/10 rounded-lg px-2.5 py-1.5 text-xs text-white outline-none focus:border-purple-500 font-bold">
                    <button onclick="removePlayerSlot(${idx})" class="text-white/40 hover:text-rose-400 p-1.5 text-xs"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }

        function updatePlayerName(idx, val) { currentPlayers[idx].name = val; }
        function updatePlayerColor(idx, val) { currentPlayers[idx].color = val; }

        function removePlayerSlot(idx) {
            if (currentPlayers.length <= 1) {
                alert("최소 1명 이상의 참가자가 필요합니다.");
                return;
            }
            currentPlayers.splice(idx, 1);
            renderPlayerEditList();
        }

        function addNewPlayerSlot() {
            if (currentPlayers.length >= 16) {
                alert("최대 16명까지 참가할 수 있습니다.");
                return;
            }
            const colors = ['#00e5ff', '#ff007f', '#ffd700', '#00ff66', '#a855f7', '#ff6600', '#38bdf8'];
            currentPlayers.push({
                id: 'p' + (Date.now() % 10000),
                name: `구슬 ${currentPlayers.length + 1}`,
                color: colors[Math.floor(Math.random() * colors.length)],
                desc: '자율 주행 슈퍼 마블!'
            });
            renderPlayerEditList();
        }

        function applyBulkPlayers() {
            const input = document.getElementById('bulk-player-input').value.trim();
            if (!input) return;
            const names = input.split(',').map(s => s.trim()).filter(s => s.length > 0);
            if (names.length === 0) return;

            const palette = ['#ff2d75', '#00e5ff', '#ffd700', '#38bdf8', '#ef4444', '#00ff66', '#a855f7', '#ff6600'];
            currentPlayers = names.slice(0, 16).map((name, i) => ({
                id: 'p' + (i + 1),
                name: name,
                color: palette[i % palette.length],
                desc: '자율 주행 슈퍼 마블!'
            }));

            document.getElementById('bulk-player-input').value = '';
            renderPlayerEditList();
        }

        function resetDefaultPlayers() {
            currentPlayers = [
                { id: 'p1', name: 'JENNIE', color: '#ff2d75', desc: '황금빛 크롬 스틸볼 챔피언!' }
            ];
            renderPlayerEditList();
        }

        function saveAndApplyPlayers() {
            closePlayerModal();
            createRacers();
            resetRace();
            showCinematicSubtitle("✨ 참가 구슬 엔트리 설정 완료!");
        }

        // --- 17. 리더보드 & 모달 UI ---
        function updateLeaderboardUI() {
            const listEl = document.getElementById('leaderboard-list');
            if (!listEl) return;

            const sorted = [...racers].sort((a, b) => {
                if (a.finished && b.finished) return a.finishTime - b.finishTime;
                if (a.finished) return -1;
                if (b.finished) return 1;
                return b.progress - a.progress;
            });

            listEl.innerHTML = sorted.map((r, i) => `
                <div onclick="selectRacer('${r.id}')" class="flex items-center justify-between p-1.5 rounded-lg bg-white/5 hover:bg-white/10 cursor-pointer transition-all border ${selectedTargetRacer?.id === r.id ? 'border-pink-500 bg-pink-500/10' : 'border-transparent'}">
                    <div class="flex items-center space-x-2">
                        <span class="w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-black ${i === 0 ? 'bg-yellow-400 text-black' : i === 1 ? 'bg-slate-300 text-black' : i === 2 ? 'bg-amber-600 text-white' : 'bg-white/10 text-white'}">
                            ${i + 1}
                        </span>
                        <span class="font-bold text-[12px] tracking-wide" style="color: ${r.colorStr}">${r.name}</span>
                        ${r.currentItem ? `<span class="text-xs animate-bounce">${r.currentItem}</span>` : ''}
                    </div>
                    <span class="text-[10px] font-mono ${r.finished ? 'text-green-400 font-bold' : (r.airLaunchHeight > 0 ? 'text-yellow-300 font-bold animate-bounce' : (r.spinTimer > 0 ? 'text-red-400 font-bold animate-pulse' : (r.speedMultiplier > 1.5 ? 'text-cyan-300 font-bold' : 'text-white/60')))}">
                        ${r.finished ? 'GOAL!' : (r.airLaunchHeight > 0 ? 'LAUNCH!' : (r.spinTimer > 0 ? 'SPIN!' : (r.speedMultiplier > 1.5 ? 'BOOST!' : Math.floor(r.progress * 100) + '%')))}
                    </span>
                </div>
            `).join('');
        }

        function openResultModal(sorted) {
            const modal = document.getElementById('result-modal');
            const podiumEl = document.getElementById('podium-container');
            const rankingListEl = document.getElementById('modal-ranking-list');
            const winner = sorted[0];

            document.getElementById('winner-tagline').textContent = `🏆 최종 챔피언: [${winner.name}] - "${winner.desc}"`;

            const p1 = sorted[0], p2 = sorted[1], p3 = sorted[2];
            podiumEl.innerHTML = `
                ${p2 ? `
                <div class="flex flex-col items-center flex-1">
                    <span class="text-xs font-bold truncate max-w-[80px]" style="color: ${p2.colorStr}">${p2.name}</span>
                    <div class="w-full bg-slate-300/20 border-t-2 border-slate-300 h-16 rounded-t-xl flex items-center justify-center font-black text-slate-300 text-lg">2</div>
                </div>` : ''}
                <div class="flex flex-col items-center flex-1 -mt-4">
                    <i class="fa-solid fa-crown text-yellow-400 text-lg mb-1 animate-bounce"></i>
                    <span class="text-sm font-black truncate max-w-[90px]" style="color: ${p1.colorStr}">${p1.name}</span>
                    <div class="w-full bg-yellow-500/30 border-t-4 border-yellow-400 h-24 rounded-t-xl flex items-center justify-center font-black text-yellow-400 text-2xl shadow-lg">1</div>
                </div>
                ${p3 ? `
                <div class="flex flex-col items-center flex-1">
                    <span class="text-xs font-bold truncate max-w-[80px]" style="color: ${p3.colorStr}">${p3.name}</span>
                    <div class="w-full bg-amber-700/20 border-t-2 border-amber-600 h-12 rounded-t-xl flex items-center justify-center font-black text-amber-500 text-base">3</div>
                </div>` : ''}
            `;

            rankingListEl.innerHTML = sorted.slice(3).map((r, idx) => `
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-white/5 border border-white/5">
                    <div class="flex items-center space-x-2">
                        <span class="font-mono text-white/50 text-[11px]">${idx + 4}위</span>
                        <span class="font-bold text-xs" style="color: ${r.colorStr}">${r.name}</span>
                    </div>
                    <span class="text-white/40 text-[10px] font-mono">${r.finishTime.toFixed(2)}s</span>
                </div>
            `).join('');

            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 20);
        }

        function selectRacer(id) {
            const found = racers.find(r => r.id === id);
            if (found) {
                selectedTargetRacer = found;
                showCinematicSubtitle(`집중 타깃: [${found.name}]`);
                updateLeaderboardUI();
            }
        }

        function setCameraMode(mode) {
            cameraMode = mode;
            ['chase', 'action', 'drone', 'orbit'].forEach(m => {
                const btn = document.getElementById(`cam-${m}`);
                if (btn) {
                    btn.className = m === mode ? 
                        "px-3 py-1.5 bg-pink-600 rounded-xl text-xs font-bold text-white shadow-lg shadow-pink-600/50 flex items-center space-x-2" : 
                        "px-3 py-1.5 bg-white/10 hover:bg-pink-600 rounded-xl text-xs font-bold transition-all flex items-center space-x-2";
                }
            });
            showCinematicSubtitle(`카메라 앵글: ${mode.toUpperCase()}`);
        }

        function showCinematicSubtitle(text) {
            const subEl = document.getElementById('cinematic-subtitle');
            if (!subEl) return;
            subEl.querySelector('span').textContent = text;
            subEl.style.opacity = '1';
            subEl.style.transform = 'translateY(0)';

            clearTimeout(subEl._timeout);
            subEl._timeout = setTimeout(() => {
                subEl.style.opacity = '0';
                subEl.style.transform = 'translateY(16px)';
            }, 2600);
        }

        function setupMouseControls() {
            const container = document.getElementById('canvas-container');
            
            container.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                const deltaX = e.clientX - mouseX;
                const deltaY = e.clientY - mouseY;
                mouseX = e.clientX;
                mouseY = e.clientY;

                orbitAngleX -= deltaX * 0.008;
                orbitAngleY = Math.max(0.05, Math.min(Math.PI / 2 - 0.05, orbitAngleY + deltaY * 0.008));
            });

            window.addEventListener('mouseup', () => { isMouseDown = false; });
            
            container.addEventListener('wheel', (e) => {
                orbitRadius = Math.max(15, Math.min(500, orbitRadius + e.deltaY * 0.08));
            });
        }

        // --- 18. 메인 렌더 루프 ---
        function animate() {
            requestAnimationFrame(animate);

            const rawDelta = clock.getDelta();
            const deltaTime = Math.min(rawDelta, 0.1);

            if (raceStarted && !racePaused && !raceEnded && trackSpline) {
                raceTime += deltaTime;
                updatePhysicsAndItems(deltaTime);
                alignRacersToTrack();

                if (Math.floor(raceTime * 10) % 8 === 0) {
                    updateLeaderboardUI();
                }
            }

            const pTimeScale = deltaTime / 0.016;

            if (selectedTargetRacer && trackSpline) {
                const targetPos = selectedTargetRacer.mesh.position;
                const { tangent, normal, binormal } = getSurfaceOrientationAt(selectedTargetRacer.progress);

                let desiredCameraPos = new THREE.Vector3();

                if (cameraMode === 'chase') {
                    const baseOffset = tangent.clone().multiplyScalar(-orbitRadius * 0.15)
                        .add(normal.clone().multiplyScalar(orbitRadius * 0.06));
                    
                    const rotatedOffset = baseOffset.clone()
                        .add(binormal.clone().multiplyScalar(Math.sin(orbitAngleX) * (orbitRadius * 0.2)))
                        .add(normal.clone().multiplyScalar((orbitAngleY - Math.PI / 4) * (orbitRadius * 0.25)));

                    desiredCameraPos.copy(targetPos).add(rotatedOffset);
                    camera.position.lerp(desiredCameraPos, 0.12 * pTimeScale);
                    camera.lookAt(targetPos.clone().add(normal.clone().multiplyScalar(1.5)));

                } else if (cameraMode === 'action') {
                    const baseOffset = binormal.clone().multiplyScalar(Math.cos(orbitAngleX) * (orbitRadius * 0.15))
                        .add(tangent.clone().multiplyScalar(Math.sin(orbitAngleX) * (orbitRadius * 0.15)))
                        .add(normal.clone().multiplyScalar(Math.sin(orbitAngleY) * (orbitRadius * 0.12)));

                    desiredCameraPos.copy(targetPos).add(baseOffset);
                    camera.position.lerp(desiredCameraPos, 0.12 * pTimeScale);
                    camera.lookAt(targetPos);

                } else if (cameraMode === 'drone') {
                    const droneHeight = Math.sin(orbitAngleY) * (orbitRadius * 0.8) + 20;
                    const droneDist = Math.cos(orbitAngleY) * (orbitRadius * 0.8);
                    
                    desiredCameraPos.copy(targetPos)
                        .add(new THREE.Vector3(Math.sin(orbitAngleX) * droneDist, droneHeight, Math.cos(orbitAngleX) * droneDist));

                    camera.position.lerp(desiredCameraPos, 0.09 * pTimeScale);
                    camera.lookAt(targetPos);

                } else if (cameraMode === 'orbit') {
                    const cx = targetPos.x + Math.sin(orbitAngleX) * Math.cos(orbitAngleY) * orbitRadius;
                    const cz = targetPos.z + Math.cos(orbitAngleX) * Math.cos(orbitAngleY) * orbitRadius;
                    const cy = targetPos.y + Math.sin(orbitAngleY) * orbitRadius;
                    camera.position.set(cx, cy, cz);
                    camera.lookAt(targetPos);
                }
            }

            if (screenShakeIntensity > 0) {
                camera.position.x += (Math.random() - 0.5) * screenShakeIntensity;
                camera.position.y += (Math.random() - 0.5) * screenShakeIntensity;
                screenShakeIntensity *= Math.pow(0.9, pTimeScale);
            }

            if (composer) {
                composer.render();
            } else if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }

            drawMinimap();
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if (composer) composer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function() {
            window.addEventListener('keydown', (e) => {
                const tag = e.target.tagName.toLowerCase();
                if (tag === 'input' || tag === 'textarea' || e.target.isContentEditable) return;

                if (e.code === 'Space' || e.key === ' ') {
                    e.preventDefault();
                    if (raceEnded) return;

                    if (!raceStarted) {
                        startRace();
                    } else {
                        togglePauseRace();
                    }
                }
            });

            initThree();
            animate();
            showCinematicSubtitle("🎬 엔트리 설정 후 [레이스 스타트] 또는 [Space]");
        };
    </script>
</body>
